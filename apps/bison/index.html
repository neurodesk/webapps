<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BISON tissue segmentation — NeuroDesk</title>
  </head>
  <body>
    <header id="controls">
      <details class="nd-sidebar-section" id="inputSection" open>
        <summary class="nd-section-title">Input images</summary>
        <div class="nd-section-content">
          <div id="exampleControl"></div>
          <label class="nd-file" id="dropZone">
            <input id="imageInput" type="file" data-neurodesk-input="image" multiple aria-label="Choose a T1-weighted image or DICOM series" />
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span>Drop a T1 image or DICOM series</span>
          </label>
          <p id="fileInfo" class="nd-file-info" hidden></p>
          <div class="nd-field" id="flairField">
            <label for="flairInput">FLAIR <small>optional</small>
              <span class="nd-info-icon" tabindex="0" aria-label="About the FLAIR">i<span class="nd-info-tooltip">With a FLAIR of the same session, BISON-WMH also classifies white matter hyperintensities (WMH). The FLAIR is registered to the T1 first.</span></span>
            </label>
            <p id="flairInfo" class="nd-file-info" hidden></p>
          </div>
        </div>
      </details>

      <details class="nd-sidebar-section" id="taskSection" open>
        <summary class="nd-section-title">Tissue segmentation</summary>
        <div class="nd-section-content">
          <p id="modeHint" class="nd-hint">Load a T1 image. A FLAIR is optional.</p>
          <button id="runButton" class="nd-btn nd-btn-primary" type="button" disabled>Run segmentation</button>
        </div>
      </details>

      <details class="nd-sidebar-section" id="outputSection">
        <summary class="nd-section-title">Output</summary>
        <div class="nd-section-content">
          <div id="classLegend" aria-label="Tissue classes and volumes" hidden></div>
          <div id="resultList"></div>
          <button id="downloadAll" class="nd-btn nd-btn-secondary" type="button" hidden>Download all (zip)</button>
        </div>
      </details>

      <button id="privacyBtn" type="button" hidden>Privacy</button>
    </header>

    <main id="viewer">
      <div class="nd-viewer-canvas-wrapper">
        <canvas id="gl1" aria-label="Image viewer"></canvas>
        <p id="emptyState" class="nd-viewer-empty">Drop a T1 image anywhere, or choose an example.</p>
        <p id="viewerNotice" class="nd-viewer-notice" hidden></p>
      </div>
      <div class="nd-viewer-info"><span id="location" class="nd-viewer-info-primary"></span></div>
    </main>

    <footer id="status">
      <span class="nd-status-label">Status</span>
      <span id="statusText" class="nd-status-text" role="status" aria-live="polite">Drag and drop files</span>
      <span id="elapsed" class="nd-status-elapsed"></span>
      <progress id="progress" max="1" value="0" aria-label="Processing progress"></progress>
      <button id="cancelButton" class="nd-btn-cancel" type="button" title="Cancel processing" aria-label="Cancel processing" hidden>×</button>
    </footer>

    <template id="privacyContent">
      <p>Images are processed locally in this browser and are never uploaded. The template and the BISON model files are downloaded from Hugging Face, checked against their pinned checksums and cached in this browser.</p>
    </template>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
