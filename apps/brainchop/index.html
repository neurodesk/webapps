<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brainchop | Neurodesk</title>
  </head>
  <body>
    <header id="controls">
      <details class="nd-sidebar-section" id="inputSection" open>
        <summary class="nd-section-title">Input image</summary>
        <div class="nd-section-content">
          <div id="exampleControl"></div>
          <div id="filePicker"></div>
          <p id="fileInfo" class="nd-file-info" hidden></p>
        </div>
      </details>
      <details class="nd-sidebar-section" id="taskSection" open>
        <summary class="nd-section-title">Segmentation</summary>
        <div class="nd-section-content">
          <div class="nd-field">
            <label for="method">Model</label>
            <select id="method"></select>
            <p id="methodHint" class="nd-hint"></p>
          </div>
          <details class="nd-sidebar-section" id="advancedSettings">
            <summary class="nd-section-title">Advanced settings</summary>
            <div class="nd-section-content">
              <div class="nd-field">
                <label for="backend">Processing</label>
                <select id="backend">
                  <option value="auto">Automatic</option>
                  <option value="cpu">CPU</option>
                </select>
                <p class="nd-hint">Choose CPU if graphics processing is slow or unavailable.</p>
              </div>
              <div class="nd-field">
                <label class="nd-check"><input id="saveConform" type="checkbox" /> Keep conformed 256³ 1 mm grid</label>
                <p class="nd-hint">By default, outputs are resliced back to the input image grid.</p>
              </div>
            </div>
          </details>
          <button id="runButton" class="nd-btn nd-btn-primary" type="button" disabled>Run segmentation</button>
        </div>
      </details>
      <details class="nd-sidebar-section" id="outputSection">
        <summary class="nd-section-title">Output</summary>
        <div class="nd-section-content">
          <div id="resultList"></div>
        </div>
      </details>
      <button id="aboutBtn" type="button" hidden>About</button>
      <button id="privacyBtn" type="button" hidden>Privacy</button>
    </header>

    <main id="viewer">
      <div class="nd-viewer-canvas-wrapper">
        <canvas id="gl1" aria-label="Image viewer"></canvas>
        <p id="emptyState" class="nd-viewer-empty">Drop an image anywhere, or choose an example.</p>
        <p id="viewerNotice" class="nd-viewer-notice" hidden></p>
      </div>
      <div class="nd-viewer-info"><span id="location" class="nd-viewer-info-primary"></span></div>
    </main>

    <footer id="status">
      <span class="nd-status-label">Status</span>
      <span id="statusText" class="nd-status-text" role="status" aria-live="polite">Drag and drop files</span>
      <span id="elapsed" class="nd-status-elapsed"></span>
      <progress id="progress" max="1" value="0" aria-label="Processing progress"></progress>
      <button id="cancelButton" class="nd-btn-cancel" type="button" title="Cancel processing" aria-label="Cancel processing" hidden>×</button>
    </footer>

    <template id="aboutContent"><p>Segment T1-weighted brain MRI into subcortical and cortical regions or continuous GM, WM and CSF partial-volume fraction maps with Brainchop v4.0 MeshNet models. Outputs return on the input image grid unless conformed output is enabled. Research use only.</p></template>
    <template id="privacyContent"><p>Images are processed locally in this browser and are never uploaded.</p></template>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
