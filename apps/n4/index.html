<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>N4 — NeuroDesk</title>
  </head>
  <body>
    <header id="controls">
      <details class="nd-sidebar-section" id="inputSection" open>
        <summary class="nd-section-title">Input image</summary>
        <div class="nd-section-content">
          <div id="exampleControl"></div>
          <label class="nd-file" id="dropZone">
            <input id="imageInput" type="file" data-neurodesk-input="image" multiple aria-label="Choose a NIfTI image (a DWI with its bval and bvec) or DICOM files" />
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span>Drop NIfTI or DICOM files or folder</span>
          </label>
          <p id="fileInfo" class="nd-file-info" hidden></p>
        </div>
      </details>

      <details class="nd-sidebar-section" id="taskSection" open>
        <summary class="nd-section-title">Bias-field correction</summary>
        <div class="nd-section-content">
          <p id="modeNote" class="nd-hint" hidden></p>
          <details class="nd-sidebar-section" id="advancedSettings">
            <summary class="nd-section-title">Advanced settings</summary>
            <div class="nd-section-content">
              <div class="nd-field">
                <label for="maskInput">Brain mask <small>optional</small>
                  <span class="nd-info-icon" tabindex="0" aria-label="About the brain mask">i<span class="nd-info-tooltip">N4 weights the fit by this mask. Without one, MindGrab extracts the brain from the mean b0 (or from the image).</span></span>
                </label>
                <label class="nd-file" id="maskDrop">
                  <input id="maskInput" type="file" data-neurodesk-input="image" multiple aria-label="Choose a brain mask" />
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                  <span>Drop a mask on the image grid</span>
                </label>
                <p id="maskInfo" class="nd-file-info" hidden></p>
              </div>
            </div>
          </details>
          <button id="runButton" class="nd-btn nd-btn-primary" type="button" disabled>Correct bias field</button>
        </div>
      </details>

      <details class="nd-sidebar-section" id="outputSection">
        <summary class="nd-section-title">Output</summary>
        <div class="nd-section-content">
          <div id="resultList"></div>
        </div>
      </details>

      <button id="aboutBtn" type="button" hidden>About</button>
      <button id="privacyBtn" type="button" hidden>Privacy</button>
    </header>

    <main id="viewer">
      <div class="nd-viewer-canvas-wrapper">
        <canvas id="gl1" aria-label="Image viewer"></canvas>
        <p id="emptyState" class="nd-viewer-empty">Drop an image anywhere, or choose an example.</p>
      </div>
      <div class="nd-viewer-info"><span id="location" class="nd-viewer-info-primary"></span></div>
    </main>

    <footer id="status">
      <span class="nd-status-label">Status</span>
      <span id="statusText" class="nd-status-text" role="status" aria-live="polite">Drag and drop files</span>
      <span id="elapsed" class="nd-status-elapsed"></span>
      <progress id="progress" max="1" value="0" aria-label="Correction progress"></progress>
      <button id="cancelButton" class="nd-btn-cancel" type="button" title="Cancel correction" aria-label="Cancel correction" hidden>×</button>
    </footer>

    <template id="aboutContent">
      <p>N4 removes the slow intensity variation that coil sensitivity puts on MRI, in this browser, with ANTs N4BiasFieldCorrection compiled to WebAssembly (the same ANTs commit as SYNcro; its bias field equals native ANTs 2.6.5). For a DWI with its bval and bvec it follows MRtrix dwibiascorrect ants: N4 on the mean b0 weighted by the brain mask, the field rescaled to keep the brain's total signal, and every volume divided by it. A 3D image is corrected directly. The settings are dwibiascorrect's: shrink factor 4, B-spline mesh 100 mm of order 3, up to 1000 iterations. In a diffusion pipeline, correct the bias field after motion and distortion correction.</p>
    </template>
    <template id="privacyContent"><p>Images are processed locally in this browser and are never uploaded.</p></template>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
