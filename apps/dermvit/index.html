<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DermViT — NeuroDesk</title>
  </head>
  <body>
    <header id="controls">
      <details class="nd-sidebar-section" id="inputSection" open>
        <summary class="nd-section-title">Input image</summary>
        <div class="nd-section-content">
          <div id="exampleControl"></div>
          <label class="nd-file" id="dropZone">
            <input id="imageInput" type="file" data-neurodesk-input="image" multiple aria-label="Choose dermoscopy image" />
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span>Drop a dermoscopy image (JPEG or PNG)</span>
          </label>
          <p id="fileInfo" class="nd-file-info" hidden></p>
        </div>
      </details>

      <details class="nd-sidebar-section" id="taskSection" open>
        <summary class="nd-section-title">Classification</summary>
        <div class="nd-section-content">
          <label class="nd-check">
            <input id="colorConstancy" type="checkbox" />
            <span>Shades of Gray color constancy (p=6)</span>
            <span class="nd-info-icon" tabindex="0" aria-label="About color constancy">i<span class="nd-info-tooltip">Applies Minkowski p=6 Shades of Gray white balance before antialiased bilinear resizing to 224 × 224 to reduce illumination color casts.</span></span>
          </label>
          <label class="nd-check">
            <input id="computeSaliency" type="checkbox" />
            <span>5×5 occlusion sensitivity map</span>
            <span class="nd-info-icon" tabindex="0" aria-label="About occlusion sensitivity">i<span class="nd-info-tooltip">Masks each cell of a 5 × 5 grid with neutral grey and measures relative top-class softmax score drop across 25 passes (Zeiler &amp; Fergus, 2014).</span></span>
          </label>
          <details class="nd-sidebar-section" id="advancedSettings">
            <summary class="nd-section-title">Advanced settings</summary>
            <div class="nd-section-content">
              <div class="nd-field">
                <label for="backend">Inference backend
                  <span class="nd-info-icon" tabindex="0" aria-label="About inference backend">i<span class="nd-info-tooltip">Automatic uses WebGPU when supported by the browser and quantized ops, falling back to multi-threaded WebAssembly on the CPU.</span></span>
                </label>
                <select id="backend">
                  <option value="auto" selected>Automatic</option>
                  <option value="webgpu">WebGPU</option>
                  <option value="wasm">WebAssembly (CPU)</option>
                </select>
              </div>
            </div>
          </details>
          <button id="runButton" class="nd-btn nd-btn-primary" type="button" disabled>Classify lesion</button>
          <p class="nd-hint">Research use only; uncalibrated softmax scores.</p>
        </div>
      </details>

      <details class="nd-sidebar-section" id="outputSection">
        <summary class="nd-section-title">Output</summary>
        <div class="nd-section-content">
          <div id="resultList"></div>
        </div>
      </details>

      <button id="aboutBtn" type="button" hidden>About</button>
      <button id="privacyBtn" type="button" hidden>Privacy</button>
    </header>

    <main id="viewer">
      <div class="nd-viewer-canvas-wrapper">
        <canvas id="canvas" class="dermvit-canvas" aria-label="Dermoscopy image and saliency overlay viewer"></canvas>
        <p id="emptyState" class="nd-viewer-empty">Drop an image anywhere, or choose an example.</p>
        <section id="report" class="nd-viewer-report" aria-label="Classification report" hidden></section>
      </div>
      <div class="nd-viewer-info"><span id="location" class="nd-viewer-info-primary"></span></div>
    </main>

    <footer id="status">
      <span class="nd-status-label">Status</span>
      <span id="statusText" class="nd-status-text" role="status" aria-live="polite">Drag and drop files</span>
      <span id="elapsed" class="nd-status-elapsed"></span>
      <progress id="progress" max="1" value="0" aria-label="Processing progress"></progress>
      <button id="cancelButton" class="nd-btn-cancel" type="button" title="Cancel processing" aria-label="Cancel processing" hidden>×</button>
    </footer>

    <template id="aboutContent">
      <p>DermViT classifies dermoscopic skin lesion images locally in your browser using an 8-bit quantized Vision Transformer (<code>ViT-Base-Patch16-224</code>) fine-tuned on the 7-class HAM10000 dataset (NV, MEL, BKL, BCC, AKIEC, VASC, DF) and executed with ONNX Runtime Web.</p>
      <p><strong>Preprocessing &amp; Interpretability.</strong> Images are decoded to sRGB (compositing partial transparency over white), optionally color-normalized using Shades of Gray (Minkowski p=6), resized to 224 × 224 with Pillow-equivalent antialiased bilinear filtering, and normalized to [-1, 1] per RGB channel. Outputs are uncalibrated softmax scores, not clinical probabilities. Optional 5 × 5 occlusion sensitivity (Zeiler &amp; Fergus, ECCV 2014) masks each patch with neutral grey across 25 forward passes to show relative drop in the top-class softmax score.</p>
      <p><strong>Research Use Only.</strong> DermViT is an educational and research exploration tool. It is not a medical device and must not be used for clinical diagnosis, screening, or triage.</p>
    </template>
    <template id="privacyContent">
      <p>Images are processed locally in this browser and are never uploaded. The quantized ONNX model (87 MB) and selected ISIC Archive examples are downloaded from Hugging Face and cached locally by your browser.</p>
    </template>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
