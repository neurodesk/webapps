<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./src/style.css">

  <title>dwi2trx</title>
</head>

<body>
  <header id="controls">
    <details class="nd-sidebar-section" id="inputSection" open="">
      <summary class="nd-section-title">1 · Input DWI</summary>
      <div class="nd-section-content">
        <p class="nd-hint">Choose an example, or open a NIfTI + bval + bvec set or a DICOM folder.</p>
        <div class="nd-section-content">

          <label class="nd-file">
<input type="file" id="filePicker" data-neurodesk-input="image" multiple="">
<span>Choose or drop NIfTI + bval + bvec, or DICOM files</span></label>
          <button type="button" id="showVecBtn" disabled="" title="Inspect the diffusion gradient sampling scheme (bvec/bval) in 3D" class="nd-btn nd-btn-secondary nd-btn-sm">Show vectors</button>
          <button type="button" id="maskFitBtn" disabled="" title="Brain-extract the b0 with mindgrab (WebGPU), then fit the tensor" class="nd-btn nd-btn-primary">Mask + fit tensor</button>
        </div>
      </div>
    </details>
    <details class="nd-sidebar-section" id="tensorSection">
      <summary class="nd-section-title">2 · Tensor maps</summary>
      <div class="nd-section-content" inert="">
        <div class="nd-section-content">
          <label for="displayMode">Display</label>
          <select id="displayMode" title="How to display the tensor maps">
            <option value="0">FA</option>
            <option value="1">V1</option>
            <option value="2">V1 modulated by FA</option>
            <option value="3">V1 (isV1SliceShader)</option>
            <option value="4" selected="">V1 modulated by FA (isV1SliceShader)</option>
          </select>
          <label for="faSlider">FA floor</label>
          <input type="range" min="0" max="100" value="10" class="slider" id="faSlider" title="Hide voxels below this fractional-anisotropy threshold">
          <button type="button" id="saveMapsBtn" disabled="" title="Download the FA + V1 NIfTI maps" class="nd-btn nd-btn-secondary nd-btn-sm">Save maps</button>
        </div>
      </div>
    </details>
    <details class="nd-sidebar-section" id="trackingSection">
      <summary class="nd-section-title">3 · Streamlines</summary>
      <div class="nd-section-content" inert="">
        <div class="nd-section-content">
          <label for="seedFa" title="Seed streamlines only where FA ≥ this">Seed FA</label>
          <input type="number" id="seedFa" min="0" max="1" step="0.05" value="0.25">
          <label for="stopFa" title="Stop a streamline where FA falls below this">Stop FA</label>
          <input type="number" id="stopFa" min="0" max="1" step="0.05" value="0.10">
          <label for="stepSize" title="Integration step size, in voxels">Step</label>
          <input type="number" id="stepSize" min="0.1" max="2" step="0.1" value="0.5">
          <label for="maxAngle" title="Maximum turn angle per step, in degrees">Angle°</label>
          <input type="number" id="maxAngle" min="10" max="90" step="5" value="60">
          <label for="seedDensity" title="Seeds per voxel along each axis (count = value³)">Density</label>
          <input type="number" id="seedDensity" min="1" max="4" step="1" value="1">
          <button type="button" id="trackBtn" class="nd-btn nd-btn-secondary nd-btn-sm">Generate streamlines</button>
        </div>
        <div class="nd-section-content">
          <label for="fiberColor">Fiber color</label>
          <select id="fiberColor" title="How to colour the streamlines">
            <option value="local" selected="">Local direction</option>
            <option value="global">Global direction</option>
            <option value="fixed">Fixed</option>
          </select>
          <button type="button" id="saveBtn" disabled="" class="nd-btn nd-btn-secondary nd-btn-sm">Save TRX</button>
        </div>
      </div>
    </details>
    <details class="nd-sidebar-section" id="viewSection">
      <summary class="nd-section-title">View and tools</summary>
      <div class="nd-section-content">
        <div class="nd-section-content">
          <label for="sliceType">View</label>
        <select id="sliceType" title="How to display the volume">
          <option value="0">Axial</option>
          <option value="1">Coronal</option>
          <option value="2">Sagittal</option>
          <option value="3" selected="">A+C+S+R</option>
          <option value="4">Render</option>
        </select>
        <button type="button" id="genVecBtn" title="Generate a uniform multi-shell diffusion vector set for Siemens, GE, or Philips" class="nd-btn nd-btn-secondary nd-btn-sm">Generate Vectors</button>
        </div>
      </div>
    </details>
    <button type="button" id="aboutBtn" hidden>About</button>

    <button type="button" id="privacyBtn" hidden>Privacy</button>
  </header>

  <main id="canvas-container">
<div class="nd-viewer-canvas-wrapper">
<canvas id="gl1">
</canvas>
<p id="emptyState" class="nd-viewer-empty">Load a diffusion MRI study to begin.</p>
<div id="dropOverlay" class="nd-viewer-notice" hidden>Drop files to load</div>
</div>


  <div class="nd-viewer-info" id="location">
</div>
</main>

  <footer id="status">
<span class="nd-status-label">Status</span>
<span id="statusText" class="nd-status-text" role="status">Ready · load a diffusion MRI study</span>
<progress id="progress" max="1" value="0" aria-label="Processing progress"></progress>
</footer>

  <template id="aboutDlgContent">

    <p>A browser-only diffusion-MRI pipeline: load a DWI, fit the diffusion tensor, track streamlines, and save a TRX tractogram. Everything runs client-side — no data leaves your machine.</p>
    <p>It is built on
      <a href="https://github.com/niivue/niivue" target="_blank" rel="noopener">NiiVue</a> (visualization),
      <a href="https://github.com/niivue/niivue-dcm2niix" target="_blank" rel="noopener">dcm2niix</a> (image conversion),
      <a href="https://github.com/rordenlab/niimath" target="_blank" rel="noopener">niimath</a> (image processing),
      <a href="https://www.npmjs.com/package/@brainchop/mindgrab" target="_blank" rel="noopener">brainchop</a>'s mindgrab (masking), and
      <a href="https://github.com/dipy/GPUStreamlines" target="_blank" rel="noopener">GPUStreamlines</a> to extract tracts from diffusion data.</p>
    <p>
<strong>Show vectors</strong> plots the diffusion gradient scheme (bvec/bval) in 3D — each direction as a ball at its b-vector, sized by how many samples repeat it and coloured by b-value. Inspecting it reveals the sampling distribution: whole- vs half-sphere coverage and single- vs multi-shell acquisitions. For why this matters, see the
      <a href="https://fsl.fmrib.ox.ac.uk/fsl/docs/diffusion/eddy/index.html" target="_blank" rel="noopener">FSL eddy documentation</a> and Winkler's
      <a href="https://brainder.org/2025/05/05/15656/" target="_blank" rel="noopener">Uniform directions for multi-shell diffusion MRI</a>.</p>

  </template>



  <template id="privacyDlgContent">

    <p>dwi2trx processes your imaging data locally in your browser. The app does not upload your DWI, gradients, tensor maps, or tractograms.</p>

  </template>

  <template id="largeInputDlgContent">

    <p id="largeInputSummary"></p>
    <p>dwi2trx runs entirely in your browser. JavaScript and WebAssembly require contiguous in-memory arrays and currently cannot process an input this large, even when the computer has substantially more physical RAM.</p>
    <p>For this exceptional dataset, use a native diffusion-MRI pipeline or split/crop the acquisition before loading it. No data was uploaded or processed.</p>

  </template>

  <!-- Gradient sampling-scheme viewer: an independent NiiVue render of the
       bvec/bval as a ball connectome. Rotate to inspect; Esc / Close dismisses. -->
  <template id="vecDlgContent">
    <div class="nd-field">
      <strong>Gradient sampling scheme</strong>
      <span class="vecdlg-spacer"></span>
      <label for="vecShowAntipodal" title="Preview the equivalent opposite direction as a smaller node; these nodes are not part of the loaded data.">
        <input type="checkbox" id="vecShowAntipodal">
        Show antipodal
      </label>
      <label for="vecScale" title="Scale the node radii">Node size</label>
      <input type="range" id="vecScale" min="0.2" max="4" step="0.1" value="1" title="Scale the node radii">

    </div>
    <div class="vecdlg-body">
      <canvas id="vecCanvas" class="dwi2trx-vector-canvas">
</canvas>
      <p class="nd-hint" id="vecInfo">Reading gradients…</p>
    </div>
  </template>

  <!-- Diffusion vector-set generator: uniform multi-shell directions (antipodal
       electrostatic repulsion), previewed as a connectome and saved in scanner
       vector formats. -->
  <template id="genVecDlgContent">
    <div class="nd-field">
      <strong>Generate diffusion vectors</strong>
      <span class="vecdlg-spacer"></span>
      <label for="genVecShowAntipodal" title="Preview the equivalent opposite direction as a smaller node; these nodes are not saved.">
        <input type="checkbox" id="genVecShowAntipodal">
        Show antipodal
      </label>
      <label for="genVecScale" title="Scale the node radii">Node size</label>
      <input type="range" id="genVecScale" min="0.2" max="4" step="0.1" value="1" title="Scale the node radii">
      <button type="button" id="genVecSaveBtn" disabled="" title="Download a Siemens .dvs vector set" class="nd-btn nd-btn-secondary nd-btn-sm">Save Siemens</button>
      <button type="button" id="genVecSaveDatBtn" disabled="" title="Download a GE tensor .dat vector set" class="nd-btn nd-btn-secondary nd-btn-sm">Save GE</button>
      <button type="button" id="genVecSavePhilipsBtn" disabled="" title="Download a Philips dti_vectors_input.txt vector set. Each shell is optimized separately, so directions differ between b-values — Philips FiberTrak needs the same directions for every b-value, so process these acquisitions externally." class="nd-btn nd-btn-secondary nd-btn-sm">Save Philips</button>

    </div>
    <div class="genvec-body">
      <div class="genvec-side">
        <div class="genvec-label">Shells (directions × b-value)</div>
        <div class="genvec-shells" id="genVecShells">
</div>
        <div class="nd-row">
          <button type="button" id="genVecAddShell" class="nd-btn nd-btn-secondary nd-btn-sm">+ Add shell</button>
          <button type="button" id="genVecDelShell" class="nd-btn nd-btn-secondary nd-btn-sm" title="Remove the last shell">− Remove shell</button>
        </div>
        <div class="nd-field">
          <label class="nd-check" for="genVecSimultaneous" title="Checked: simultaneous Winkler optimization (α applies) with duty-cycle ordering. Unchecked: incremental Caruyer behavior (no α), preserving useful truncated prefixes.">
            <input type="checkbox" id="genVecSimultaneous" checked="">
            Simultaneous optimization
          </label>
          <label for="genVecAlpha" title="Balance per-shell uniformity (1) against whole-scheme uniformity (0)">Uniformity α: <span id="genVecAlphaVal">0.75</span></label>
          <input type="range" id="genVecAlpha" min="0.5" max="1" step="0.05" value="0.75">
          <label for="genVecB0" title="Insert a b0 before every N directions (0 = one leading b0 only)">b0 every</label>
          <input type="number" id="genVecB0" min="0" max="100" step="1" value="12">
        </div>
      </div>
      <div class="genvec-view">
        <canvas id="genVecCanvas" class="dwi2trx-vector-canvas">
</canvas>
        <p class="nd-hint" id="genVecInfo">Set shell counts and b-values to generate a scheme.</p>
      </div>
    </div>
  </template>

  <script type="module" src="./src/main.ts">
</script>



</body>
</html>
