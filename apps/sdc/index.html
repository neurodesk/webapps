<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SDC — NeuroDesk</title>
  </head>
  <body>
    <header id="controls">
      <details class="nd-sidebar-section" id="inputSection" open>
        <summary class="nd-section-title">Input images</summary>
        <div class="nd-section-content">
          <div id="exampleControl"></div>
          <label class="nd-file" id="dropZone">
            <input id="imageInput" type="file" data-neurodesk-input="image" multiple aria-label="Choose two images with opposite phase-encoding directions, with their JSON sidecars and an optional bval" />
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span id="dropText">Drop an AP/PA pair with sidecars, NIfTI or DICOM</span>
          </label>
          <p id="fileInfo" class="nd-file-info" hidden></p>
          <p id="pairInfo" class="nd-file-info" hidden></p>
        </div>
      </details>

      <details class="nd-sidebar-section" id="taskSection" open>
        <summary class="nd-section-title">Field estimation</summary>
        <div class="nd-section-content">
          <div class="nd-field">
            <label for="method">Method
              <span class="nd-info-icon" tabindex="0" aria-label="About the methods">i<span class="nd-info-tooltip">PyHySCO 0.0.4 estimates the field from a reverse phase-encoding b = 0 pair. SyN-SDC (sdcflows 2.17.1, fieldmap-less) registers the mean b0 to a T1w along the phase-encoding axis and corrects the DWI series; the example takes about an hour.</span></span>
            </label>
            <select id="method">
              <option value="pyhysco" selected>PyHySCO</option>
              <option value="syn">SyN-SDC</option>
            </select>
          </div>
          <div id="pyhyscoFields">
            <div class="nd-field">
              <label for="reference">Field reference
                <span class="nd-info-icon" tabindex="0" aria-label="About the field reference">i<span class="nd-info-tooltip">The field is written on this image's grid, with topup's sign for its phase-encoding direction. The DWI series is chosen when one input has a bval.</span></span>
              </label>
              <select id="reference" disabled><option value="0">Image 1</option></select>
            </div>
            <p class="nd-hint">Both images in one space; their b = 0 volumes are averaged.</p>
          </div>
          <div id="synFields" hidden>
            <div class="nd-field" id="directionField" hidden>
              <label for="direction">Phase-encoding direction
                <span class="nd-info-icon" tabindex="0" aria-label="About the phase-encoding direction">i<span class="nd-info-tooltip">No sidecar gives PhaseEncodingDirection. Give it as BIDS does, along the image's voxel axes: j- is AP on most axial scans. SyN-SDC never guesses it.</span></span>
              </label>
              <select id="direction">
                <option value="" selected>Choose</option>
                <option value="i">i</option>
                <option value="i-">i-</option>
                <option value="j">j</option>
                <option value="j-">j-</option>
                <option value="k">k</option>
                <option value="k-">k-</option>
              </select>
            </div>
            <div class="nd-field" id="readoutField" hidden>
              <label for="readout">Total readout time (s)
                <span class="nd-info-icon" tabindex="0" aria-label="About the total readout time">i<span class="nd-info-tooltip">No sidecar gives TotalReadoutTime or EffectiveEchoSpacing. It scales the field in Hz; the corrected images do not depend on it.</span></span>
              </label>
              <input id="readout" type="number" min="0" step="any" inputmode="decimal" placeholder="0.038" />
            </div>
            <details class="nd-sidebar-section" id="advancedSettings">
              <summary class="nd-section-title">Advanced settings</summary>
              <div class="nd-section-content">
                <div class="nd-field">
                  <label for="prior">Prior
                    <span class="nd-info-icon" tabindex="0" aria-label="About the prior">i<span class="nd-info-tooltip">sdcflows' distortion atlas (Treiber et al. 2016), brought to the T1w by an affine registration to MNI152NLin2009cAsym, limits the second SyN stage to where distortion is expected. Without it the T1w mask takes its place.</span></span>
                  </label>
                  <select id="prior">
                    <option value="atlas" selected>Distortion atlas</option>
                    <option value="none">None</option>
                  </select>
                </div>
                <div class="nd-field">
                  <label for="dwiMaskInput">DWI brain mask (optional)</label>
                  <div id="dwiMaskField"></div>
                </div>
                <div class="nd-field">
                  <label for="t1wMaskInput">T1w brain mask (optional)</label>
                  <div id="t1wMaskField"></div>
                </div>
                <button id="clearMasks" class="nd-btn nd-btn-secondary" type="button" hidden>Use MindGrab masks</button>
              </div>
            </details>
          </div>
          <button id="runButton" class="nd-btn nd-btn-primary" type="button" disabled>Estimate field</button>
        </div>
      </details>

      <details class="nd-sidebar-section" id="outputSection">
        <summary class="nd-section-title">Output</summary>
        <div class="nd-section-content">
          <div id="resultList"></div>
        </div>
      </details>

      <button id="privacyBtn" type="button" hidden>Privacy</button>
    </header>

    <main id="viewer">
      <div class="nd-viewer-canvas-wrapper">
        <canvas id="gl1" aria-label="Image viewer"></canvas>
        <p id="emptyState" class="nd-viewer-empty">Drop an image pair anywhere, or choose an example.</p>
      </div>
      <div class="nd-viewer-info"><span id="location" class="nd-viewer-info-primary"></span></div>
    </main>

    <footer id="status">
      <span class="nd-status-label">Status</span>
      <span id="statusText" class="nd-status-text" role="status" aria-live="polite">Drag and drop files</span>
      <span id="elapsed" class="nd-status-elapsed"></span>
      <progress id="progress" max="1" value="0" aria-label="Estimation progress"></progress>
      <button id="cancelButton" class="nd-btn-cancel" type="button" title="Cancel estimation" aria-label="Cancel estimation" hidden>×</button>
    </footer>

    <template id="privacyContent"><p>Images are processed locally in this browser and are never uploaded.</p></template>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
