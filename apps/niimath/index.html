<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./favicon.ico" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>NiiMath | Neurodesk Webapps</title>
    <link rel="stylesheet" href="./niivue.css" />
  </head>
  <body>

    <header>
      <details class="control-section nd-sidebar-section" open>
      <summary class="nd-section-title" id="inputHeading">1. Input image</summary>
      <div class="nd-section-content">
      <div id="exampleControl"></div>
      <label class="nd-file" id="inputDropZone">
        <input id="niftiInput" type="file" data-neurodesk-input="image" multiple aria-label="Choose NIfTI or DICOM files" />
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span>Drop NIfTI or DICOM files or folder</span>
      </label>
      <label class="nd-btn nd-btn-secondary nd-btn-sm nd-btn-block">Choose DICOM folder<input id="dicomInput" type="file" data-neurodesk-input="image" webkitdirectory multiple hidden /></label>
      <select id="dicomPick" class="hidden" aria-label="Pick a converted NIfTI series"></select>
      </div>
      </details>
      <details class="control-section nd-sidebar-section" open>
      <summary class="nd-section-title" id="processingHeading">2. Processing</summary>
      <div class="nd-section-content">
      <label for="moreCommands">Example operation</label>
      <select id="moreCommands"></select>
      <p class="option-description">Choose an example or edit the command below.</p>
      <label for="command">NiiMath command</label>
      <input id="command" value="-dehaze 5 -dog 2 3.2"/>
      <button id="processButton" disabled>Process</button>
      <div id="loadingCircle" class="loading-circle hidden"></div>
      <label class="checkbox-option"><input type="checkbox" id="overlayCheck" checked /> Show result as overlay</label>
      <details class="nd-sidebar-section">
      <summary class="nd-section-title">Overlay appearance</summary>
      <div class="nd-section-content">
      <!-- overlay opacity slider -->
      <label id="overlayOpacityLabel" for="overlayOpacity">Overlay opacity</label>
      <input type="range" id="overlayOpacity" min="0" max="1" step="0.01" value="1" />
      <!-- overlay color select (empty but will be populated in main.js) -->
      <label id="overlayColorLabel" for="overlayColor">Overlay color</label>
      <select id="overlayColor"></select>
      </div>
      </details>
      </div>
      </details>
      <details class="control-section nd-sidebar-section" id="outputSection">
      <summary class="nd-section-title" id="outputHeading">3. Output</summary>
      <div class="nd-section-content">
      <p>Download the processed image, or reset to the original image.</p>
      <button id="saveButton">Save processed image</button>
      <button id="resetButton">Reset</button>
      </div>
      </details>
      <div class="sidebar-actions">
      <button id="helpButton">Command help</button>
      </div>
    </header>
    <main>
      <canvas id="gl"></canvas>
    </main>
    <footer>

</footer>
    <script type="module" src="./main.js"></script>
  </body>
</html>
