<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EdgeReg — NeuroDesk</title>
  </head>
  <body>
    <header id="controls">
      <details class="nd-sidebar-section" id="inputSection" open>
        <summary class="nd-section-title">Images</summary>
        <div class="nd-section-content">
          <div class="nd-field">
            <label for="movingExample">Moving image</label>
            <select id="movingExample"><option value="">Choose an example…</option></select>
          </div>
          <label class="nd-file" id="movingDropZone">
            <input id="movingInput" type="file" data-neurodesk-input="image" multiple aria-label="Choose moving NIfTI or DICOM files" />
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span>Drop moving NIfTI or DICOM files or folder</span>
          </label>
          <p id="movingInfo" class="nd-file-info" hidden></p>
          <div id="movingSeriesField" class="nd-field" hidden>
            <label for="movingSeries">Moving series</label>
            <select id="movingSeries"></select>
          </div>
          <div class="nd-field">
            <label for="stationaryExample">Stationary image</label>
            <select id="stationaryExample"><option value="">Choose a template…</option></select>
          </div>
          <label class="nd-file" id="stationaryDropZone">
            <input id="stationaryInput" type="file" data-neurodesk-input="image" multiple aria-label="Choose stationary NIfTI or DICOM files" />
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span>Drop stationary NIfTI or DICOM files or folder</span>
          </label>
          <p id="stationaryInfo" class="nd-file-info" hidden></p>
          <div id="stationarySeriesField" class="nd-field" hidden>
            <label for="stationarySeries">Stationary series</label>
            <select id="stationarySeries"></select>
          </div>
        </div>
      </details>
      <details class="nd-sidebar-section" id="taskSection" open>
        <summary class="nd-section-title">Registration</summary>
        <div class="nd-section-content">
          <div class="nd-field">
            <label for="method">Method</label>
            <select id="method"><option value="allineate">Affine · niimath -allineate</option></select>
          </div>
          <label class="nd-check"><input id="robustFov" type="checkbox" /> Crop excess neck with robust FOV</label>
          <button id="runButton" class="nd-btn nd-btn-primary" type="button" disabled>Register images</button>
        </div>
      </details>
      <details class="nd-sidebar-section" id="outputSection">
        <summary class="nd-section-title">Output</summary>
        <div class="nd-section-content"><div id="resultList"></div></div>
      </details>
      <button id="aboutBtn" type="button" hidden>About</button>
      <button id="privacyBtn" type="button" hidden>Privacy</button>
    </header>
    <main id="viewer">
      <div class="nd-viewer-canvas-wrapper">
        <div class="nd-viewer-panel-grid">
          <section class="nd-viewer-panel" aria-label="Moving image panel">
            <span class="nd-viewer-panel-title">Moving</span>
            <canvas id="glMoving" aria-label="Moving image viewer"></canvas>
          </section>
          <section class="nd-viewer-panel" aria-label="Stationary image panel">
            <span class="nd-viewer-panel-title">Stationary</span>
            <canvas id="glStationary" aria-label="Stationary image viewer"></canvas>
          </section>
          <section class="nd-viewer-panel" aria-label="Resliced image panel">
            <span class="nd-viewer-panel-title">Resliced</span>
            <canvas id="glResliced" aria-label="Resliced registration viewer"></canvas>
          </section>
        </div>
        <p id="emptyState" class="nd-viewer-empty">Loading the default moving and stationary images…</p>
        <p id="viewerError" class="nd-viewer-notice" hidden></p>
      </div>
      <div class="nd-viewer-info"><span class="nd-viewer-info-primary">Stationary and resliced crosshairs are linked</span><span id="location"></span></div>
    </main>
    <footer id="status">
      <span class="nd-status-label">Status</span>
      <span id="statusText" class="nd-status-text" role="status" aria-live="polite">Ready</span>
      <span id="elapsed" class="nd-status-elapsed"></span>
      <progress id="progress" max="1" value="0" aria-label="Registration progress"></progress>
      <button id="cancelButton" class="nd-btn-cancel" type="button" title="Cancel registration" aria-label="Cancel registration" hidden>×</button>
    </footer>
    <template id="aboutContent"><p>EdgeReg reslices a moving image into stationary image space using niimath’s affine <code>-allineate</code> registration. The original images are not modified.</p></template>
    <template id="privacyContent"><p>Images are processed locally in this browser and are never uploaded.</p></template>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
