<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StarDist — NeuroDesk</title>
  </head>
  <body>
    <header id="controls">
      <details class="nd-sidebar-section" id="inputSection" open>
        <summary class="nd-section-title">Input image</summary>
        <div class="nd-section-content">
          <div id="exampleControl"></div>
          <label class="nd-file" id="dropZone">
            <input id="imageInput" type="file" data-neurodesk-input="image" multiple aria-label="Choose a 2D or 3D TIFF, OME-TIFF or PNG image" />
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span>Drop a 2D or 3D TIFF, OME-TIFF or PNG image</span>
          </label>
          <p id="fileInfo" class="nd-file-info" hidden></p>
          <div class="nd-field" id="channelField" hidden>
            <label for="channel">Channel
              <span class="nd-info-icon" tabindex="0" aria-label="About the channel">i<span class="nd-info-tooltip">Single-channel models segment one channel. Choose the nuclear stain, for example DAPI or Hoechst.</span></span>
            </label>
            <select id="channel"></select>
          </div>
        </div>
      </details>

      <details class="nd-sidebar-section" id="taskSection" open>
        <summary class="nd-section-title">Nucleus segmentation</summary>
        <div class="nd-section-content">
          <div class="nd-field">
            <label for="model">Model
              <span class="nd-info-icon" tabindex="0" aria-label="About StarDist models">i<span class="nd-info-tooltip">Choose 2D fluorescence, 2D H&amp;E brightfield (RGB), the 2018 DSB paper model, or 3D demo for 3D stacks.</span></span>
            </label>
            <select id="model">
              <option value="2D_versatile_fluo">2D versatile fluorescence</option>
              <option value="2D_versatile_he">2D versatile H&amp;E (RGB)</option>
              <option value="2D_paper_dsb2018">2D paper DSB 2018</option>
              <option value="3D_demo">3D fluorescence (demo)</option>
            </select>
          </div>
          <details class="nd-sidebar-section" id="advancedSettings">
            <summary class="nd-section-title">Advanced settings</summary>
            <div class="nd-section-content">
              <div class="nd-field">
                <label for="probThresh">Probability threshold <small>0–1</small>
                  <span class="nd-info-icon" tabindex="0" aria-label="About the probability threshold">i<span class="nd-info-tooltip">Higher values keep fewer, more certain nuclei. The default is the threshold tuned for the selected model.</span></span>
                </label>
                <input id="probThresh" type="number" min="0.01" max="0.99" step="0.01" value="0.479071463157368" />
              </div>
              <div class="nd-field">
                <label for="nmsThresh">Overlap threshold <small>0–1</small>
                  <span class="nd-info-icon" tabindex="0" aria-label="About the overlap threshold">i<span class="nd-info-tooltip">Non-maximum suppression drops a candidate whose overlap with a more probable one exceeds this fraction of the smaller area or volume. Lower values merge more touching nuclei.</span></span>
                </label>
                <input id="nmsThresh" type="number" min="0.01" max="0.99" step="0.01" value="0.3" />
              </div>
              <div class="nd-field">
                <label for="tiles">Tiles per axis
                  <span class="nd-info-icon" tabindex="0" aria-label="About tiles">i<span class="nd-info-tooltip">Large images and 3D stacks are predicted in overlapping tiles, as StarDist's n_tiles does. Automatic chooses the count from the image size.</span></span>
                </label>
                <select id="tiles">
                  <option value="0">Automatic</option>
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                  <option value="6">6</option>
                  <option value="8">8</option>
                </select>
              </div>
              <button id="resetSettings" class="nd-btn nd-btn-secondary nd-btn-sm" type="button">Model defaults</button>
            </div>
          </details>
          <button id="runButton" class="nd-btn nd-btn-primary" type="button" disabled>Segment nuclei</button>
        </div>
      </details>

      <details class="nd-sidebar-section" id="outputSection">
        <summary class="nd-section-title">Output</summary>
        <div class="nd-section-content">
          <div id="resultList"></div>
        </div>
      </details>

      <button id="aboutBtn" type="button" hidden>About</button>
      <button id="privacyBtn" type="button" hidden>Privacy</button>
    </header>

    <main id="viewer">
      <div class="nd-viewer-canvas-wrapper">
        <canvas id="gl1" aria-label="Image viewer"></canvas>
        <p id="emptyState" class="nd-viewer-empty">Drop an image anywhere, or choose an example.</p>
      </div>
      <div class="nd-viewer-info"><span id="location" class="nd-viewer-info-primary"></span></div>
    </main>

    <footer id="status">
      <span class="nd-status-label">Status</span>
      <span id="statusText" class="nd-status-text" role="status" aria-live="polite">Drag and drop files</span>
      <span id="elapsed" class="nd-status-elapsed"></span>
      <progress id="progress" max="1" value="0" aria-label="Processing progress"></progress>
      <button id="cancelButton" class="nd-btn-cancel" type="button" title="Cancel processing" aria-label="Cancel processing" hidden>×</button>
    </footer>

    <template id="aboutContent">
      <p>StarDist finds cell nuclei in 2D and 3D microscopy by predicting, for every grid pixel or voxel, the probability that it lies inside a nucleus and the radial distances to the boundary along star-convex rays (32 rays in 2D polygons, 96 golden-spiral rays in 3D polyhedra). Non-maximum suppression keeps the most probable candidate where objects overlap.</p>
      <p>This app ships all four official pretrained StarDist models, converted to ONNX and run locally with ONNX Runtime on the CPU: 2D_versatile_fluo (single-channel 2D fluorescence nuclei, trained on the 2018 Data Science Bowl), 2D_versatile_he (RGB 2D H&amp;E brightfield histology, trained on MoNuSeg and TNBC), 2D_paper_dsb2018 (original 2018 StarDist paper model), and 3D_demo (3D star-convex polyhedra demonstration model trained on synthetic 3D fluorescence nuclei).</p>
      <p>Images are normalized to their 1st and 99.8th percentiles (jointly across RGB channels for H&amp;E) and predicted with CSBDeep tiling. Non-maximum suppression and label drawing are ports of StarDist 0.9.1 and match Python StarDist to the pixel or voxel on all examples. Note that 3D_demo is a synthetic demonstration model and is not a general-purpose 3D tissue model.</p>
    </template>
    <template id="privacyContent"><p>Images are processed locally in this browser and are never uploaded. Each model is downloaded once on demand from the Neurodesk dataset on Hugging Face and verified against its checksum.</p></template>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
