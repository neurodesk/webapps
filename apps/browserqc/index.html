<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/src/style.css" />
  <!-- empty favicon: suppress the browser's default /favicon.ico request (404) -->
  <link rel="icon" href="data:," />
  <title>BrowserQC | Neurodesk Webapps</title>
</head>

<body>
  <aside id="qcPanel" aria-label="Image quality metrics">
    <details class="nd-sidebar-section" id="inputSection" open>
      <summary class="nd-section-title">1. Input image</summary>
      <div class="nd-section-content">
      <div id="exampleControl"></div>
      <label class="nd-file" id="inputDropZone">
        <input id="niftiInput" type="file" data-neurodesk-input="image" multiple aria-label="Choose NIfTI or DICOM files" />
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span>Drop NIfTI or DICOM files or folder</span>
      </label>
      <label class="nd-btn nd-btn-secondary nd-btn-sm nd-btn-block">Choose DICOM folder<input id="dicomInput" type="file" data-neurodesk-input="image" webkitdirectory multiple hidden /></label>
      <p id="fileInfo" class="nd-file-info" hidden></p>
      <select id="dicomPick" class="hidden" aria-label="Pick a converted NIfTI series"></select>
    </div>
    </details>
    <details class="nd-sidebar-section" id="processingSection" open>
      <summary class="nd-section-title">2. Quality control</summary>
      <div class="nd-section-content">
      <button id="runButton" class="nd-btn nd-btn-primary" type="button" disabled>Run quality control</button>
    </div>
    </details>
    <details class="nd-sidebar-section" id="resultsSection">
      <summary class="nd-section-title">3. Image quality</summary>
      <div class="nd-section-content">
    <div class="nd-field">
      <label for="ovlSlider">Opacity</label>
      <input type="range" min="0" max="255" value="128" id="ovlSlider" aria-label="Segmentation overlay opacity" />
    </div>
    <div id="qcBody">
      <p class="qc-empty">Metrics appear here after processing finishes.</p>
    </div>
      <button id="saveBtn" class="nd-btn nd-btn-secondary" type="button" disabled>Download QC report</button>
      </div>
    </details>
    <button id="aboutBtn" type="button" hidden>About</button>
    <button id="privacyBtn" type="button" hidden>Privacy</button>
  </aside>

  <main id="canvas-container">
    <div class="nd-viewer-canvas-wrapper">
      <canvas id="gl1" aria-label="MRI viewer"></canvas>
      <p id="emptyState" class="nd-viewer-empty" hidden>Image viewer unavailable. See the status below.</p>
    </div>
    <div class="nd-viewer-info"><span id="location" class="nd-viewer-info-primary">Choose an image to begin.</span></div>
  </main>

  <footer id="status">
    <span class="nd-status-label">Status</span>
    <span id="statusMsg" class="nd-status-text" role="status" aria-live="polite">Ready</span>
    <progress id="loadingCircle" aria-label="Processing progress" max="1" value="0"></progress>
  </footer>

  <template id="aboutContent"><p>Automated MRI quality control, <strong>entirely in your browser</strong> — no upload, no server.
        Open a NIfTI image or a folder of DICOM files, then run quality control.</p>
      <ul>
        <li><strong>Segmentation</strong> — a
          <a href="https://github.com/neuroneural/brainchop" target="_blank" rel="noopener">brainchop</a>
          deep-learning model (MindGrab) parcellates the brain into 17 gray/white-matter and
          subcortical regions, shown as a colour overlay on your scan (adjust with the <strong>Opacity</strong>
          slider)</li>
        <li><strong>Quality metrics</strong> — <a href="https://github.com/rordenlab/niimath" target="_blank"
            rel="noopener">niimath</a> computes MRIQC-style image-quality metrics (CJV, CNR, SNR, WM2MAX, EFC,
          tissue composition) from the scan and its segmentation</li>
      </ul>
      <p>Rendering uses <a href="https://niivue.com/" target="_blank" rel="noopener">NiiVue</a>;
        DICOM import uses <a href="https://github.com/rordenlab/dcm2niix" target="_blank" rel="noopener">dcm2niix</a>.
      </p>
      <p>Quality measurements are an MRIQC-style approximation, not MRIQC normative values.</p>
      <p><small>Licensed <strong>BSD-2-Clause</strong>. Requires a recent WebGPU-capable desktop browser.</small></p></template>


  <template id="privacyContent"><p>BrowserQC processes scans locally in your browser. It does not upload your images, segmentations, or quality reports.</p></template>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
