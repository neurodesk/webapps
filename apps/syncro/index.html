<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Normalize brain scans and aligned lesion maps to MNI space with SYNcro.">
  <title>SYNcro · Neurodesk</title>
</head>
<body>
<header id="controls">
  <details class="nd-sidebar-section" id="inputSection" open>
    <summary class="nd-section-title">Inputs</summary>
    <div class="nd-section-content">
      <div id="exampleControl"></div>
      <div class="nd-field">
        <label>Primary scan <span aria-hidden="true">*</span></label>
        <div id="primaryField"></div>
        <p id="primaryInfo" class="nd-file-info" aria-live="polite" hidden></p>
      </div>
      <div class="nd-field">
        <label>Lesion map <small>optional</small></label>
        <div id="lesionField"></div>
        <p id="lesionInfo" class="nd-file-info" aria-live="polite" hidden></p>
        <button id="clearLesion" class="nd-btn nd-btn-secondary nd-btn-sm" type="button" hidden>Remove lesion map</button>
      </div>
      <div class="nd-field">
        <label>Pathological modality <small>optional</small> <span class="nd-info-icon" tabindex="0" aria-label="About the pathological modality">i<span class="nd-info-tooltip">Use this only when the lesion was drawn on a different scan. The lesion map must share this scan's grid.</span></span></label>
        <div id="pathologicalField"></div>
        <p id="pathologicalInfo" class="nd-file-info" aria-live="polite" hidden></p>
        <button id="clearPathological" class="nd-btn nd-btn-secondary nd-btn-sm" type="button" hidden>Remove pathological modality</button>
      </div>
      <div class="nd-field">
        <label for="viewSelect">Image shown</label>
        <select id="viewSelect" disabled></select>
      </div>
      <label class="nd-check"><input id="ct" type="checkbox"> Primary is CT (Hounsfield units)</label>
      <label class="nd-check"><input id="keepSynth" type="checkbox"> Keep native-space synthetic T1</label>
      <button id="runButton" class="nd-btn nd-btn-primary" type="button" disabled>Normalize to MNI</button>
    </div>
  </details>

  <details class="nd-sidebar-section" id="settingsSection">
    <summary class="nd-section-title">Processing settings</summary>
    <div class="nd-section-content">
      <div class="nd-field">
        <label for="synthsrBackend">SynthSR device <span class="nd-info-icon" tabindex="0" aria-label="About processing devices">i<span class="nd-info-tooltip">Full-volume SynthSR with flip averaging and sharpening. WebGPU is fastest on supported hardware; CPU WebAssembly is the fallback. Full scans need several GB of memory.</span></span></label>
        <select id="synthsrBackend"><option value="webgpu">GPU · WebGPU</option><option value="wasm">CPU · WebAssembly</option></select>
      </div>
      <div class="nd-field">
        <label for="brainExtractor">Brain extraction</label>
        <select id="brainExtractor"><option value="mindgrab">MindGrab · automatic</option><option value="synthstrip">SynthStrip · CPU WebAssembly</option></select>
      </div>
      <div class="nd-field">
        <label for="normalization">Normalization <span class="nd-info-icon" tabindex="0" aria-label="About processing backends">i<span class="nd-info-tooltip">MindGrab tries WebGPU, WebGL2, then threaded CPU. Greedy and ANTs use threaded CPU WebAssembly.</span></span></label>
        <select id="normalization"><option value="greedy">Greedy · default</option><option value="ants">ANTs SyN</option></select>
      </div>
    </div>
  </details>

  <details class="nd-sidebar-section" id="results">
    <summary class="nd-section-title">Results</summary>
    <div class="nd-section-content">
      <button id="downloadSelected" class="nd-btn nd-btn-secondary nd-btn-sm" type="button" disabled>Download shown image</button>
      <button id="editLesion" class="nd-btn nd-btn-secondary nd-btn-sm" type="button" title="Edit in the viewer" disabled>Edit lesion</button>
      <button id="download" class="nd-btn nd-btn-secondary nd-btn-sm" type="button" disabled>Download all results (.zip)</button>
      <p class="nd-hint">Output names match command-line SYNcro. Processing details are included in the archive.</p>
    </div>
  </details>

  <button id="aboutBtn" type="button" hidden>About</button>
  <button id="privacyBtn" type="button" hidden>Privacy</button>
</header>

<main id="viewer">
  <div class="nd-viewer-canvas-wrapper">
    <canvas id="gl1" aria-label="Brain image viewer"></canvas>
    <p id="empty" class="nd-viewer-empty">Load a brain scan to begin.</p>
    <p id="viewerError" class="nd-viewer-notice" hidden></p>
  </div>
  <div class="nd-viewer-info"><span id="viewLabel" class="nd-viewer-info-primary"></span></div>
</main>

<footer id="status">
  <span class="nd-status-label">Status</span>
  <span id="statusText" class="nd-status-text" role="status" aria-live="polite">Ready · choose a primary scan</span>
  <span id="elapsed" class="nd-status-elapsed"></span>
  <progress id="progress" value="0" max="1" aria-label="Normalization progress"></progress>
  <button id="cancel" class="nd-btn-cancel" type="button" title="Cancel processing" aria-label="Cancel processing" hidden>×</button>
</footer>

<template id="aboutContent">
  <p>SynthSR → brain extraction (MindGrab by default, or SynthStrip) → Greedy normalization (or ANTs SyN) to the MNI152 1 mm brain template → niimath masking. A pathological modality is first aligned to the primary scan.</p>
  <p>Synthetic contrast may alter lesions. Review the original image, extracted synthetic brain and alignment before using results. This experimental implementation is for research.</p>
  <p>Code: Apache-2.0 with upstream attribution. MindGrab is MIT licensed. The MNI template has separate <a href="data/FSL-LICENSE.txt">FSL terms for non-commercial use</a>.</p>
</template>

<template id="privacyContent">
  <p>Your images are processed locally in this browser. Models, the MNI template and optional tutorial images are downloaded from Hugging Face; MindGrab ships with the app. Model bytes may be cached on this device. Your own images are not uploaded to a processing service.</p>
</template>

<script type="module" src="/src/main.js"></script>
</body>
</html>
