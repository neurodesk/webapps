[package]
name = "qsm_wasm"
version = "0.31.20261027"
edition = "2021"
authors = ["QSM-WASM"]
description = "WASM bindings for QSM processing pipeline (powered by qsm-core)"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]
simd = ["qsmxt-engine/simd"]
# qsmxt-engine's `onnx` also enables getrandom's browser-crypto backend on wasm32.
onnx = ["qsmxt-engine/onnx"]
# Multithreading via wasm threads (SharedArrayBuffer + Web Worker pool). Turns on qsm-core's
# rayon paths (all classical algorithms, via qsmxt-engine) and the tiled-DL parallel tile loop. Requires a
# threaded build (nightly + -Z build-std + target-feature=+atomics,+bulk-memory) and a
# cross-origin-isolated page (COOP/COEP). See build.sh and the coi service worker.
parallel = ["qsmxt-engine/parallel", "dep:wasm-bindgen-rayon"]
# Route the bindings' console_log! diagnostics to the browser console. Off by default, so
# release bundles carry no logging strings or JS calls; enable it when debugging a build.
debug-log = []

[dependencies]
# The only pin on the QSM stack. qsmxt-engine (pipeline configuration, command generation, methods
# text) re-exports qsm-core (`qsmxt_engine::qsm_core`) and forwards its `simd`/`onnx`/`parallel`
# features, so qsmbly always runs the same qsm-core QSMxT was built and tested against.
# Pinned by commit on QSMxT main until a QSMxT release includes QSMxT/QSMxT#331; then it moves to a
# release tag, which the bump-qsmxt-engine workflow maintains.
qsmxt-engine = { git = "https://github.com/QSMxT/QSMxT.git", rev = "9fe168be40f67056c198f0df64734c486f137cac" }

# WASM bindings
wasm-bindgen = "0.2"
# Rayon threadpool for wasm (spawns Web Workers); only linked with the `parallel` feature.
wasm-bindgen-rayon = { version = "1.2", optional = true }
js-sys = "0.3"
# `float_roundtrip`: a grid read back from an engine's record (JSON) is the grid it recorded, to
# the last bit; without it a parsed float can be one ulp off, and a restored run resamples onto a
# slightly different grid.
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = 3
lto = true

# wasm-pack runs wasm-opt after the build; without --enable-threads it would strip the shared
# memory / atomics back out of threaded builds, and the DL bundle is built with +simd128.
# These flags keep them (harmless for builds that use neither).
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O2', '--enable-threads', '--enable-bulk-memory', '--enable-mutable-globals', '--enable-simd']
