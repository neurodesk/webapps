<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fastprep — NeuroDesk</title>
  </head>
  <body>
    <!--
      Every Neurodesk webapp is built from the shared workspace vocabulary in
      @neurodesk/webapp-components/styles/imaging-workspace.css. Keep the
      structure below; change the labels, fields and scientific logic only.
      Do not add app CSS for anything shown here. See docs/architecture/design-system.md.

      Rules test/design-system.test.mjs and pnpm audit:interfaces enforce:
      - The workspace is the first screen. No start page, hero or welcome modal;
        introductions belong in the About template below.
      - Status, progress, elapsed time and cancel live only in footer#status.
      - The technical log is createConsole(), below the viewer, collapsed.
      - Visible help is at most 90 characters. Longer help goes in an
        .nd-info-icon tooltip beside its label, or in About.
      - One primary action in the sidebar; every other action is secondary.
    -->
    <header id="controls">
      <!-- 1. Input: open, one compact scan picker, working example. -->
      <details class="nd-sidebar-section" id="inputSection" open>
        <summary class="nd-section-title">BIDS dataset</summary>
        <div class="nd-section-content">
          <div id="exampleControl"></div>
          <label class="nd-file" id="dropZone">
            <input id="imageInput" type="file" data-neurodesk-input="image" multiple aria-label="Choose BIDS files" />
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span>Drop a BIDS folder or files</span>
          </label>
          <p id="fileInfo" class="nd-file-info" hidden></p>
        </div>
      </details>

      <!-- 2. The task: its fields, advanced settings collapsed, one primary action. -->
      <details class="nd-sidebar-section" id="taskSection" open>
        <summary class="nd-section-title">Processing</summary>
        <div class="nd-section-content">
          <div class="nd-field">
            <label for="synthsr">Distortion correction
              <span class="nd-info-icon" tabindex="0" aria-label="About distortion correction">i<span class="nd-info-tooltip">SynthSR turns the BOLD reference into a T1w-like image; Greedy warps your T1w onto it. "All runs" applies it after any fieldmap or MEDIC correction.</span></span>
            </label>
            <select id="synthsr">
              <option value="all">SynthSR, all runs</option>
              <option value="auto">SynthSR without fieldmap</option>
              <option value="off">Off</option>
            </select>
          </div>
          <button id="runButton" class="nd-btn nd-btn-primary" type="button" disabled>Run fastprep</button>
        </div>
      </details>

      <!-- 3. Output: collapsed until results exist; View/Download per result. -->
      <details class="nd-sidebar-section" id="outputSection">
        <summary class="nd-section-title">Output</summary>
        <div class="nd-section-content">
          <div id="resultList"></div>
        </div>
      </details>

      <!-- About and Privacy content is app-owned; the shared app bar shows the buttons and
           appends the packages, builder and ecosystem block. Cite is rendered entirely from
           registry/app-information.yml. -->
      <button id="aboutBtn" type="button" hidden>About</button>
      <button id="privacyBtn" type="button" hidden>Privacy</button>
    </header>

    <main id="viewer">
      <!-- createViewerToolbar() is prepended here; createConsole() is appended. -->
      <div class="nd-viewer-canvas-wrapper">
        <canvas id="gl1" aria-label="Image viewer"></canvas>
        <p id="emptyState" class="nd-viewer-empty">Drop a BIDS folder anywhere or choose the example; the report appears here.</p>
      </div>
      <div class="nd-viewer-info"><span id="location" class="nd-viewer-info-primary"></span></div>
    </main>

    <footer id="status">
      <span class="nd-status-label">Status</span>
      <span id="statusText" class="nd-status-text" role="status" aria-live="polite">Drag and drop files</span>
      <span id="elapsed" class="nd-status-elapsed"></span>
      <progress id="progress" max="1" value="0" aria-label="Processing progress"></progress>
      <button id="cancelButton" class="nd-btn-cancel" type="button" title="Cancel processing" aria-label="Cancel processing" hidden>×</button>
    </footer>

    <template id="aboutContent">
      <p>fastprep follows the fMRIPrep workflow with permissively licensed tools: niimath, MindGrab, Greedy, SynthSR and glm.
        Runs with three or more echoes are also denoised with ME-ICA by meica, an LGPL-2.1 port of tedana; the report compares
        the original and denoised task maps.
        The Rust orchestration is the same as the native <code>fastprep</code> command, so this page writes the same derivatives and HTML report.</p>
      <p>Input: one subject of a BIDS dataset with a T1w and BOLD runs, each with its JSON sidecar. An <code>events.tsv</code> with
        <code>left</code>/<code>right</code> trial types adds a task analysis. Runs are limited to 1 GB of float32 BOLD here;
        cortical surfaces (TopoFit) and opposite-PE fieldmaps are native-only. Larger studies: use the native <code>fastprep</code>.</p>
    </template>
    <template id="privacyContent"><p>Your files are processed locally in this browser and are never uploaded. Tools, models and the MNI template are downloaded from pinned public URLs.</p></template>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
