[package]
name = "dwi-amico"
version.workspace = true
edition.workspace = true
license = "BSD-3-Clause"
rust-version.workspace = true
publish.workspace = true

[dependencies]
dwi-gradients = { path = "../gradients" }
dwi-tensor = { path = "../tensor" }
libm = "0.2"

[dev-dependencies]
# float_roundtrip as in dwi-gp, so `-p dwi-amico` and `--workspace` parse the
# fixtures the same way (Cargo unifies the features of one build).
serde_json = { version = "1", features = ["float_roundtrip"] }
