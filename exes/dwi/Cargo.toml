[workspace]
members = ["gradients", "tensor", "amico", "degibbs", "denoise", "gp", "hmc", "noddi-wasm", "degibbs-wasm", "denoise-wasm", "shore", "ec-distortion", "slice-outliers", "pe-field"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"
rust-version = "1.85"
publish = false

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
