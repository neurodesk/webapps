# The hmc package's WebAssembly module: a plain C ABI over dwi-hmc, no wasm-bindgen.
# packages/hmc/src/wasm.js drives it; packages/hmc/scripts/build-wasm.sh builds it.
# The glue in src/lib.rs is original code (Apache-2.0, LICENSE). The module links the ports in
# dwi-hmc, whose LICENSE-* files (exes/dwi/hmc) give their BSD-3-Clause and BSD-2-Clause terms.
[package]
name = "hmc-wasm"
version.workspace = true
edition.workspace = true
license = "Apache-2.0 AND BSD-3-Clause AND BSD-2-Clause AND MIT"
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dwi-gradients = { path = "../gradients" }
dwi-hmc = { path = "../hmc" }
