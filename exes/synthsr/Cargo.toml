[package]
name = "synthsr"
version = "0.4.20260920"
edition = "2021"
license = "Apache-2.0"
description = "SynthSR v2 brain image synthesis with ONNX Runtime"

[dependencies]
ort = { version = "=2.0.0-rc.13", features = ["webgpu"] }
flate2 = "1"
sha2 = "0.10"
serde_json = "1"

[build-dependencies]
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33"
