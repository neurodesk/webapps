[package]
name = "synthseg"
version = "0.3.20260923"
edition = "2021"
license = "Apache-2.0"
description = "SynthSeg 2.0 brain segmentation with ONNX Runtime and native Metal"

[dependencies]
ort = "=2.0.0-rc.13"
flate2 = "1"
serde_json = "1"

[features]
metal-f16 = []

[build-dependencies]
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33"
