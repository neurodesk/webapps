[package]
name = "deconvolution-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "wasm-bindgen surface of deconvolution-core for packages/deconvolution"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
deconvolution-core = { path = "../core" }
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
