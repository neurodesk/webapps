[package]
name = "greedy-rs-core"
# Fixed, not the workspace's release version: Cargo hashes it into the symbols of the committed
# packages/greedy/wasm-single build.
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["ssd", "nmi", "parallel", "gzip"]
parallel = ["dep:rayon"]
gzip = ["dep:flate2"]
ssd = []
nmi = []

[dependencies]
rayon = { version = "1", optional = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }
