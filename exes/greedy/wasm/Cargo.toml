[package]
name = "greedy-rs-wasm"
description = "Threaded WebAssembly bindings for Greedy MRI registration"
repository = "https://github.com/neurodesk/webapps"
# Fixed, not the workspace's release version: wasm-bindgen hashes it into the import names of the
# committed packages/greedy/wasm-single build.
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
greedy-rs-core = { path = "../core", default-features = false, features = ["ssd", "nmi"] }
wasm-bindgen = "0.2"
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"], optional = true }

[features]
default = ["threads"]
threads = ["greedy-rs-core/parallel", "dep:wasm-bindgen-rayon"]
