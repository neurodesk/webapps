[package]
name = "greedy-rs-wasm"
description = "Threaded WebAssembly bindings for Greedy MRI registration"
repository = "https://github.com/neurodesk/webapps"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
greedy-rs-core = { path = "../core", default-features = false, features = ["ssd", "nmi", "parallel"] }
wasm-bindgen = "0.2"
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"] }
