[package]
name = "samsrf-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Population receptive field and connective field mapping (a port of SamSrf): readers, preprocessing, HRFs and pRF models"

[lib]
name = "samsrf_core"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
robust = "1.2.0"
gif = { version = "0.13", default-features = false, features = ["std"] }
libm = "0.2"
miniz_oxide = "0.8"
num-complex = "0.4.6"
neurodesk-nifti = { path = "../../nifti" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
delaunator = "1.0.2"
num-rational = "0.4.2"
num-traits = "0.2.19"
