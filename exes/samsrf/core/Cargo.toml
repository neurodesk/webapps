[package]
name = "samsrf-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Population receptive field and connective field mapping (a port of SamSrf): readers, preprocessing, HRFs and pRF models"

[lib]
name = "samsrf_core"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
delaunator = "1.0.2"
gif = { version = "0.13", default-features = false, features = ["std"] }
libm = "0.2"
miniz_oxide = "0.8"
neurodesk-nifti = { path = "../../nifti" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
