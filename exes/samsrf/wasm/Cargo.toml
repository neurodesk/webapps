[package]
name = "samsrf-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "wasm-bindgen surface of samsrf-core for packages/samsrf"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
samsrf-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"

[package.metadata.wasm-pack.profile.release]
# build-wasm.sh runs the pinned optimizer and captures its input for diagnosis.
wasm-opt = false
