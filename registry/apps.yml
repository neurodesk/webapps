# Canonical catalog for the composite webapps site. Parsed and validated only
# through scripts/lib/apps-registry.mjs; callers must not grep this file.
site:
  domain: webapps.neurodesk.org
  cloudflare_project: neurodesk-webapps
  analytics:
    measurement_id: G-4Z9774J59Y
    period_days: 30
  categories:
    - id: segmentation-analysis
      title: Segmentation & Analysis
      description: Identify anatomy and pathology, then turn images into useful measurements.
    - id: quantitative-imaging
      title: Quantitative Imaging
      description: Create maps, derived images, and reproducible quantitative results.
    - id: data-preparation
      title: Data Preparation & Privacy
      description: Convert, compare, and prepare imaging data safely in your browser.
    - id: quality-annotation
      title: Quality Control & Annotation
      description: Review image quality and annotate anatomy with interactive tools.

apps:
  - id: musclemap
    path: musclemap
    title: MuscleMap
    description: Browser-based muscle segmentation and fat metrics.
    category: segmentation-analysis
    keywords: [muscle, MRI, segmentation, fat, Dixon, IMF, body composition]
    legacy_domain: musclemap.neurodesk.org
    runtime: static-esm
    model_manifest: models/musclemap.manifest.json
    asset_manifest_schema: scientific-assets-v1
    source: neurodesk/musclemap-webapp@8b5012b488bdf7727001c92b79eae826366ec1f0
    license: MIT
    maintainers: [neurodesk]
    support_status: active
    shell: static-html
    ci:
      toolchains: [node]
      shared_runtime: true
      release: true
