# Canonical catalog for the composite webapps site. Parsed and validated only
# through scripts/lib/apps-registry.mjs; callers must not grep this file.
site:
  # The primary host: the GitHub Pages catalogue and its analytics report.
  domain: webapps.neurodesk.org
  # webapps.sciget.org lists the catalogues and hosts no apps.
  hub:
    host: webapps.sciget.org
    title: SciGet Webapps
    heading: Run Scientific Imaging Tools in Your Browser
    description: Imaging tools that run locally in your browser, grouped by field.
    brand:
      name: SciGet
      logo: sciget-logo.svg
      home: https://webapps.sciget.org/
      more_apps: More SciGet web apps
  # Every app has one home catalogue (its `catalog:`); `also_in:` lists other
  # catalogues whose hosts serve a copy. Handoff menus list the apps of one host.
  # `desktop:` names each catalogue's offline suite: its Electron identity and
  # its GitHub release (tag `<release>-v<version>`, archives `<release>-<version>-*`).
  catalogs:
    - id: neuro
      host: webapps.neurodesk.org
      hosting: pages
      title: Neurodesk Webapps
      heading: Run Neuroimaging Tools in Your Browser
      description: Segment, register, measure, prepare, and explore imaging data in your browser without installing software or uploading your scans.
      brand:
        name: Neurodesk
        logo: neurodesk-logo.svg
        home: https://neurodesk.org/
        more_apps: More Neurodesk web apps
      desktop:
        product_name: Neurodesk Webapps
        app_id: org.neurodesk.webapps
        release: webapps
        executable: neurodesk-webapps
    - id: msk
      host: mskapps.sciget.org
      hosting: worker
      title: MSK Webapps
      heading: Run Musculoskeletal and Body Imaging Tools in Your Browser
      description: Segment muscles, measure fat and blood flow, convert, view, denoise and register body scans, and check imaging protocols in your browser without uploading your scans.
      brand:
        name: SciGet
        logo: sciget-logo.svg
        home: https://webapps.sciget.org/
        more_apps: More MSK web apps
      desktop:
        product_name: MSK Webapps
        app_id: org.sciget.msk
        release: msk-webapps
        executable: msk-webapps
    - id: microscopy
      host: microscopyapps.sciget.org
      hosting: worker
      title: Microscopy Webapps
      heading: Run Microscopy Tools in Your Browser
      description: Segment nuclei and stream, view and measure large microscopy images in your browser without uploading your data.
      brand:
        name: SciGet
        logo: sciget-logo.svg
        home: https://webapps.sciget.org/
        more_apps: More microscopy web apps
      desktop:
        product_name: Microscopy Webapps
        app_id: org.sciget.microscopy
        release: microscopy-webapps
        executable: microscopy-webapps
    - id: preclinical
      host: preclinicalapps.sciget.org
      hosting: worker
      title: Preclinical Webapps
      heading: Run Preclinical Imaging Tools in Your Browser
      description: Convert, view, denoise and register small-animal MRI, map susceptibility, and analyse light-sheet, two-photon and neuron data in your browser without uploading your data.
      brand:
        name: SciGet
        logo: sciget-logo.svg
        home: https://webapps.sciget.org/
        more_apps: More preclinical web apps
      desktop:
        product_name: Preclinical Webapps
        app_id: org.sciget.preclinical
        release: preclinical-webapps
        executable: preclinical-webapps
  analytics:
    measurement_id: G-4Z9774J59Y
    period_days: 30
  categories:
    - id: segmentation
      title: Segmentation
      description: Label anatomy and pathology, then measure what you labelled.
    - id: lesion-mapping
      title: Lesion Mapping
      description: Place lesions in a standard space and find the regions, networks and tracts they affect.
    - id: quantitative-mri
      title: Quantitative MRI
      description: Compute quantitative tissue maps and measure blood flow.
    - id: spectroscopy
      title: Spectroscopy
      description: Estimate metabolite concentrations from MR spectra.
    - id: functional-imaging
      title: Functional Imaging
      description: Map brain function and prepare functional MRI.
    - id: diffusion-imaging
      title: Diffusion & Tractography
      description: Fit diffusion models and reconstruct white-matter pathways.
    - id: registration
      title: Registration & Normalization
      description: Align images with each other or with a standard template.
    - id: reconstruction
      title: Super-resolution & Synthesis
      description: Build new images from motion-corrupted stacks or scans of another contrast.
    - id: fetal-imaging
      title: Fetal Imaging
      description: Reconstruct fetal brain images from MRI stacks.
    - id: surfaces
      title: Surfaces & Meshes
      description: Reconstruct, annotate and 3D-print cortical surfaces and brain meshes.
    - id: preprocessing
      title: Preprocessing
      description: Prepare images with correction, denoising, brain extraction and image maths.
    - id: conversion
      title: Conversion
      description: Convert scanner and microscope files to NIfTI, BIDS and OME-Zarr.
    - id: privacy
      title: Privacy
      description: Remove identifying facial features from images before sharing.
    - id: fibre-orientation
      title: Fibre Orientation
      description: Map fibre orientation and coherency in tissue images.
    - id: morphometry
      title: Morphometry
      description: Measure neuronal shape, branching and Sholl profiles.
    - id: spot-detection
      title: Spot Detection
      description: Detect and count fluorescent spots in microscopy images.
    - id: calcium-imaging
      title: Calcium Imaging
      description: Correct motion, extract cell signals and infer activity from calcium imaging.
    - id: visualization
      title: Visualization
      description: Explore large volumes and surfaces and make slice videos.
    - id: quality-control
      title: Quality Control
      description: Check image quality and compare acquisition protocols.
    - id: pipelines
      title: Workflows
      description: Run preprocessing pipelines or compose workflows for the desktop suite.

