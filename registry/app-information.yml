  disconnectome:
    about:
      - A lesion interrupts more of the brain than it destroys. This app intersects a lesion map with a population tractography atlas and reports, for each white-matter bundle, the fraction of streamlines passing through the lesion. Two atlases are offered, ENIGMA Symmetric (65 bundles, the default) and HCP1065 population-averaged (87 bundles). The arithmetic runs locally on the full-resolution atlas; the streamlines drawn are a decimated sample of the same atlas.
    packages:
      - { name: nii2tvx (WebAssembly), url: https://github.com/neurolabusc/nii2tvx, role: lesion-to-tract disconnection }
      - { name: NiiVue, url: https://github.com/niivue/niivue, role: image and tract viewer }
    citations:
