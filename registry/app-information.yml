  fastprep:
    about:
      - "fastprep follows the fMRIPrep workflow with: niimath, MindGrab, Greedy, SynthSR and glm. Reverse phase-encoding field estimation uses the GPL-3.0-or-later PyHySCO solver; the bundled app is distributed under GPL-3.0-or-later and the orchestration source retains Apache-2.0. Runs with three or more echoes are also denoised with ME-ICA by meica, an LGPL-2.1 port of tedana; the report compares the original and denoised task maps. The Rust orchestration is the same as the native fastprep command, so this page writes the same derivatives and HTML report."
      - "Input: one subject of a BIDS dataset with a T1w and BOLD runs, each with its JSON sidecar. An events.tsv with left/right trial types adds a task analysis. Runs are limited to 1 GB of float32 BOLD here; cortical surfaces (TopoFit) are native-only. Opposite-PE EPI references support PyHySCO field estimation in this browser. Larger studies: use the native fastprep."
