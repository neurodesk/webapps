  dicomview:
    privacy: Your DICOM files and their headers stay on your computer. Converted images are saved in the browser's own storage on this device until you choose Clear saved or clear the site's data. On the website, a protocol summary downloads the Pyodide runtime from cdn.jsdelivr.net and Python packages from PyPI the first time it runs; these requests contain no data from your files. The offline Standalone version bundles Pyodide and its packages and makes none of these requests. Open in another webapp keeps the selected series in this browser’s storage so the chosen app on this site can open it within 2 minutes; it is deleted once that app opens it, and nothing is uploaded. Most apps receive the NIfTI image dcm2niix made, named after the series number and description; its header keeps acquisition details such as echo and acquisition time, not the patient’s name or birth date. Apps that read DICOM, such as dicompare, receive the series’ DICOM files unchanged, and those headers do hold the patient’s details. If the browser closes first, the files can no longer be opened, but their bytes stay in browser storage until an app on this site is next opened after those 2 minutes. A browser that restores its previous session may still open them within the 2 minutes.
    packages:
      - { name: dcm2niix (WebAssembly), url: https://github.com/rordenlab/dcm2niix, role: DICOM to NIfTI conversion and BIDS sidecars }
      - { name: FreeBrowse, url: https://github.com/pwighton/freebrowse/tree/eae80a127fdd99974c80952e890bf18aa6e9d5dd, role: interactive viewer with window and level, layouts and colormaps }
