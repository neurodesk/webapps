  ants-denoise:
    about:
      - "ANTs DenoiseImage reduces noise in one 3D MR image using the adaptive non-local means filter of Manjón et al. (2010), the denoising step BISON runs before tissue classification. The output is a float32 image on the input grid. The validated settings reproduce native ANTs 2.6.5 DenoiseImage on one thread. The filter excludes nonpositive intensities from patch matching, so signed real or phase images are outside the validated scope."
      - "Choose the noise model by how the image was formed. Gaussian, DenoiseImage's default, suits nonnegative magnitude images with a good signal-to-noise ratio. Rician suits magnitude images with low signal-to-noise ratio, such as diffusion-weighted scans: magnitude noise raises dark tissue, and the Rician model removes that bias. On the example FLAIR the Rician result is 17 % lower than the Gaussian one in the darkest fifth of the head and 0.3 % lower in the brightest tissue."
      - "Use a binary or integer label mask with values from 0 to 255; probability maps must be binarized first. Only nonzero mask voxels are denoised and voxels farther than the patch radius from them keep their values. The mask must be on the image grid. On a whole-head image a brain mask shortens the run: the filter spends most of its time in the noisy background."
      - "The app takes one 3D volume and refuses 4D series; for diffusion series use dwidenoise. DenoiseImage's shrink factor stays 1: its source notes that a larger one does not seem to work. The filter runs on one CPU thread: the example takes about a minute, and a whole-head 1 mm T1 (166 × 210 × 160 voxels) took 6.5 minutes in Node. Larger patch or search radii take several times longer."
      - "For batch processing, run native DenoiseImage from the Neurodesk ANTs container listed under Standalone. Native ANTs splits the image between threads and then gives slightly different voxels; with ITK_GLOBAL_DEFAULT_NUMBER_OF_THREADS=1 and the same options it gives the app's voxels exactly. The technical log and the automation report give that command for each run."
    packages:
      - { name: ANTs DenoiseImage (WebAssembly), url: https://github.com/neurodesk/webapps/tree/main/packages/ants-denoise, role: "adaptive non-local means denoising (@neurodesk/ants-denoise), the build BISON runs" }
