  synthseg:
    about:
      - SynthSeg 2.0 segments brain scans into FreeSurfer labels using the pretrained FreeSurfer 8.1.0 model. It resamples to 1 mm and applies normalization, flip averaging and topological correction.
      - Fast mode skips flip averaging and topological correction. Browser inference requires WebGPU; the native executable also supports CPU inference.
      - Oversized scans first try niimath robust FOV, keeping 170 mm below the top of the head and removing excess neck. If the cropped scan still exceeds the GPU buffer limit, you can choose a coarser processing grid. This experimental fallback reduces detail and changes the anatomical scale seen by the model. It can affect segmentation and volume estimates; these outputs have not been validated against the 1 mm volume norms. The original upload is preserved and the run report records the crop and processing voxel size.
      - "The GM, WM and CSF downloads are float32 probability maps. Each map is the sum of SynthSeg's posterior probabilities for a group of structures, so these are anatomical class probabilities, not the tissue classes of a tissue-segmentation model. GM is cerebral and cerebellar cortex, thalamus, caudate, putamen, pallidum, hippocampus, amygdala, accumbens and ventral DC. WM is cerebral and cerebellar white matter and the brainstem. CSF is the ventricles and the CSF label. Ventral DC is GM because FreeSurfer's subcortical grey volume counts it; the brainstem is WM because it is mostly white matter. The maps use the label map's grid: the input grid when each voxel side is 0.95 to 1.05 mm, otherwise the 1 mm resampled grid, or the coarser processing grid when you choose one. They use the same postprocessing as the labels, so each map sums to the soft volumes of its structures. Label edits do not change them."
      - The Volumes view charts each structure's head-size-adjusted volume against age with the 5th–95th and 25th–75th percentiles of a reference cohort, fitted on volumes segmented in the same SynthSeg mode as the run, fast or default. Two references are available, IXI (1.5 T and 3 T) and AHEAD (7 T). Auto uses AHEAD when the DICOM header reports a field strength of 5 T or more, and IXI otherwise or when the field strength is unknown, as for NIfTI input. Healthy 7 T scans score well above the IXI range for cortical grey matter, so the choice matters. The population data is pinned to neurocontainers source revisions, 347cf6fb6135 for fast mode and 84e39bc0f298 for default mode, and verified by checksum. The report names the reference and why it was chosen, and the saved run report records both. Research use only. Not for diagnostic use.
    packages:
      - { name: SynthSeg WebAssembly, url: https://github.com/neurodesk/webapps/tree/main/packages/synthseg, role: shared native and browser preprocessing and postprocessing }
      - { name: brainquant norms, url: https://github.com/neurodesk/neurocontainers/tree/84e39bc0f298de386e0e0321ce05719b436a1a94/recipes/synthseg, role: IXI and AHEAD age and sex volume norms, fitted in fast and default mode, from the neurocontainers SynthSeg recipe }
      - { name: WebGPU FP32 kernels, url: https://github.com/neurodesk/webapps/tree/main/packages/runtime-support/src/gpu-unet, role: segmentation inference }
      - { name: NiiVue, url: https://github.com/niivue/niivue, role: image and label viewer }
