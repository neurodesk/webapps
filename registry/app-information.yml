  sdc:
    about:
      - "SDC estimates the susceptibility field of an EPI acquisition from two b = 0 images with opposite phase-encoding directions, such as AP and PA, in this browser. It is a port of PyHySCO 0.0.4 (Julian and Ruthotto 2024), the hyperelastic susceptibility correction of Ruthotto et al. 2012, and its CPU field differs from PyHySCO's by a median of 5e-6 Hz (at most 0.03 Hz). In a comparison on six subjects it was the closest fast method to FSL topup; DR-BUDDI was closer but takes about 40 minutes. Each input's volumes with b ≤ 50 are averaged, without motion correction, and the two images must be in one space. The field is in Hz, with topup's sign, on the grid of the field reference; a constant offset against another tool is a translation along the phase-encoding axis. The corrected images are for quality control: the app does not resample the DWI series. The example is a 10-slice slab of OpenNeuro ds005134 (CC0); because the regularization is 3D, a slab's field is not identical to the field of the full volume. The solver is GPL-3.0-or-later, as PyHySCO is. ANTs restricted SyN is not offered for reverse-PE pairs: its tested schedule failed the image gate on all six subjects. Single-PE ANTs SyN-SDC is still under development and is not available in this app."
      - PyHySCO uses float32 WebGPU on a hardware adapter when the browser supports WebAssembly JSPI, and CPU WebAssembly otherwise. A failed GPU run falls back to the CPU. Saved sidecars and automation provenance record the actual backend, adapter and any GPU failure.
