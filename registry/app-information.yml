  lcmodel:
    about:
      - This app quantifies metabolites in single-voxel MR spectroscopy. Raw data are preprocessed with FID-A's automatic pipelines (coil combination, removal of bad averages, spectral registration, ISIS combination for SPECIAL, phasing and referencing) and fitted with LCModel. Both are Rust ports compiled to WebAssembly and run locally. On LCModel's own test case the port writes the same .TABLE and .COORD numbers as the Fortran; the FID-A port agrees with FID-A in GNU Octave to within 10^-5 Hz in drift estimates.
      - The included basis sets were simulated with FID-A for PRESS, STEAM, semi-LASER, SPECIAL and MEGA-PRESS at 1.5, 3 and 7 T, some with real refocusing pulse shapes across the voxel; the app recommends the one that matches the data's field strength, sequence and echo time, and accepts your own .BASIS file.
      - Unedited fits widen LCModel's line-broadening prior (DESDT2 2, RFWBAS 80). With the narrow-line simulated basis sets, LCModel's defaults scale water-referenced concentrations 8-15 % low; the widened prior recovers synthetic spectra of known concentration and agrees with an independent fitter (spant). LCModel's own priors stay one setting away.
      - In GABA-edited MEGA-PRESS the fit separates GABA from co-edited macromolecules (MM3co) with a soft constraint to the macromolecule peak at 0.915 ppm, following Zöllner et al. (2022). GABA+ (GABA + MM3co) is robust; the split between GABA and MM3co rests on the model's assumptions.
      - With a T1 image from the same session, MindMap segments it in the browser, the voxel is placed from the spectroscopy header and drawn on the T1, and concentrations are corrected for the voxel's grey matter, white matter and CSF as in Gasparovic et al. 2006, with Osprey's constants.
    packages:
      - { name: LCModel 6.3-1N (Rust port), url: https://github.com/schorschinho/LCModel, role: linear-combination model fitting }
      - { name: FID-A (Rust port), url: https://github.com/CIC-methods/FID-A, role: preprocessing, file readers and basis-set simulation }
      - { name: MindMap (@brainchop/mindgrab), url: https://www.npmjs.com/package/@brainchop/mindgrab, role: grey matter, white matter and CSF partial-volume maps of the T1 }
      - { name: NiiVue, url: https://github.com/niivue/niivue, role: T1 viewer with the voxel overlay }
      - { name: dcm2niix, url: https://github.com/rordenlab/dcm2niix, role: T1 DICOM to NIfTI conversion }
    citations:
