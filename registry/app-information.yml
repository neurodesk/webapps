  spinalcordtoolbox:
    execution: Segmentation and SCT mask analysis can run in your browser. Selecting compute-server execution sends chosen masks to your Neurodesk server only when you run analysis. The server retains inputs and results until deletion or expiry.
    about:
      - Native sct_process_segmentation and sct_analyze_lesion execute the pinned SCT container with upstream numerical behavior for the exposed options. Browser analysis runs the same SCT Python methods in WebAssembly with SCT export formats, while floating-point results may differ from native execution. Morphometry exports CSV; lesion analysis exports XLSX, pickle and labeled NIfTI. Automatic SCIseg browser metrics remain an approximate subset.
    packages:
      - { name: Spinal Cord Toolbox, url: https://spinalcordtoolbox.com, role: morphometry and lesion analysis in the browser or on your compute server }
      - { name: Pyodide, url: https://pyodide.org, role: runs SCT Python and scientific libraries in WebAssembly }
      - { name: ONNX Runtime Web, url: https://onnxruntime.ai, role: runs the segmentation models in the browser }
      - { name: "@neurodesk/spinalcordtoolbox", url: https://github.com/neurodesk/webapps/tree/main/packages/spinalcordtoolbox, role: segmentation pipeline shared by the browser and the sct-webapp command line }
