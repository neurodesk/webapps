  pipeline-builder:
    about:
      - Build and export a NeuroFlow workflow that connects Neurodesk app operations. Image data stays outside the workflow file.
      - To run an export, install the Neurodesk desktop suite and Node.js, then download neuroflow-mcp v0.7.0 for your platform from https://github.com/cdrake/neuroflow/releases/tag/v0.7.0 and check it against the release's SHA256SUMS file. To build it instead, run cargo build --release --locked -p neuroflow-mcp at that tag.
      - Generate a matching tool registry with node scripts/generate-neuroflow.mjs --out /absolute/path/to/registry from the Webapps source checkout. Set NEURODESK_WEBAPPS to the desktop executable, then configure your MCP client to start neuroflow-mcp --registry /absolute/path/to/registry --data-root /absolute/path/to/data. Call neuroflow_run with the exported document as workflow and absolute image paths under inputs, keyed by the workflow input names. The T1 example uses the input name t1 and requires hardware WebGPU for SynthSeg.
      - Execution happens in the desktop suite on your computer. NeuroFlow v0.7.0 runs synchronously. To cancel, an MCP client sends notifications/cancelled with params.requestId matching the running tools/call. Cancellation stops the active process group on Unix, but only the direct child on Windows, where descendants may continue. Later steps do not start and the server keeps serving. The cancelled call receives no response or run ID; its run.json record remains in the sessions directory with status cancelled.
    privacy: Workflow files you open are read on this page and never uploaded. The tool catalog is fetched from this site, and the example workflow from the Neurodesk dataset on Hugging Face. Exported workflows name tools and bindings only, never image data.
    packages:
      - { name: NeuroFlow Rust core (WebAssembly), url: https://github.com/cdrake/neuroflow, role: workflow validation against the tool catalog }
      - { name: Neurodesk NeuroFlow generator, url: https://github.com/neurodesk/webapps/tree/main/packages/desktop/neuroflow, role: one NeuroFlow tool per app operation }
    citations:
      - group: Workflow format
        title: NeuroFlow
        reference: "NeuroFlow Contributors. NeuroFlow: typed neuroimaging workflows [Computer software]."
        url: https://github.com/cdrake/neuroflow
      - group: Workflow format
        title: NeuroFlow specification
        reference: "NeuroFlow Contributors. NeuroFlow 0.1 specification."
        url: https://github.com/cdrake/neuroflow-spec

  bison:
    about:
      - "BISON classifies brain tissue into 8 classes from a T1-weighted image: ventricles, CSF, cerebellar grey and white matter, brainstem, deep grey matter, cortical grey matter and white matter. With a FLAIR image as well, BISON-WMH adds a ninth class, white matter hyperintensities. A random forest classifies each voxel from its intensities after denoising, N4 bias correction and registration to the ICBM 2009c template, and from template tissue priors. The labels, one probability map per class and the mask are on the grid of your T1; the class volumes are given in millilitres."
      - "Everything runs in your browser on the CPU. A run takes several minutes; the nonlinear registration is the slowest step."
      - "The first run downloads the template, the trained classifier, tissue priors and intensity histograms: 41 MB for a T1, 48 MB with a FLAIR. They are published with the permission of the BISON authors, and your browser keeps them for later runs."
      - "Outputs are research estimates, not a diagnosis. Check them against the image."
    packages:
      - { name: "@neurodesk/bison", url: https://github.com/neurodesk/webapps/tree/main/packages/bison, role: BISON preprocessing, features and outputs, shared by the browser worker and the command line }
      - { name: greedy-rs (Rust/WebAssembly), url: https://github.com/neurodesk/webapps/tree/main/exes/greedy, role: "T1 to template affine, FLAIR to T1 rigid, and NCC deformable registration of the normalised T1 to the ICBM 2009c template (@neurodesk/greedy)" }
      - { name: antsApplyTransforms (WebAssembly), url: https://github.com/neurodesk/webapps/tree/main/packages/hmc-registration, role: "resampling the template, mask and priors through Greedy's transforms (@neurodesk/hmc-registration)" }
      - { name: ANTs DenoiseImage (WebAssembly), url: https://github.com/neurodesk/webapps/tree/main/packages/ants-denoise, role: "adaptive non-local means denoising (@neurodesk/ants-denoise)" }
      - { name: niimath (WebAssembly), url: https://github.com/rordenlab/niimath, role: N4 bias field correction and image maths }
      - { name: ONNX Runtime Web, url: https://onnxruntime.ai, role: runs the BISON random forest classifiers on the CPU }
      - { name: NiiVue, url: https://github.com/niivue/niivue, role: image viewer }
