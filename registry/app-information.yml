  carotid-flow:
    about:
      - Carotid Flow finds both carotid arteries in a retrospectively gated phase-contrast slice through the neck and extracts their flow over the cardiac cycle, with peak, time average and pulsatility index. Signed velocity gives flow in ml/min; an unsigned speed image goes through a port of a MATLAB script from the requesting lab and gives intensity curves. Everything runs locally.
