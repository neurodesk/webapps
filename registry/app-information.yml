# App information rendered into every hosted webapp's About and Cite dialogs by
# site/app-shell.js. Parsed and validated only through
# scripts/lib/app-information.mjs; test/app-information.test.mjs enforces that
# every registered app has an entry, that every implemented method has a paper,
# and that the shared statements below reach every app unchanged.
#
# Shared statements (rendered by the shell, never repeated per app):
#   builder   "The web application is developed and hosted by the Neurodesk team …"
#   ecosystem "This app is part of the lightNIIng ecosystem (lightniing.org), which aims
#              to make neuroimaging tools widely available for clinical translation."
#   platform  Renton et al. 2024, Nature Methods (Neurodesk) — closes every Cite list.
#
# Per app:
#   builders   optional sentence naming additional authors of the web application
#   about      optional paragraphs shown when the app has no About dialog of its own
#   packages   libraries and runtimes under the hood: name, url, role
#   citations  one entry per implemented method: group, title, reference, doi|url, code?

shared:
  builder: The web application is developed and hosted by the Neurodesk team at the University of Queensland and collaborators, and runs entirely in your browser.
  ecosystem: This app is part of the lightNIIng ecosystem (lightniing.org), which aims to make neuroimaging tools widely available for clinical translation.
  ecosystem_name: lightNIIng
  ecosystem_url: https://lightniing.org
  platform_citation:
    title: Neurodesk
    reference: "Renton AI, Dao TT, Johnstone T, Civier O, Sullivan RP, White DJ, Lyons P, Slade BM, Abbott DF, Amos TJ, Bollmann S, Botting A, Campbell MEJ, Chang J, Chatelin TR, Cerpa C, Cooper D, Dagg E, … Bollmann S. Neurodesk: an accessible, flexible and portable data analysis environment for reproducible neuroimaging. Nature Methods. 2024;21(5):804–808."
    doi: 10.1038/s41592-023-02145-x
    code: https://www.neurodesk.org

