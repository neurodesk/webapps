  noddi:
    about:
      - "NODDI fits diffusion tensor and NODDI maps to diffusion MRI in this browser. The tensor fit gives FA, MD, AD, RD, S0 and the principal direction from the b0 volumes and the shells up to b = 1200 s/mm² (the lowest shell when none is that low). The tensor fit is weighted least squares (the default), ordinary least squares, or niimath dtifit, which is FSL dtifit's default linear fit as DWI2TRX runs it. niimath dtifit writes no AD or RD map: AD is its first eigenvalue and RD is the mean of the second and third. For WLS and OLS, any strictly negative eigenvalue makes FA zero; MD, AD, RD, S0 and directions retain the unconstrained fit. Zero eigenvalues remain valid. Where a fit has a negative eigenvalue, niimath sets FA and MD to zero, and the app also sets AD and RD to zero. The app gives niimath unit bvecs, and the direction map has the same axes and sign as the other two fits. A sample of zero or less takes the lowest positive sample of its voxel in the other two fits; niimath uses its own lower limit, so these voxels can have different values. NODDI, fitted with AMICO (the default) or the nonlinear dmipy model, gives the intra-cellular volume fraction (ICVF), the isotropic volume fraction (ISOVF) and the orientation dispersion index (ODI). It needs two or more shells. The default fit is a port of AMICO 1.5.4 and agrees with it to a median of 1e-4 in white matter; AMICO 1.5.4 rounds each fibre direction to its 1° lookup table and this port does not. Outputs use the BIDS diffusion derivative names. Fit corrected data: this app does not denoise or correct motion, eddy currents or distortion. A dropped BIDS folder gives each DWI run with its bval and bvec; choose the run when there is more than one. The nonlinear fit ports dmipy's ball, Watson-distributed stick and zeppelin model with the NODDI tortuosity constraints and fixed diffusivities. It reports fitted, skipped, nonconverged and failed voxel counts in the technical log and automation provenance. Nonconverged voxels keep the optimizer's returned fit; inspect these counts before using a map. It is validated against dmipy in the pinned white-matter mask; full-brain validation outside that mask remains pending."
    packages:
      - name: dmipy nonlinear NODDI (Rust and WebAssembly port)
