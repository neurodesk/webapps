# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  # No "Draft PR not reviewed" / "Review skipped" comments.
  review_status: false
  auto_review:
    # Only review when explicitly requested with "@coderabbitai review".
    enabled: false
    auto_incremental_review: false
    drafts: false
