name: native-publish

on:
  pull_request:
    paths:
      - '.github/workflows/native-publish.yml'
      - 'exes/native-publish/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-publish.yml'
      - 'exes/native-publish/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path exes/native-publish/Cargo.toml --check
      - name: Test publication on the real filesystem without models
        run: |
          cargo test --locked --manifest-path exes/native-publish/Cargo.toml
          cargo test --locked --release --manifest-path exes/native-publish/Cargo.toml
      - name: Check native publisher
        run: cargo clippy --locked --manifest-path exes/native-publish/Cargo.toml --all-targets -- -D warnings
