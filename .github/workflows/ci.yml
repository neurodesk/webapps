name: ci
on:
  pull_request: null
  push:
    branches:
      - main
  schedule:
    - cron: 23 3 * * *
  workflow_dispatch:
    inputs:
      agentic_mode:
        description: Optional agentic checks to run after building the catalog
        type: choice
        options:
          - none
          - interactions
          - pipeline
        default: none
      agentic_apps:
        description: Comma-separated app ids; leave empty for the full catalog
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
env:
  ONNXRUNTIME_NODE_INSTALL: skip
  PW_TEST_REPORTER: ${{ github.workspace }}/test-utils/test-durations-reporter.mjs
  NEURODESK_E2E_SKIP_SLOW: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && '1' || '' }}
jobs:
  app-plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
      has_apps: ${{ steps.plan.outputs.has_apps }}
      browser_apps: ${{ steps.plan.outputs.browser_apps }}
      has_browser_apps: ${{ steps.plan.outputs.has_browser_apps }}
      gpu_apps: ${{ steps.plan.outputs.gpu_apps }}
      has_gpu_apps: ${{ steps.plan.outputs.has_gpu_apps }}
      all_apps: ${{ steps.plan.outputs.all_apps }}
      has_site: ${{ steps.plan.outputs.has_site }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate affected app plan
        id: plan
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && 'last-success' || '' }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/app-plan.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
  composite-site:
    needs: app-plan
    if: github.event_name != 'pull_request' || needs.app-plan.outputs.has_site == 'true'
    runs-on: ubuntu-latest
    outputs:
      agent_site_ready: ${{ steps.agent-site.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install pinned nightly toolchain
        run: rustup toolchain install nightly-2025-11-15 --component rust-src --target wasm32-unknown-unknown
      - name: Install wasm-pack 0.13.1
        run: cargo install wasm-pack --version 0.13.1 --locked
      - name: Set up wasm-opt
        uses: ./.github/actions/setup-wasm-opt
      - run: pnpm install --frozen-lockfile
      - name: Install browser
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          node node_modules/@playwright/test/cli.js install --with-deps chromium firefox webkit
      - name: Check custom element browser behavior
        run: pnpm --filter @neurodesk/webapp-components test:elements:browser
        env:
          ELEMENT_ARTIFACTS: ${{ github.workspace }}/interface-artifacts/elements
      - name: Check the component showcase boots in a browser
        run: pnpm --filter @neurodesk/webapp-components test:showcase:browser
      - name: Check passing files between apps in Chromium, Firefox and WebKit
        run: pnpm --filter @neurodesk/webapp-components test:handoff:browser
      - name: Build the composite site
        run: pnpm build
      - name: Enforce scientific-asset and hosting budgets
        run: pnpm audit:artifacts
      - name: Check published automation contracts and operation registration
        run: node test/automation-catalog.smoke.mjs
      - name: Test shared runtime assembly
        run: node --test test/runtime-assets.test.mjs
      - name: Verify resources persist across browser restarts
        run: pnpm test:resource-cache
      - name: Load threaded models with service-worker isolation
        run: pnpm test:runtime-startup
      - name: Smoke test every deployed subpath
        run: pnpm test:smoke
      - name: Hand an image from DICOM View to White matter lesions in Chromium, Firefox and WebKit
        run: pnpm test:app-handoff
      - name: Check catalog e2e types
        run: pnpm test:e2e:types
      - name: Test every production workspace with e2e
        run: pnpm test:e2e:catalog --skip-build --output .e2e/workspace
      - name: Audit interface consistency across the catalog
        run: pnpm audit:interfaces
        env:
          INTERFACE_ARTIFACTS: interface-artifacts
      - name: Check interface workflows with image data
        run: pnpm test:interface-workflows
      - name: Check unified scan pickers with DICOM series
        run: pnpm test:image-uploads
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: interface-audit
          path: interface-artifacts/
          if-no-files-found: ignore
      - name: Check phone and tablet layouts and touch navigation
        run: pnpm test:mobile
      - name: Package the built catalog for agent interactions
        id: agent-site
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.agentic_mode == 'interactions')
        env:
          NEURODESK_API_KEY: ${{ secrets.NEURODESK_API_KEY }}
        run: |
          if [ -z "$NEURODESK_API_KEY" ]; then
            echo '::notice::Agent interactions not run: configure the NEURODESK_API_KEY repository secret.'
            exit 0
          fi
          tar -czf "$RUNNER_TEMP/agent-catalog-site.tar.gz" -C dist .
          (cd "$RUNNER_TEMP" && sha256sum agent-catalog-site.tar.gz > agent-catalog-site.tar.gz.sha256)
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: steps.agent-site.outputs.ready == 'true'
        with:
          name: agent-catalog-site-${{ github.sha }}
          path: |
            ${{ runner.temp }}/agent-catalog-site.tar.gz
            ${{ runner.temp }}/agent-catalog-site.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Run requested Neurodesk processing workflows
        if: github.event_name == 'workflow_dispatch' && inputs.agentic_mode == 'pipeline'
        env:
          NEURODESK_API_KEY: ${{ secrets.NEURODESK_API_KEY }}
          AGENTIC_APPS: ${{ inputs.agentic_apps }}
        run: |
          if [ -z "$NEURODESK_API_KEY" ]; then
            echo '::error::Processing workflows require the NEURODESK_API_KEY repository secret.'
            exit 1
          fi
          args=(--skip-build --site-dir dist --target desktop --no-cache --output .e2e/pipeline)
          if [ -n "$AGENTIC_APPS" ]; then args+=(--app "$AGENTIC_APPS"); fi
          pnpm test:e2e:pipeline "${args[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: catalog-e2e
          path: .e2e/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
  agent-interactions:
    needs: composite-site
    if: needs.composite-site.outputs.agent_site_ready == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - desktop
          - phone
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browser
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - uses: actions/download-artifact@v8
        with:
          name: agent-catalog-site-${{ github.sha }}
          path: ${{ runner.temp }}/agent-catalog-site
      - name: Verify and unpack the tested composite site
        run: |
          cd "$RUNNER_TEMP/agent-catalog-site"
          sha256sum --check agent-catalog-site.tar.gz.sha256
          mkdir -p "$GITHUB_WORKSPACE/dist"
          tar -xzf agent-catalog-site.tar.gz -C "$GITHUB_WORKSPACE/dist"
      - name: Run Neurodesk agent interactions across the catalog
        timeout-minutes: 120
        env:
          NEURODESK_API_KEY: ${{ secrets.NEURODESK_API_KEY }}
          AGENTIC_APPS: ${{ inputs.agentic_apps }}
          AGENTIC_TARGET: ${{ matrix.target }}
        run: |
          args=(--skip-build --site-dir dist --target "$AGENTIC_TARGET" --output ".e2e/agent-$AGENTIC_TARGET")
          if [ -n "$AGENTIC_APPS" ]; then args+=(--app "$AGENTIC_APPS"); fi
          pnpm test:e2e:agent "${args[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: catalog-agent-${{ matrix.target }}
          path: .e2e/agent-${{ matrix.target }}/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
