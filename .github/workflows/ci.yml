name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      agentic_mode:
        description: Agentic checks to run after building the catalog
        type: choice
        options: [interactions, pipeline]
        default: interactions
      agentic_apps:
        description: Comma-separated app ids; leave empty for the full catalog
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI never uses the CUDA providers; parallel postinstalls of two versions race on one temp path.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  app-plan:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
      has_apps: ${{ steps.plan.outputs.has_apps }}
      browser_apps: ${{ steps.plan.outputs.browser_apps }}
      has_browser_apps: ${{ steps.plan.outputs.has_browser_apps }}
      all_apps: ${{ steps.plan.outputs.all_apps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate affected app plan
        id: plan
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A dispatched run on a branch tests what the branch changes since main.
          if [ -z "$BASE_SHA" ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            BASE_SHA=$(git merge-base origin/main HEAD)
          fi
          node scripts/app-plan.mjs --base "$BASE_SHA" --head "$HEAD_SHA"

  workspace-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate the app catalog and generated plans
        run: pnpm test:registry && node --test test/app-plan.test.mjs test/independent-workflows.test.mjs test/upstream-sync.test.mjs
      - name: Validate date releases and app scaffolding
        run: node --test test/app-versions.test.mjs test/new-app.test.mjs test/app-examples.test.mjs test/disconnectome-assets.test.mjs test/automation-catalog.test.mjs
      - name: Enforce the design system and workspace contract
        # Shared vocabulary, status footer, collapsed technical log, no start
        # pages, help text within 90 characters and one primary per sidebar.
        run: node --test test/design-system.test.mjs
      - name: Check native tract conversion and WebAssembly parity
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev
          make -C exes/nii2tvx test
          pnpm --filter @neurodesk/nii2tvx test
      - name: Lint every workspace package
        run: pnpm lint

  app-tests:
    needs: app-plan
    if: needs.app-plan.outputs.has_apps == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.app-plan.outputs.apps) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.rust_wasm
        with:
          targets: wasm32-unknown-unknown
      - name: Install pinned nightly toolchain
        if: matrix.rust_wasm
        run: rustup toolchain install nightly-2025-11-15 --component rust-src --target wasm32-unknown-unknown
      - name: Install wasm-pack 0.13.1
        if: matrix.rust_wasm
        run: cargo install wasm-pack --version 0.13.1 --locked
      - name: Set up wasm-opt
        if: matrix.rust_wasm
        uses: ./.github/actions/setup-wasm-opt
      - uses: actions/setup-python@v7
        if: matrix.python_reference
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - name: Install Python reference dependencies
        if: matrix.python_reference
        run: pip install -r apps/${{ matrix.app }}/requirements.txt nibabel
      - name: Test ${{ matrix.app }}
        env:
          APP: ${{ matrix.app }}
          TEST_SCRIPT: ${{ matrix.release_test }}
        run: pnpm --filter "$APP" run "$TEST_SCRIPT"
      - name: Build ${{ matrix.app }}
        run: pnpm --filter ${{ matrix.app }} build

  composite-site:
    needs: app-plan
    # App-scoped changes can break composite assembly (runtime-store rewrites,
    # artifact budgets), so any PR that selects at least one app runs the
    # composite checks; only docs-only changes skip them.
    if: github.event_name != 'pull_request' || needs.app-plan.outputs.has_apps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install pinned nightly toolchain
        run: rustup toolchain install nightly-2025-11-15 --component rust-src --target wasm32-unknown-unknown
      - name: Install wasm-pack 0.13.1
        run: cargo install wasm-pack --version 0.13.1 --locked
      - name: Set up wasm-opt
        uses: ./.github/actions/setup-wasm-opt
      - run: pnpm install --frozen-lockfile
      - name: Install browser
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Check custom element browser behavior
        run: pnpm --filter @neurodesk/webapp-components test:elements:browser
        env:
          ELEMENT_ARTIFACTS: ${{ github.workspace }}/interface-artifacts/elements
      - name: Build the composite site
        run: pnpm build
      - name: Enforce scientific-asset and hosting budgets
        run: pnpm audit:artifacts
      - name: Check published automation contracts and operation registration
        run: node test/automation-catalog.smoke.mjs
      - name: Test shared runtime assembly
        run: node --test test/runtime-assets.test.mjs test/runtime-assets-rewrite.test.mjs test/runtime-worker-scope.test.mjs
      - name: Load threaded models with service-worker isolation
        run: pnpm test:runtime-startup
      - name: Smoke test every deployed subpath
        run: pnpm test:smoke
      - name: Install the catalog e2e browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Check catalog e2e types and coverage
        run: pnpm test:e2e:types && node --test test/agentic-catalog.test.mjs test/agentic-provider.test.mjs test/playwright-discovery.test.mjs
      - name: Test every production workspace with e2e
        run: pnpm test:e2e:catalog --skip-build --output .e2e/workspace
      - name: Run Neurodesk agent interactions across the catalog
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.agentic_mode == 'interactions')
        env:
          NEURODESK_API_KEY: ${{ secrets.NEURODESK_API_KEY }}
          AGENTIC_APPS: ${{ inputs.agentic_apps }}
        run: |
          if [ -z "$NEURODESK_API_KEY" ]; then
            echo '::notice::Agent interactions not run: configure the NEURODESK_API_KEY repository secret.'
            exit 0
          fi
          args=(--skip-build --output .e2e/agent)
          if [ -n "$AGENTIC_APPS" ]; then args+=(--app "$AGENTIC_APPS"); fi
          pnpm test:e2e:agent "${args[@]}"
      - name: Run requested Neurodesk processing workflows
        if: github.event_name == 'workflow_dispatch' && inputs.agentic_mode == 'pipeline'
        env:
          NEURODESK_API_KEY: ${{ secrets.NEURODESK_API_KEY }}
          AGENTIC_APPS: ${{ inputs.agentic_apps }}
        run: |
          if [ -z "$NEURODESK_API_KEY" ]; then
            echo '::error::Processing workflows require the NEURODESK_API_KEY repository secret.'
            exit 1
          fi
          args=(--skip-build --target desktop --no-cache --output .e2e/pipeline)
          if [ -n "$AGENTIC_APPS" ]; then args+=(--app "$AGENTIC_APPS"); fi
          pnpm test:e2e:pipeline "${args[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: catalog-e2e
          path: .e2e/
          if-no-files-found: ignore
          retention-days: 7
      - name: Audit interface consistency across the catalog
        run: pnpm audit:interfaces
        env:
          INTERFACE_ARTIFACTS: interface-artifacts
      - name: Check interface workflows with image data
        run: pnpm test:interface-workflows
      - name: Check unified scan pickers with DICOM series
        run: pnpm test:image-uploads
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: interface-audit
          path: interface-artifacts/
          if-no-files-found: ignore
      - name: Check phone and tablet layouts and touch navigation
        run: pnpm test:mobile

  browser-e2e:
    needs: app-plan
    if: needs.app-plan.outputs.has_browser_apps == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.app-plan.outputs.browser_apps) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.rust_wasm
      - name: Install Greedy WebAssembly toolchain
        if: matrix.rust_wasm
        run: |
          rustup toolchain install nightly-2025-11-15 --component rust-src --target wasm32-unknown-unknown
          cargo install wasm-pack --version 0.13.1 --locked
      - name: Set up wasm-opt
        if: matrix.rust_wasm
        uses: ./.github/actions/setup-wasm-opt
      - uses: actions/setup-python@v7
        if: matrix.python_reference
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - name: Install Python reference dependencies
        if: matrix.python_reference
        run: pip install -r apps/${{ matrix.app }}/requirements.txt nibabel
      - name: Install browser
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Build ${{ matrix.app }} browser runtime
        run: pnpm --filter ${{ matrix.app }} build
      - name: Test ${{ matrix.app }} in a browser
        run: pnpm --filter ${{ matrix.app }} test:e2e

  homepage-easter-egg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: node --test test/easter-egg.test.mjs
      - run: pnpm --filter @neurodesk/vessel-surfer-easter-egg test
      - run: pnpm --filter @neurodesk/vessel-surfer-leaderboard test
      - run: pnpm --filter @neurodesk/vessel-surfer-easter-egg test:e2e
