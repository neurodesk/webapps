name: Apple notarization alert

on:
  workflow_run:
    # Every workflow that notarizes with the Apple Developer account (scripts/lib/notarization-alert.mjs).
    workflows:
      - ants-native
      - bison-native
      - brain-extraction-native
      - brain2print-native
      - browserqc-native
      - calmar-native
      - carotid-flow-native
      - deface-native
      - degibbs-native
      - dicompare-native
      - disconnectome-native
      - dwi2trx-native
      - dwidenoise-native
      - easy-mp2rage-native
      - edgereg-native
      - elastix-native
      - fireants-native
      - greedy-native
      - hmc-native
      - lcmodel-native
      - mri2vid-native
      - musclemap-native
      - n4-native
      - niimath-native
      - noddi-native
      - node-cli
      - qsmbly-native
      - samsrf-native
      - sdc-native
      - seedseg-native
      - spinalcordtoolbox-native
      - standalone
      - syncro-native
      - synthseg-native
      - synthseg-portable
      - synthsr-native
      - topofit-native
      - vesselboost-native
      - white-matter-lesions-native
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

# No concurrency group: GitHub keeps one pending run per group and drops the
# rest, which would lose alerts when many releases fail together. Runs that
# race to open the issue merge into the oldest one.
jobs:
  alert:
    # Pull request runs never notarize. Release dispatches run on tags, so there is no branch filter.
    if: (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out') && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # workflow_run is privileged: never check out the triggering run's branch or artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
      - name: Open or update the notarization issue
        run: node scripts/alert-notarization.mjs
        env:
          GH_TOKEN: ${{ github.token }}
