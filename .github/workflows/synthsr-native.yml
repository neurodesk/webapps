name: synthsr-native

on:
  pull_request:
    paths:
      - '.github/workflows/synthsr-native.yml'
      - 'exes/synthsr/**'
      - 'exes/nifti/**'
      - 'test-utils/native-nifti/**'
      - 'packages/synthsr/**'
      - 'apps/synthsr/**'
      - 'test/independent-workflows.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/synthsr-native.yml'
      - 'exes/synthsr/**'
      - 'exes/nifti/**'
      - 'test-utils/native-nifti/**'
      - 'packages/synthsr/**'
      - 'apps/synthsr/**'
      - 'test/independent-workflows.test.mjs'
  workflow_dispatch:
    inputs:
      sign_release:
        description: Sign, notarize and attach all native packages to an existing draft or prerelease
        type: boolean
        default: false

concurrency:
  group: synthsr-native-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  portable:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Fetch the pinned model
        working-directory: exes/synthsr
        run: python scripts/fetch_model.py
      - name: Test native inference
        working-directory: exes/synthsr
        run: cargo test --release
      - name: Check native source
        working-directory: exes/synthsr
        run: |
          cargo clippy --release --all-targets -- -D warnings
          cargo fmt --check
          python scripts/test_portable_release.py
      - name: Package and verify the extracted archive
        working-directory: exes/synthsr
        run: |
          python scripts/portable_release.py package ${{ matrix.platform }}
          python scripts/portable_release.py verify ${{ matrix.platform }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: synthsr-${{ matrix.platform }}-archive
          path: |
            exes/synthsr/dist/synthsr-*-${{ matrix.platform }}.zip
            exes/synthsr/dist/synthsr-*-${{ matrix.platform }}.zip.sha256
            exes/synthsr/dist/synthsr-*-${{ matrix.platform }}.zip.validation.txt
            exes/synthsr/dist/synthsr-*-${{ matrix.platform }}.tar.gz
            exes/synthsr/dist/synthsr-*-${{ matrix.platform }}.tar.gz.sha256
            exes/synthsr/dist/synthsr-*-${{ matrix.platform }}.tar.gz.validation.txt
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - name: Verify native inference
        run: make -C exes/synthsr test lint fmt
      - name: Build test installer
        run: |
          make -C exes/synthsr macos-pkg-adhoc
          exes/synthsr/scripts/verify_macos_pkg.sh exes/synthsr/dist/*-adhoc.pkg --allow-adhoc
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: synthsr-macos-arm64-test-installer
          path: exes/synthsr/dist/*-adhoc.pkg
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.sign_release
    needs: [portable, macos]
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Check release target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' exes/synthsr/Cargo.toml)
          tag="synthsr-v$version"
          test "$(gh release view "$tag" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = true
          test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: synthsr-*-x64-archive
          path: exes/synthsr/dist/portable
          merge-multiple: true
      - name: Check portable release assets
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' exes/synthsr/Cargo.toml)
          for asset in "synthsr-$version-linux-x64.tar.gz" "synthsr-$version-windows-x64.zip"; do
            test -f "exes/synthsr/dist/portable/$asset"
            test -f "exes/synthsr/dist/portable/$asset.sha256"
            test -f "exes/synthsr/dist/portable/$asset.validation.txt"
            (cd exes/synthsr/dist/portable && shasum -a 256 -c "$asset.sha256")
          done
      - name: Sign and notarize installer
        env:
          APPLEID: ${{ secrets.APPLEID }}
          APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}
        run: exes/synthsr/scripts/ci_macos_release.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: synthsr-native-release
          path: |
            exes/synthsr/dist/*.pkg
            exes/synthsr/dist/*.sha256
            exes/synthsr/dist/*.validation.txt
            exes/synthsr/dist/portable/
      - name: Attach verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" exes/synthsr/dist/*.pkg exes/synthsr/dist/*.sha256 exes/synthsr/dist/*.validation.txt exes/synthsr/dist/portable/* --clobber
