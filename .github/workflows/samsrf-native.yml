name: samsrf-native

# The Rust port of SamSrf behind packages/samsrf. The core must pass its unit tests
# natively, build for wasm32, and the committed WebAssembly module in
# packages/samsrf/wasm must equal a rebuild from source with the pinned toolchain.
# The portable job packages the samsrf command line (exes/node-cli) and validates
# each archive on the web app's example (packages/samsrf/validation/cli-check.mjs).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - '.github/workflows/samsrf-native.yml'
      - '.github/actions/setup-wasm-opt/**'
      - 'exes/samsrf/**'
      - 'exes/nifti/**'
      - 'packages/samsrf/**'
      - 'apps/samsrf/examples.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/samsrf-native.yml'
      - '.github/actions/setup-wasm-opt/**'
      - '.github/workflows/node-cli-portable.yml'
      - 'exes/node-cli/**'
      - 'exes/samsrf/**'
      - 'exes/nifti/**'
      - 'packages/samsrf/**'
      - 'apps/samsrf/examples.json'
  workflow_dispatch:
    inputs:
      sign_release:
        description: Sign and notarize the macOS installer, then attach every verified package to the existing SamSrf release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: samsrf-native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: core tests and package tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Core unit tests
        run: cargo test --release --manifest-path exes/samsrf/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path exes/samsrf/Cargo.toml --all-targets -- -D warnings
      - name: WebAssembly builds
        run: cargo build --release --target wasm32-unknown-unknown -p samsrf-wasm --manifest-path exes/samsrf/Cargo.toml
      - name: Package tests on the committed module
        run: node --test packages/samsrf/test/*.test.js
      - name: MATLAB Runtime reference gates (matched precision and legacy exports)
        run: |
          python3 packages/samsrf/validation/container/download.py "$RUNNER_TEMP/samsrf-reference"
          node packages/samsrf/validation/container/compare.mjs "$RUNNER_TEMP/samsrf-reference"

  wasm-source:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: committed WASM equals a rebuild from source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
      - name: Install wasm-pack 0.13.1
        run: cargo install wasm-pack --version 0.13.1 --locked
      - name: Set up wasm-opt
        uses: ./.github/actions/setup-wasm-opt
      - name: Rebuild and compare
        run: bash packages/samsrf/scripts/build-wasm.sh --check

  portable:
    needs: [test, wasm-source]
    uses: ./.github/workflows/node-cli-portable.yml
    permissions:
      contents: write
      id-token: write
    with:
      package: packages/samsrf
      targets: >-
        [{"os": "ubuntu-22.04", "platform": "linux-x64"},
         {"os": "windows-latest", "platform": "windows-x64"},
         {"os": "macos-15", "platform": "macos-arm64"}]
      publish_release: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release }}
      sign_release: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release }}
    secrets:
      APPLEID: ${{ secrets.APPLEID }}
      APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
      CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}
