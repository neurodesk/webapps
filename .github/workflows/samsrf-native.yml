name: samsrf-native

# The Rust port of SamSrf behind packages/samsrf. The core must pass its unit tests
# natively, build for wasm32, and the committed WebAssembly module in
# packages/samsrf/wasm must equal a rebuild from source with the pinned toolchain.
# The portable job packages the samsrf command line (exes/node-cli) and validates
# each archive on the web app's example (packages/samsrf/validation/cli-check.mjs).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - '.github/workflows/samsrf-native.yml'
      - '.github/actions/setup-wasm-opt/**'
      - 'exes/samsrf/**'
      - 'exes/nifti/**'
      - 'packages/samsrf/**'
      - 'apps/samsrf/examples.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/samsrf-native.yml'
      - '.github/actions/setup-wasm-opt/**'
      - '.github/workflows/node-cli-portable.yml'
      - 'exes/node-cli/**'
      - 'exes/samsrf/**'
      - 'exes/nifti/**'
      - 'packages/samsrf/**'
      - 'apps/samsrf/examples.json'
  workflow_dispatch:
    inputs:
      sign_release:
        description: Sign and notarize the macOS installer, then attach every verified package to the existing SamSrf release
        type: boolean
        default: false
      record_matlab:
        description: Record the expanded reference with actual MATLAB (no portable release)
        type: boolean
        default: false
      include_matrix:
        description: Include the full participant pipeline matrix in a MATLAB recording
        type: boolean
        default: true
      diagnostics_only:
        description: Record focused CSS and regression diagnostics from pinned MATLAB inputs
        type: boolean
        default: false
      geometry_only:
        description: Record polyshape, delaunay and CF geometry on sweeps and real Benson templates (with record_matlab)
        type: boolean
        default: false
      geometry_probe:
        description: With geometry_only, record only the focused polyshape probes (grid decade, held-out clouds)
        type: boolean
        default: false
      geometry_causal:
        description: With geometry_only, record only the controlled polyshape cleaning polygons (polyshape_causal_cases.m)
        type: boolean
        default: false
      geometry_reproducers:
        description: With geometry_only, record only the reduced polyshape reproducers (polyshape-reproducers.json)
        type: boolean
        default: false
      revcor_only:
        description: Record raw-input RC/CF pipelines in both precisions, without MATLAB Compiler
        type: boolean
        default: false
      revcor_edges:
        description: With revcor_only, record the constant, low-variance and threshold-boundary RC/CF cases instead of the matrix
        type: boolean
        default: false
      wasm_only:
        description: Only rebuild WASM and retain its optimizer input for diagnosis
        type: boolean
        default: false
      qr_only:
        description: Record MATLAB least-squares solves under several MKL branch requests
        type: boolean
        default: false
      qr_kernels:
        description: Record MKL's least-squares steps and gemv summation trees through a MEX probe, on three runners per label
        type: boolean
        default: false
      numerics_only:
        description: With record_matlab, record MATLAB's arithmetic on generated inputs (elementary functions, powers, conv, HRF, BLAS)
        type: boolean
        default: false
      css_pipelines_only:
        description: With record_matlab, record the double CSS pipeline with original and nonnegative apertures, twice per host
        type: boolean
        default: false
      kernels_only:
        description: With record_matlab, record MATLAB's single exp, corr pieces and logged single CF Gaussian fits
        type: boolean
        default: false
      gemv_order:
        description: With record_matlab, fingerprint the summation order of single y' * A (corr's product)
        type: boolean
        default: false
      focused_probes:
        description: With record_matlab, record the focused probes (Hooke-Jeeves on pinned RC profiles, conv near 512, trig position, short dot products)
        type: boolean
        default: false
      controls_only:
        description: Record the MKL controls in effect inside MATLAB under three environment requests (controls-preregistration.md)
        type: boolean
        default: false
      runtime_cli:
        description: SamSrfAnalysis CLI matrix (source runs it twice in public MATLAB; build needs the MLM_LICENSE_TOKEN secret for MATLAB Compiler)
        type: choice
        options: [none, source, build]
        default: none
      runtime_image:
        description: Runtime-only validation of a published reference image, by registry digest (name@sha256:...)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: samsrf-native-${{ github.ref }}${{ (inputs.record_matlab || inputs.revcor_only || inputs.qr_only || inputs.qr_kernels || inputs.controls_only || (inputs.runtime_cli || 'none') != 'none' || inputs.runtime_image) && '-matlab' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'workflow_dispatch' || (!inputs.record_matlab && !inputs.revcor_only && !inputs.qr_only && !inputs.qr_kernels && !inputs.controls_only && !inputs.wasm_only && (inputs.runtime_cli || 'none') == 'none' && !inputs.runtime_image))
    name: core tests and package tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Core unit tests
        run: cargo test --release --manifest-path exes/samsrf/Cargo.toml
      - name: Reference execution provenance and CLI harness tests
        run: |
          python3 -m venv "$RUNNER_TEMP/samsrf-cli-venv"
          "$RUNNER_TEMP/samsrf-cli-venv/bin/pip" install --only-binary=:all: -r packages/samsrf/validation/matlab/requirements-cli.txt
          "$RUNNER_TEMP/samsrf-cli-venv/bin/python" -m unittest discover -s packages/samsrf/validation/matlab -p 'test_*.py'
      - name: Clippy
        run: cargo clippy --manifest-path exes/samsrf/Cargo.toml --all-targets -- -D warnings
      - name: WebAssembly builds
        run: cargo build --release --target wasm32-unknown-unknown -p samsrf-wasm --manifest-path exes/samsrf/Cargo.toml
      - name: Experimental polyshape model stays out of shipped builds
        run: |
          # The shipped module's feature graph must not contain the experimental model,
          # and a WebAssembly build that enables it must fail.
          if cargo tree --manifest-path exes/samsrf/Cargo.toml -p samsrf-wasm --target wasm32-unknown-unknown -e features -i samsrf-core | grep -F polyshape-experimental; then
            echo 'samsrf-wasm enables polyshape-experimental' >&2
            exit 1
          fi
          if cargo build --release --target wasm32-unknown-unknown -p samsrf-core --features polyshape-experimental --manifest-path exes/samsrf/Cargo.toml 2> "$RUNNER_TEMP/experimental-wasm.log"; then
            echo 'polyshape-experimental built for WebAssembly' >&2
            exit 1
          fi
          grep -F 'polyshape-experimental must never be enabled in a WebAssembly build' "$RUNNER_TEMP/experimental-wasm.log"
      - name: Experimental polyshape model unit tests and clippy
        run: |
          cargo test --release --manifest-path exes/samsrf/Cargo.toml -p samsrf-core --features polyshape-experimental --lib
          cargo clippy --manifest-path exes/samsrf/Cargo.toml -p samsrf-core --features polyshape-experimental --all-targets -- -D warnings
      - name: Package tests on the committed module
        run: node --test packages/samsrf/test/*.test.js
      - name: MATLAB Runtime reference gates (matched precision and legacy exports)
        run: |
          python3 packages/samsrf/validation/container/download.py "$RUNNER_TEMP/samsrf-reference"
          node packages/samsrf/validation/container/compare.mjs "$RUNNER_TEMP/samsrf-reference"
      - name: MATLAB source references (per-vertex gates and numerical primitives)
        run: |
          python3 packages/samsrf/validation/container/download.py "$RUNNER_TEMP/samsrf-source-reference" packages/samsrf/validation/matlab/reference.json
          python3 packages/samsrf/validation/container/download.py "$RUNNER_TEMP/samsrf-matrix-input" packages/samsrf/validation/matlab/inputs.json
          node packages/samsrf/validation/matlab/compare.mjs "$RUNNER_TEMP/samsrf-source-reference" "$RUNNER_TEMP/samsrf-matrix-input"
          SAMSRF_MATLAB_REFERENCE_DIR="$RUNNER_TEMP/samsrf-source-reference" cargo test --release --manifest-path exes/samsrf/Cargo.toml -p samsrf-core --test matlab_reference
          SAMSRF_MATLAB_REFERENCE_DIR="$RUNNER_TEMP/samsrf-source-reference" cargo test --release --manifest-path exes/samsrf/Cargo.toml -p samsrf-core --test double_forward_diagnostics
      - name: Reverse-correlation pRF and connective-field raw pipeline gates (both MATLAB hosts)
        run: |
          python3 packages/samsrf/validation/container/download.py "$RUNNER_TEMP/samsrf-revcor-reference" packages/samsrf/validation/matlab/revcor-reference.json
          python3 packages/samsrf/validation/container/download.py "$RUNNER_TEMP/samsrf-revcor-edges" packages/samsrf/validation/matlab/revcor-edges-reference.json
          SAMSRF_REVCOR_REFERENCE_DIR="$RUNNER_TEMP/samsrf-revcor-reference" SAMSRF_REVCOR_EDGES_DIR="$RUNNER_TEMP/samsrf-revcor-edges" SAMSRF_MATRIX_INPUT_DIR="$RUNNER_TEMP/samsrf-matrix-input" \
            cargo test --release --manifest-path exes/samsrf/Cargo.toml -p samsrf-core --test revcor_reference -- --nocapture
          node packages/samsrf/validation/matlab/compare-revcor.mjs "$RUNNER_TEMP/samsrf-revcor-reference" "$RUNNER_TEMP/samsrf-matrix-input" "$RUNNER_TEMP/samsrf-revcor-comparison.json"
      - name: Single-precision Gaussian refusal evidence (MATLAB exp and host spread)
        run: |
          python3 packages/samsrf/validation/container/download.py "$RUNNER_TEMP/samsrf-single-kernels" packages/samsrf/validation/matlab/single-kernels-reference.json
          node packages/samsrf/validation/matlab/analyse-single-kernels.mjs "$RUNNER_TEMP/samsrf-single-kernels/amd-7763-auto" "$RUNNER_TEMP/samsrf-single-kernels/intel-8573c-avx512" --check > "$RUNNER_TEMP/samsrf-single-kernels.json"
      - name: Single exp, y' * A order and single CF Gaussian fit gates (MATLAB's own profiles)
        run: |
          python3 packages/samsrf/validation/container/download.py "$RUNNER_TEMP/samsrf-gemv-order" packages/samsrf/validation/matlab/gemv-order-reference.json
          SAMSRF_SINGLE_KERNELS_DIR="$RUNNER_TEMP/samsrf-single-kernels" SAMSRF_GEMV_ORDER_DIR="$RUNNER_TEMP/samsrf-gemv-order/ubuntu-22.04" \
            cargo test --release --manifest-path exes/samsrf/Cargo.toml -p samsrf-core --test cf_single_replay -- --nocapture
      - name: MATLAB geometry and real-template CF gates
        run: |
          python3 packages/samsrf/validation/container/download.py "$RUNNER_TEMP/samsrf-geometry" packages/samsrf/validation/matlab/geometry-reference.json
          python3 packages/samsrf/validation/container/download.py "$RUNNER_TEMP/samsrf-revcor" packages/samsrf/validation/matlab/revcor-reference.json
          node packages/samsrf/validation/matlab/compare-geometry.mjs "$RUNNER_TEMP/samsrf-geometry/ubuntu-22.04" "$RUNNER_TEMP/samsrf-geometry/ubuntu-24.04" "$RUNNER_TEMP/samsrf-geometry-hosts.json"
          SAMSRF_MATLAB_GEOMETRY_DIR="$RUNNER_TEMP/samsrf-geometry" SAMSRF_MATLAB_REVCOR_DIR="$RUNNER_TEMP/samsrf-revcor" cargo test --release --manifest-path exes/samsrf/Cargo.toml -p samsrf-core --test matlab_geometry -- --nocapture
      - name: Experimental polyshape model gates (original, grid-probe and causal recordings)
        run: |
          python3 packages/samsrf/validation/container/download.py "$RUNNER_TEMP/samsrf-polyshape-probe" packages/samsrf/validation/matlab/polyshape-probe-reference.json
          python3 packages/samsrf/validation/container/download.py "$RUNNER_TEMP/samsrf-polyshape-causal" packages/samsrf/validation/matlab/polyshape-causal-reference.json
          python3 packages/samsrf/validation/container/download.py "$RUNNER_TEMP/samsrf-polyshape-reproducers" packages/samsrf/validation/matlab/polyshape-reproducers-reference.json
          node packages/samsrf/validation/matlab/compare-geometry.mjs "$RUNNER_TEMP/samsrf-polyshape-probe/ubuntu-22.04" "$RUNNER_TEMP/samsrf-polyshape-probe/ubuntu-24.04" "$RUNNER_TEMP/samsrf-polyshape-probe-hosts.json"
          node packages/samsrf/validation/matlab/compare-geometry.mjs "$RUNNER_TEMP/samsrf-polyshape-causal/ubuntu-22.04" "$RUNNER_TEMP/samsrf-polyshape-causal/ubuntu-24.04" "$RUNNER_TEMP/samsrf-polyshape-causal-hosts.json"
          SAMSRF_MATLAB_GEOMETRY_DIR="$RUNNER_TEMP/samsrf-geometry" SAMSRF_MATLAB_POLYSHAPE_PROBE_DIR="$RUNNER_TEMP/samsrf-polyshape-probe" SAMSRF_MATLAB_POLYSHAPE_CAUSAL_DIR="$RUNNER_TEMP/samsrf-polyshape-causal" SAMSRF_MATLAB_POLYSHAPE_REPRODUCERS_DIR="$RUNNER_TEMP/samsrf-polyshape-reproducers" \
            cargo test --release --manifest-path exes/samsrf/Cargo.toml -p samsrf-core --features polyshape-experimental --test matlab_polyshape_experimental -- --nocapture
      - name: CSS trace, MATLAB arithmetic, extreme-scale and rank regression gates
        run: |
          python3 packages/samsrf/validation/container/download.py "$RUNNER_TEMP/samsrf-css-diagnostics" packages/samsrf/validation/matlab/diagnostics-reference.json
          SAMSRF_CSS_DIAGNOSTICS_DIR="$RUNNER_TEMP/samsrf-css-diagnostics" SAMSRF_MATLAB_REFERENCE_DIR="$RUNNER_TEMP/samsrf-source-reference" cargo test --release --manifest-path exes/samsrf/Cargo.toml -p samsrf-core --test css_diagnostics
          python3 packages/samsrf/validation/container/download.py "$RUNNER_TEMP/samsrf-numerics" packages/samsrf/validation/matlab/numerics-reference.json
          SAMSRF_MATLAB_NUMERICS_DIR="$RUNNER_TEMP/samsrf-numerics" cargo test --release --manifest-path exes/samsrf/Cargo.toml -p samsrf-core --test matlab_numerics
          python3 packages/samsrf/validation/container/download.py "$RUNNER_TEMP/samsrf-numerics2" packages/samsrf/validation/matlab/numerics2-reference.json
          SAMSRF_MATLAB_NUMERICS2_DIR="$RUNNER_TEMP/samsrf-numerics2" cargo test --release --manifest-path exes/samsrf/Cargo.toml -p samsrf-core --test matlab_numerics2
          SAMSRF_MATLAB_NUMERICS2_DIR="$RUNNER_TEMP/samsrf-numerics2" SAMSRF_SINGLE_KERNELS_DIR="$RUNNER_TEMP/samsrf-single-kernels" cargo test --release --manifest-path exes/samsrf/Cargo.toml -p samsrf-core --test candidate_exclusions -- --nocapture
          python3 packages/samsrf/validation/container/download.py "$RUNNER_TEMP/samsrf-single-trig" packages/samsrf/validation/matlab/single-trig-reference.json
          SAMSRF_SINGLE_TRIG_DIR="$RUNNER_TEMP/samsrf-single-trig" cargo test --release --manifest-path exes/samsrf/Cargo.toml -p samsrf-core --test single_trig -- --nocapture
          python3 packages/samsrf/validation/container/download.py "$RUNNER_TEMP/samsrf-focused-probes" packages/samsrf/validation/matlab/focused-probes-reference.json
          SAMSRF_FOCUSED_PROBES_DIR="$RUNNER_TEMP/samsrf-focused-probes" SAMSRF_MATLAB_NUMERICS2_DIR="$RUNNER_TEMP/samsrf-numerics2" SAMSRF_REVCOR_REFERENCE_DIR="$RUNNER_TEMP/samsrf-revcor-reference" SAMSRF_SINGLE_TRIG_DIR="$RUNNER_TEMP/samsrf-single-trig" \
            cargo test --release --manifest-path exes/samsrf/Cargo.toml -p samsrf-core --test focused_probes -- --nocapture
          python3 packages/samsrf/validation/container/download.py "$RUNNER_TEMP/samsrf-css-pipelines" packages/samsrf/validation/matlab/css-pipelines-reference.json
          node packages/samsrf/validation/matlab/compare-css.mjs "$RUNNER_TEMP/samsrf-source-reference" "$RUNNER_TEMP/samsrf-css-comparison.json" "$RUNNER_TEMP/samsrf-css-pipelines"
          SAMSRF_MATLAB_REFERENCE_DIR="$RUNNER_TEMP/samsrf-source-reference" SAMSRF_CSS_WASM_REPORT="$RUNNER_TEMP/samsrf-css-comparison.json" SAMSRF_MATLAB_CSS_PIPELINES_DIR="$RUNNER_TEMP/samsrf-css-pipelines" \
            cargo test --release --manifest-path exes/samsrf/Cargo.toml -p samsrf-core --test css_pipeline -- --nocapture
          cargo run --release --manifest-path exes/samsrf/Cargo.toml -p samsrf-core --example css_trace -- "$RUNNER_TEMP/samsrf-source-reference" "$RUNNER_TEMP/samsrf-css-diagnostics" css_pipeline_double_v47_nonnegative0_recorded "$RUNNER_TEMP/samsrf-css-trace.json"
          cargo run --release --manifest-path exes/samsrf/Cargo.toml -p samsrf-core --example css_trace -- "$RUNNER_TEMP/samsrf-source-reference" "$RUNNER_TEMP/samsrf-css-diagnostics" css_pipeline_double_v60_nonnegative0_recorded "$RUNNER_TEMP/samsrf-css-trace-v60.json"
          cargo run --release --manifest-path exes/samsrf/Cargo.toml -p samsrf-core --example css_trace -- "$RUNNER_TEMP/samsrf-source-reference" "$RUNNER_TEMP/samsrf-css-diagnostics" css_pipeline_double_v69_nonnegative0_recorded "$RUNNER_TEMP/samsrf-css-trace-v69.json"
      - name: Least-squares rank, tolerance and coefficient gates (MATLAB mldivide)
        run: |
          python3 packages/samsrf/validation/container/download.py "$RUNNER_TEMP/samsrf-qr-reference" packages/samsrf/validation/matlab/qr-reference.json
          SAMSRF_QR_REFERENCE_DIR="$RUNNER_TEMP/samsrf-qr-reference" SAMSRF_QR_REPORT="$RUNNER_TEMP/samsrf-qr-port.json" cargo test --release --manifest-path exes/samsrf/Cargo.toml -p samsrf-core --test qr_reference -- --nocapture
          python3 packages/samsrf/validation/container/download.py "$RUNNER_TEMP/samsrf-qr-kernels" packages/samsrf/validation/matlab/qr-kernels-reference.json
          SAMSRF_QR_REFERENCE_DIR="$RUNNER_TEMP/samsrf-qr-reference" SAMSRF_QR_KERNELS_DIR="$RUNNER_TEMP/samsrf-qr-kernels" cargo test --release --manifest-path exes/samsrf/Cargo.toml -p samsrf-core --test qr_kernels -- --nocapture
          python3 packages/samsrf/validation/container/download.py "$RUNNER_TEMP/samsrf-controls" packages/samsrf/validation/matlab/controls-reference.json
          python3 -I packages/samsrf/validation/matlab/analyse-controls.py "$RUNNER_TEMP/samsrf-controls" "$RUNNER_TEMP/samsrf-qr-kernels"
          python3 -I packages/samsrf/validation/matlab/qr-accuracy.py "$RUNNER_TEMP/samsrf-qr-reference/ubuntu-24.04/compatible" "$RUNNER_TEMP/samsrf-qr-port.json" "$RUNNER_TEMP/samsrf-qr-accuracy.json"
      - name: Retain the full CSS comparison including remaining differences
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: samsrf-css-comparison
          path: |
            ${{ runner.temp }}/samsrf-css-comparison.json
            ${{ runner.temp }}/samsrf-css-trace.json
            ${{ runner.temp }}/samsrf-css-trace-v60.json
            ${{ runner.temp }}/samsrf-css-trace-v69.json
            ${{ runner.temp }}/samsrf-qr-accuracy.json
          if-no-files-found: ignore
      - name: Retain the reverse-correlation comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: samsrf-revcor-comparison
          path: ${{ runner.temp }}/samsrf-revcor-comparison.json
          if-no-files-found: ignore

  wasm-source:
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'workflow_dispatch' || (!inputs.record_matlab && !inputs.revcor_only && !inputs.qr_only && !inputs.qr_kernels && !inputs.controls_only && (inputs.runtime_cli || 'none') == 'none' && !inputs.runtime_image))
    name: committed WASM equals a rebuild from source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
      - name: Install wasm-pack 0.13.1
        run: cargo install wasm-pack --version 0.13.1 --locked
      - name: Set up wasm-opt
        uses: ./.github/actions/setup-wasm-opt
      - name: Rebuild and compare
        env:
          SAMSRF_REBUILD_DIR: ${{ runner.temp }}/samsrf-rebuild
          WASM_PACK_CACHE: ${{ runner.temp }}/samsrf-bindgen-cache
        run: bash packages/samsrf/scripts/build-wasm.sh --check
      - name: Retain compiler output and binding generator identity
        if: failure() || inputs.wasm_only
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/samsrf-rebuild"
          raw=exes/samsrf/target/wasm32-unknown-unknown/release/samsrf_wasm.wasm
          if [[ -f "$raw" ]]; then
            cp "$raw" "$RUNNER_TEMP/samsrf-rebuild/rust-output.wasm"
          fi
          for bindgen in "$RUNNER_TEMP"/samsrf-bindgen-cache/*/wasm-bindgen; do
            if [[ -f "$bindgen" ]]; then
              sha256sum "$bindgen"
            fi
          done > "$RUNNER_TEMP/samsrf-rebuild/bindgen.sha256"
      - name: Retain rebuild stages for diagnosis
        if: failure() || inputs.wasm_only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: samsrf-differing-rebuild
          path: ${{ runner.temp }}/samsrf-rebuild
          if-no-files-found: ignore

  portable:
    needs: [test, wasm-source]
    uses: ./.github/workflows/node-cli-portable.yml
    permissions:
      contents: write
      id-token: write
    with:
      package: packages/samsrf
      targets: >-
        [{"os": "ubuntu-22.04", "platform": "linux-x64"},
         {"os": "windows-latest", "platform": "windows-x64"},
         {"os": "macos-15", "platform": "macos-arm64"}]
      publish_release: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release }}
      sign_release: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release }}
    secrets:
      APPLEID: ${{ secrets.APPLEID }}
      APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
      CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}

  recorder-smoke:
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'workflow_dispatch' || (!inputs.wasm_only && !inputs.controls_only && (inputs.runtime_cli || 'none') == 'none' && !inputs.runtime_image))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: samsrf/samsrf
          ref: 41ed1e96cc4d9b8b750f5594a61845df21ab8984
          path: reference-source
          persist-credentials: false
      - name: Install Octave for recorder plumbing checks
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends octave octave-dev python3-numpy
      - name: Run the recorder on a pinned real input
        run: |
          python3 packages/samsrf/validation/container/download.py "$RUNNER_TEMP/samsrf-reference" packages/samsrf/validation/matlab/reference.json
          octave --quiet --no-gui --eval "addpath(fullfile(pwd,'packages','samsrf','validation','matlab')); smoke_recorder(fullfile(pwd,'reference-source'),fullfile(getenv('RUNNER_TEMP'),'samsrf-reference'),fullfile(getenv('RUNNER_TEMP'),'samsrf-smoke'))"
      - name: Exercise every reverse-correlation recorder branch
        run: |
          octave --quiet --no-gui --eval "addpath(fullfile(pwd,'packages','samsrf','validation','octave')); test_nanmedian"
          python3 packages/samsrf/validation/container/download.py "$RUNNER_TEMP/samsrf-revcor-input" packages/samsrf/validation/matlab/inputs.json
          python3 packages/samsrf/validation/matlab/prepare.py reference-source "$RUNNER_TEMP/samsrf-revcor-provenance"
          python3 -I packages/samsrf/validation/octave/dump_gifti.py --out "$RUNNER_TEMP/samsrf-revcor-input/x001_lh" --samples "$RUNNER_TEMP/samsrf-revcor-samples.json" "$RUNNER_TEMP/samsrf-revcor-input/x001_lh/"*.gii
          octave --quiet --no-gui --eval "addpath(fullfile(pwd,'packages','samsrf','validation','matlab')); smoke_revcor_recorder(fullfile(pwd,'reference-source'),fullfile(getenv('RUNNER_TEMP'),'samsrf-revcor-input'),fullfile(getenv('RUNNER_TEMP'),'samsrf-revcor-smoke'))"
          node packages/samsrf/validation/matlab/validate-revcor-recording.mjs "$RUNNER_TEMP/samsrf-revcor-smoke" --smoke
          SAMSRF_REVCOR_SMOKE="$RUNNER_TEMP/samsrf-revcor-smoke" node --test packages/samsrf/validation/matlab/test-revcor-validation.mjs
      - name: Exercise the least-squares backend recorder and comparison
        run: |
          for label in compatible compatible-repeat; do
            octave --quiet --no-gui --eval "addpath(fullfile(pwd,'packages','samsrf','validation','matlab')); record_qr_backends(fullfile(getenv('RUNNER_TEMP'),'samsrf-qr-smoke','$label'),'$label')"
          done
          node packages/samsrf/validation/matlab/compare-qr-backends.mjs "$RUNNER_TEMP/samsrf-qr-smoke" "$RUNNER_TEMP/samsrf-qr-smoke.json" --smoke
          octave --quiet --no-gui --eval "addpath(fullfile(pwd,'packages','samsrf','validation','matlab')); record_qr_kernels(fullfile(getenv('RUNNER_TEMP'),'samsrf-qr-kernels-smoke'),fullfile(getenv('RUNNER_TEMP'),'samsrf-qr-smoke','compatible'),true)"

  matlab-reference:
    needs: recorder-smoke
    if: github.event_name == 'workflow_dispatch' && (inputs.qr_kernels || inputs.qr_only || inputs.record_matlab || inputs.revcor_only)
    name: record actual MATLAB source reference (${{ matrix.host }} ${{ matrix.replica }})
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-22.04, ubuntu-24.04]
        # Runner labels do not choose the CPU; more kernel runs reach more of them.
        replica: ${{ fromJSON(inputs.qr_kernels && '[1, 2, 3]' || '[1]') }}
    runs-on: ${{ matrix.host }}
    timeout-minutes: 90
    env:
      MKL_CBWR: COMPATIBLE
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_DYNAMIC: 'FALSE'
      OMP_DYNAMIC: 'FALSE'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out the web port's exact SamSrf version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: samsrf/samsrf
          ref: 41ed1e96cc4d9b8b750f5594a61845df21ab8984
          path: reference-source
          persist-credentials: false
      - name: Prepare verified inputs and declared source repairs
        if: '!inputs.qr_only && !inputs.qr_kernels'
        run: |
          if [ "$(printf '%s\n' '${{ inputs.revcor_only }}' '${{ inputs.diagnostics_only }}' '${{ inputs.geometry_only }}' '${{ inputs.numerics_only }}' '${{ inputs.css_pipelines_only }}' '${{ inputs.kernels_only }}' '${{ inputs.gemv_order }}' '${{ inputs.focused_probes }}' | grep -c true)" -gt 1 ]; then
            echo 'Choose at most one of revcor_only, diagnostics_only, geometry_only, numerics_only, css_pipelines_only, kernels_only, gemv_order and focused_probes.' >&2
            exit 1
          fi
          if [ '${{ inputs.geometry_probe }}' = true ] && [ '${{ inputs.geometry_only }}' != true ]; then
            echo 'geometry_probe narrows geometry_only; set both.' >&2
            exit 1
          fi
          if [ '${{ inputs.geometry_causal }}' = true ] && { [ '${{ inputs.geometry_only }}' != true ] || [ '${{ inputs.geometry_probe }}' = true ]; }; then
            echo 'geometry_causal narrows geometry_only and excludes geometry_probe.' >&2
            exit 1
          fi
          if [ '${{ inputs.geometry_reproducers }}' = true ] && { [ '${{ inputs.geometry_only }}' != true ] || [ '${{ inputs.geometry_probe }}' = true ] || [ '${{ inputs.geometry_causal }}' = true ]; }; then
            echo 'geometry_reproducers narrows geometry_only and excludes geometry_probe and geometry_causal.' >&2
            exit 1
          fi
          python3 packages/samsrf/validation/container/download.py "$RUNNER_TEMP/samsrf-input"
          python3 packages/samsrf/validation/container/download.py "$RUNNER_TEMP/samsrf-matrix-input" packages/samsrf/validation/matlab/inputs.json
          python3 packages/samsrf/validation/matlab/prepare.py reference-source "$RUNNER_TEMP/samsrf-matlab"
          python3 packages/samsrf/validation/matlab/capture_environment.py "$RUNNER_TEMP/samsrf-matlab"
      - name: Prepare a separate reverse-correlation smoke recording
        if: inputs.revcor_only
        run: |
          mkdir "$RUNNER_TEMP/samsrf-revcor-smoke"
          cp "$RUNNER_TEMP/samsrf-matlab/source.json" "$RUNNER_TEMP/samsrf-revcor-smoke/source.json"
          python3 packages/samsrf/validation/matlab/capture_environment.py "$RUNNER_TEMP/samsrf-revcor-smoke"
      - name: Fetch pinned real Benson templates for geometry
        if: inputs.geometry_only
        run: |
          python3 packages/samsrf/validation/container/download.py "$RUNNER_TEMP/samsrf-geometry-input" packages/samsrf/validation/matlab/geometry-inputs.json
          mkdir "$RUNNER_TEMP/samsrf-matlab-repeat"
          cp "$RUNNER_TEMP/samsrf-matlab/source.json" "$RUNNER_TEMP/samsrf-matlab-repeat/source.json"
          python3 packages/samsrf/validation/matlab/capture_environment.py "$RUNNER_TEMP/samsrf-matlab-repeat"
      - name: Fetch pinned MATLAB inputs for focused diagnostics
        if: inputs.diagnostics_only
        run: python3 packages/samsrf/validation/container/download.py "$RUNNER_TEMP/samsrf-reference" packages/samsrf/validation/matlab/reference.json
      - name: Fetch the pinned least-squares designs for the kernel probe
        if: inputs.qr_kernels
        run: |
          if [ '${{ inputs.record_matlab }}' = true ] || [ '${{ inputs.revcor_only }}' = true ] || [ '${{ inputs.qr_only }}' = true ]; then
            echo 'qr_kernels records the least-squares kernels alone.' >&2
            exit 1
          fi
          python3 packages/samsrf/validation/container/download.py "$RUNNER_TEMP/samsrf-qr-reference" packages/samsrf/validation/matlab/qr-reference.json
      - name: Fetch the pinned CSS regressions replayed by the least-squares recording
        if: inputs.qr_only
        run: |
          if [ '${{ inputs.record_matlab }}' = true ] || [ '${{ inputs.revcor_only }}' = true ] || [ '${{ inputs.diagnostics_only }}' = true ] || [ '${{ inputs.geometry_only }}' = true ] || [ '${{ inputs.numerics_only }}' = true ] || [ '${{ inputs.css_pipelines_only }}' = true ] || [ '${{ inputs.kernels_only }}' = true ] || [ '${{ inputs.gemv_order }}' = true ] || [ '${{ inputs.focused_probes }}' = true ]; then
            echo 'qr_only records least-squares solves alone.' >&2
            exit 1
          fi
          python3 packages/samsrf/validation/container/download.py "$RUNNER_TEMP/samsrf-css-diagnostics" packages/samsrf/validation/matlab/diagnostics-reference.json
      - name: Check out the pinned SPM GIfTI readers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: spm/spm12
          ref: 03ac9473cad402407b6472228377c0167fdc54b8
          path: reference-spm
          sparse-checkout: |
            @gifti
            @xmltree
            @file_array
          persist-credentials: false
      - name: Set up real MATLAB and required toolboxes
        uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3
        with:
          release: R2023bU11
          products: Statistics_and_Machine_Learning_Toolbox Image_Processing_Toolbox Parallel_Computing_Toolbox
      - name: Smoke every reverse-correlation recorder branch in MATLAB
        if: inputs.revcor_only
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: addpath(fullfile(pwd,'packages','samsrf','validation','matlab')); record_reference(fullfile(pwd,'reference-source'),fullfile(getenv('RUNNER_TEMP'),'samsrf-input'),fullfile(getenv('RUNNER_TEMP'),'samsrf-revcor-smoke'),fullfile(getenv('RUNNER_TEMP'),'samsrf-matrix-input'),fullfile(pwd,'reference-spm'),true,true)
      - name: Validate MATLAB smoke before recording the full matrix
        if: inputs.revcor_only
        run: node packages/samsrf/validation/matlab/validate-revcor-recording.mjs "$RUNNER_TEMP/samsrf-revcor-smoke" --smoke
      - name: Record geometry
        if: inputs.geometry_only
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: addpath(fullfile(pwd,'packages','samsrf','validation','matlab')); record_geometry(fullfile(pwd,'reference-source'),fullfile(getenv('RUNNER_TEMP'),'samsrf-geometry-input'),fullfile(getenv('RUNNER_TEMP'),'samsrf-matlab'),fullfile(pwd,'reference-spm'),'${{ inputs.geometry_probe && 'polyshape-probe' || inputs.geometry_causal && 'polyshape-causal' || inputs.geometry_reproducers && 'polyshape-reproducers' || 'full' }}')
      - name: Repeat geometry in a new MATLAB process on this host
        if: inputs.geometry_only
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: addpath(fullfile(pwd,'packages','samsrf','validation','matlab')); record_geometry(fullfile(pwd,'reference-source'),fullfile(getenv('RUNNER_TEMP'),'samsrf-geometry-input'),fullfile(getenv('RUNNER_TEMP'),'samsrf-matlab-repeat'),fullfile(pwd,'reference-spm'),'${{ inputs.geometry_probe && 'polyshape-probe' || inputs.geometry_causal && 'polyshape-causal' || inputs.geometry_reproducers && 'polyshape-reproducers' || 'full' }}')
      - name: Compare same-host geometry recordings
        if: inputs.geometry_only
        run: node packages/samsrf/validation/matlab/compare-geometry.mjs "$RUNNER_TEMP/samsrf-matlab" "$RUNNER_TEMP/samsrf-matlab-repeat" "$RUNNER_TEMP/samsrf-matlab/repeat-comparison.json"
      - name: Record numerical intermediates and fitted maps
        if: '!inputs.diagnostics_only && !inputs.qr_only && !inputs.qr_kernels && !inputs.geometry_only && !inputs.numerics_only && !inputs.css_pipelines_only && !inputs.kernels_only && !inputs.gemv_order && !inputs.focused_probes'
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: addpath(fullfile(pwd,'packages','samsrf','validation','matlab')); matrixInput=fullfile(getenv('RUNNER_TEMP'),'samsrf-matrix-input'); reverseCorrelationOnly=strcmp('${{ inputs.revcor_only }}','true'); if ~reverseCorrelationOnly && strcmp('${{ inputs.include_matrix }}','false'), matrixInput=''; end; record_reference(fullfile(pwd,'reference-source'),fullfile(getenv('RUNNER_TEMP'),'samsrf-input'),fullfile(getenv('RUNNER_TEMP'),'samsrf-matlab'),matrixInput,fullfile(pwd,'reference-spm'),reverseCorrelationOnly,false,reverseCorrelationOnly && strcmp('${{ inputs.revcor_edges }}','true'))
      - name: Require every reverse-correlation case and recorded array
        if: inputs.revcor_only && !inputs.revcor_edges
        run: node packages/samsrf/validation/matlab/validate-revcor-recording.mjs "$RUNNER_TEMP/samsrf-matlab"
      - name: Record least-squares solves with MKL request compatible
        if: inputs.qr_only
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        env:
          MKL_CBWR: COMPATIBLE
        with:
          command: addpath(fullfile(pwd,'packages','samsrf','validation','matlab')); record_qr_backends(fullfile(getenv('RUNNER_TEMP'),'samsrf-qr','compatible'),'compatible',fullfile(getenv('RUNNER_TEMP'),'samsrf-css-diagnostics'))
      - name: Record least-squares solves with MKL request compatible-repeat
        if: inputs.qr_only
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        env:
          MKL_CBWR: COMPATIBLE
        with:
          command: addpath(fullfile(pwd,'packages','samsrf','validation','matlab')); record_qr_backends(fullfile(getenv('RUNNER_TEMP'),'samsrf-qr','compatible-repeat'),'compatible-repeat',fullfile(getenv('RUNNER_TEMP'),'samsrf-css-diagnostics'))
      - name: Record least-squares solves with MKL request auto
        if: inputs.qr_only
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        env:
          MKL_CBWR: AUTO
        with:
          command: addpath(fullfile(pwd,'packages','samsrf','validation','matlab')); record_qr_backends(fullfile(getenv('RUNNER_TEMP'),'samsrf-qr','auto'),'auto',fullfile(getenv('RUNNER_TEMP'),'samsrf-css-diagnostics'))
      - name: Record least-squares solves with MKL request sse4_2
        if: inputs.qr_only
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        env:
          MKL_CBWR: SSE4_2
        with:
          command: addpath(fullfile(pwd,'packages','samsrf','validation','matlab')); record_qr_backends(fullfile(getenv('RUNNER_TEMP'),'samsrf-qr','sse4_2'),'sse4_2',fullfile(getenv('RUNNER_TEMP'),'samsrf-css-diagnostics'))
      - name: Record least-squares solves with MKL request avx2
        if: inputs.qr_only
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        env:
          MKL_CBWR: AVX2
        with:
          command: addpath(fullfile(pwd,'packages','samsrf','validation','matlab')); record_qr_backends(fullfile(getenv('RUNNER_TEMP'),'samsrf-qr','avx2'),'avx2',fullfile(getenv('RUNNER_TEMP'),'samsrf-css-diagnostics'))
      - name: Record least-squares solves with MKL request avx512
        if: inputs.qr_only
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        env:
          MKL_CBWR: AVX512
        with:
          command: addpath(fullfile(pwd,'packages','samsrf','validation','matlab')); record_qr_backends(fullfile(getenv('RUNNER_TEMP'),'samsrf-qr','avx512'),'avx512',fullfile(getenv('RUNNER_TEMP'),'samsrf-css-diagnostics'))
      - name: Record least-squares solves with MKL request enable-sse4_2
        if: inputs.qr_only
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        env:
          MKL_CBWR: AUTO
          MKL_ENABLE_INSTRUCTIONS: SSE4_2
        with:
          command: addpath(fullfile(pwd,'packages','samsrf','validation','matlab')); record_qr_backends(fullfile(getenv('RUNNER_TEMP'),'samsrf-qr','enable-sse4_2'),'enable-sse4_2',fullfile(getenv('RUNNER_TEMP'),'samsrf-css-diagnostics'))
      - name: Record MKL's least-squares steps and gemv summation trees
        if: inputs.qr_kernels
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: addpath(fullfile(pwd,'packages','samsrf','validation','matlab')); record_qr_kernels(fullfile(getenv('RUNNER_TEMP'),'samsrf-qr-kernels'),fullfile(getenv('RUNNER_TEMP'),'samsrf-qr-reference','ubuntu-24.04','compatible'))
      - name: Compare least-squares solves across MKL requests
        if: inputs.qr_only
        run: node packages/samsrf/validation/matlab/compare-qr-backends.mjs "$RUNNER_TEMP/samsrf-qr" "$RUNNER_TEMP/samsrf-qr/backend-comparison.json"
      - name: Record focused CSS and regression diagnostics
        if: inputs.diagnostics_only
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: addpath(fullfile(pwd,'packages','samsrf','validation','matlab')); record_css_diagnostics(fullfile(pwd,'reference-source'),fullfile(getenv('RUNNER_TEMP'),'samsrf-reference'),fullfile(getenv('RUNNER_TEMP'),'samsrf-matlab'))
      - name: Prepare a fresh same-host repeat
        if: inputs.diagnostics_only
        run: |
          mkdir "$RUNNER_TEMP/samsrf-matlab-repeat"
          cp "$RUNNER_TEMP/samsrf-matlab/source.json" "$RUNNER_TEMP/samsrf-matlab-repeat/source.json"
          python3 packages/samsrf/validation/matlab/capture_environment.py "$RUNNER_TEMP/samsrf-matlab-repeat"
      - name: Repeat focused diagnostics in a new MATLAB process on this host
        if: inputs.diagnostics_only
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: addpath(fullfile(pwd,'packages','samsrf','validation','matlab')); record_css_diagnostics(fullfile(pwd,'reference-source'),fullfile(getenv('RUNNER_TEMP'),'samsrf-reference'),fullfile(getenv('RUNNER_TEMP'),'samsrf-matlab-repeat'))
      - name: Compare same-host numerical arrays and decisions
        if: inputs.diagnostics_only
        run: node packages/samsrf/validation/matlab/compare-recordings.mjs "$RUNNER_TEMP/samsrf-matlab" "$RUNNER_TEMP/samsrf-matlab-repeat" "$RUNNER_TEMP/samsrf-matlab/repeat-comparison.json"
      - name: Record MATLAB's single-precision reverse-correlation kernels
        if: inputs.kernels_only
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: addpath(fullfile(pwd,'packages','samsrf','validation','matlab')); record_single_kernels(fullfile(pwd,'reference-source'),fullfile(getenv('RUNNER_TEMP'),'samsrf-matrix-input'),fullfile(getenv('RUNNER_TEMP'),'samsrf-matlab'),fullfile(pwd,'reference-spm'))
      - name: Prepare a same-host kernel repeat
        if: inputs.kernels_only
        run: |
          mkdir "$RUNNER_TEMP/samsrf-matlab-repeat"
          cp "$RUNNER_TEMP/samsrf-matlab/source.json" "$RUNNER_TEMP/samsrf-matlab-repeat/source.json"
          python3 packages/samsrf/validation/matlab/capture_environment.py "$RUNNER_TEMP/samsrf-matlab-repeat"
      - name: Repeat the kernels in a new MATLAB process on this host
        if: inputs.kernels_only
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: addpath(fullfile(pwd,'packages','samsrf','validation','matlab')); record_single_kernels(fullfile(pwd,'reference-source'),fullfile(getenv('RUNNER_TEMP'),'samsrf-matrix-input'),fullfile(getenv('RUNNER_TEMP'),'samsrf-matlab-repeat'),fullfile(pwd,'reference-spm'))
      - name: Require every kernel case and an exact same-host repeat
        if: inputs.kernels_only
        run: node packages/samsrf/validation/matlab/validate-kernel-recording.mjs "$RUNNER_TEMP/samsrf-matlab" "$RUNNER_TEMP/samsrf-matlab-repeat"
      - name: Fingerprint MATLAB's single y' * A summation order
        if: inputs.gemv_order
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: addpath(fullfile(pwd,'packages','samsrf','validation','matlab')); record_gemv_order(fullfile(getenv('RUNNER_TEMP'),'samsrf-matlab'))
      - name: Repeat the fingerprint in a new MATLAB process
        if: inputs.gemv_order
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: addpath(fullfile(pwd,'packages','samsrf','validation','matlab')); record_gemv_order(fullfile(getenv('RUNNER_TEMP'),'samsrf-matlab-repeat'))
      - name: Require an exact same-host repeat and reconstruct the trees
        if: inputs.gemv_order
        run: |
          cmp "$RUNNER_TEMP/samsrf-matlab/gemv-order.json" "$RUNNER_TEMP/samsrf-matlab-repeat/gemv-order.json"
          node packages/samsrf/validation/matlab/analyse-gemv-order.mjs "$RUNNER_TEMP/samsrf-matlab" "$RUNNER_TEMP/samsrf-matlab/gemv-trees.json"
      - name: Fetch the pinned inputs of the focused probes
        if: inputs.focused_probes
        run: |
          python3 packages/samsrf/validation/container/download.py "$RUNNER_TEMP/samsrf-revcor-reference" packages/samsrf/validation/matlab/revcor-reference.json
          python3 packages/samsrf/validation/container/download.py "$RUNNER_TEMP/samsrf-numerics2" packages/samsrf/validation/matlab/numerics2-reference.json
          python3 packages/samsrf/validation/container/download.py "$RUNNER_TEMP/samsrf-single-trig" packages/samsrf/validation/matlab/single-trig-reference.json
          mkdir "$RUNNER_TEMP/samsrf-matlab-repeat"
          cp "$RUNNER_TEMP/samsrf-matlab/source.json" "$RUNNER_TEMP/samsrf-matlab-repeat/source.json"
          python3 packages/samsrf/validation/matlab/capture_environment.py "$RUNNER_TEMP/samsrf-matlab-repeat"
      - name: Record the focused probes
        if: inputs.focused_probes
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: addpath(fullfile(pwd,'packages','samsrf','validation','matlab')); t = getenv('RUNNER_TEMP'); record_focused_probes(fullfile(pwd,'reference-source'),fullfile(t,'samsrf-revcor-reference'),fullfile(t,'samsrf-numerics2'),fullfile(t,'samsrf-single-trig'),fullfile(t,'samsrf-matlab'))
      - name: Repeat the focused probes in a new MATLAB process
        if: inputs.focused_probes
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: addpath(fullfile(pwd,'packages','samsrf','validation','matlab')); t = getenv('RUNNER_TEMP'); record_focused_probes(fullfile(pwd,'reference-source'),fullfile(t,'samsrf-revcor-reference'),fullfile(t,'samsrf-numerics2'),fullfile(t,'samsrf-single-trig'),fullfile(t,'samsrf-matlab-repeat'))
      - name: Require an exact same-host repeat of the focused probes
        if: inputs.focused_probes
        run: |
          python3 - "$RUNNER_TEMP/samsrf-matlab" "$RUNNER_TEMP/samsrf-matlab-repeat" <<'PY'
          import json, pathlib, sys
          first, repeat = (pathlib.Path(p) for p in sys.argv[1:])
          load = lambda root: json.loads((root / 'focused.json').read_text())['cases']
          assert load(first) == load(repeat), 'focused cases differ between processes'
          arrays = sorted(p.name for p in first.glob('*.f64'))
          assert arrays and arrays == sorted(p.name for p in repeat.glob('*.f64')), 'array files differ'
          for name in arrays:
              assert (first / name).read_bytes() == (repeat / name).read_bytes(), name
          print(f'{len(arrays)} arrays and every case equal in a new process')
          PY
      - name: Record MATLAB arithmetic on generated inputs
        if: inputs.numerics_only
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: addpath(fullfile(pwd,'packages','samsrf','validation','matlab')); record_numerics_probes(fullfile(pwd,'reference-source'),fullfile(getenv('RUNNER_TEMP'),'samsrf-matlab'))
      - name: Prepare a same-host repeat and an MKL_CBWR=AUTO comparison
        if: inputs.numerics_only
        run: |
          for name in repeat auto; do
            mkdir "$RUNNER_TEMP/samsrf-matlab-$name"
            cp "$RUNNER_TEMP/samsrf-matlab/source.json" "$RUNNER_TEMP/samsrf-matlab-$name/source.json"
          done
          python3 packages/samsrf/validation/matlab/capture_environment.py "$RUNNER_TEMP/samsrf-matlab-repeat"
          MKL_CBWR=AUTO python3 packages/samsrf/validation/matlab/capture_environment.py "$RUNNER_TEMP/samsrf-matlab-auto" AUTO
      - name: Repeat the arithmetic probes in a new MATLAB process
        if: inputs.numerics_only
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: addpath(fullfile(pwd,'packages','samsrf','validation','matlab')); record_numerics_probes(fullfile(pwd,'reference-source'),fullfile(getenv('RUNNER_TEMP'),'samsrf-matlab-repeat'))
      - name: Probe MKL with MKL_CBWR=AUTO in a new MATLAB process
        if: inputs.numerics_only
        env:
          MKL_CBWR: AUTO
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: addpath(fullfile(pwd,'packages','samsrf','validation','matlab')); record_numerics_probes(fullfile(pwd,'reference-source'),fullfile(getenv('RUNNER_TEMP'),'samsrf-matlab-auto'),{'blas'},'AUTO')
      - name: Record the double CSS pipelines with original and nonnegative apertures
        if: inputs.css_pipelines_only
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: addpath(fullfile(pwd,'packages','samsrf','validation','matlab')); record_css_pipelines(fullfile(pwd,'reference-source'),fullfile(getenv('RUNNER_TEMP'),'samsrf-matrix-input'),fullfile(getenv('RUNNER_TEMP'),'samsrf-matlab'),fullfile(pwd,'reference-spm'))
      - name: Prepare a same-host repeat of the CSS pipelines
        if: inputs.css_pipelines_only
        run: |
          mkdir "$RUNNER_TEMP/samsrf-matlab-repeat"
          cp "$RUNNER_TEMP/samsrf-matlab/source.json" "$RUNNER_TEMP/samsrf-matlab-repeat/source.json"
          python3 packages/samsrf/validation/matlab/capture_environment.py "$RUNNER_TEMP/samsrf-matlab-repeat"
      - name: Repeat the CSS pipelines in a new MATLAB process
        if: inputs.css_pipelines_only
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: addpath(fullfile(pwd,'packages','samsrf','validation','matlab')); record_css_pipelines(fullfile(pwd,'reference-source'),fullfile(getenv('RUNNER_TEMP'),'samsrf-matrix-input'),fullfile(getenv('RUNNER_TEMP'),'samsrf-matlab-repeat'),fullfile(pwd,'reference-spm'))
      - name: Retain complete or partial reference for diagnosis
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: samsrf-matlab-${{ github.sha }}-${{ matrix.host }}-${{ matrix.replica }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/samsrf-qr-kernels/
            ${{ runner.temp }}/samsrf-matlab/
            ${{ runner.temp }}/samsrf-matlab-repeat/
            ${{ runner.temp }}/samsrf-matlab-auto/
            ${{ runner.temp }}/samsrf-revcor-smoke/
            ${{ runner.temp }}/samsrf-qr/
          if-no-files-found: error

  # SamSrfAnalysis, the upstream command line, on one case matrix (cli_plan.py).
  # source: public MATLAB runs the matrix twice in fresh directories on each host.
  # build: MATLAB Compiler packages the repaired source; the compiled image then
  # runs the same matrix on the same host and must reproduce source MATLAB bit for
  # bit before it is published. Compiler is a transformation product: it needs a
  # MathWorks batch licensing token in the MLM_LICENSE_TOKEN secret.
  matlab-controls:
    if: github.event_name == 'workflow_dispatch' && inputs.controls_only
    name: record MKL controls in MATLAB (${{ matrix.host }} ${{ matrix.request }})
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-22.04, ubuntu-24.04]
        request: [documented, none, contrast]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Refuse combination with other recordings
        run: |
          if [ '${{ inputs.record_matlab }}' = true ] || [ '${{ inputs.revcor_only }}' = true ] || [ '${{ inputs.qr_only }}' = true ] || [ '${{ inputs.qr_kernels }}' = true ]; then
            echo 'controls_only records the MKL controls alone.' >&2
            exit 1
          fi
      - name: Set the requested environment
        run: |
          case '${{ matrix.request }}' in
            documented) printf '%s\n' MKL_CBWR=COMPATIBLE MKL_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_DYNAMIC=FALSE OMP_DYNAMIC=FALSE >> "$GITHUB_ENV" ;;
            contrast) printf '%s\n' MKL_CBWR=AVX2 MKL_NUM_THREADS=4 OMP_NUM_THREADS=4 MKL_DYNAMIC=TRUE OMP_DYNAMIC=TRUE >> "$GITHUB_ENV" ;;
            none) ;;
          esac
      - name: Set up real MATLAB
        uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3
        with:
          release: R2023bU11
      - name: Record the controls
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: addpath(fullfile(pwd,'packages','samsrf','validation','matlab')); record_controls(fullfile(getenv('RUNNER_TEMP'),'samsrf-controls','first'),'${{ matrix.request }}')
      - name: Repeat in a new MATLAB process on this host
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: addpath(fullfile(pwd,'packages','samsrf','validation','matlab')); record_controls(fullfile(getenv('RUNNER_TEMP'),'samsrf-controls','repeat'),'${{ matrix.request }}')
      - name: Retain the receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: samsrf-controls-${{ matrix.host }}-${{ matrix.request }}
          path: |
            ${{ runner.temp }}/samsrf-controls/*/controls.json
            ${{ runner.temp }}/samsrf-controls/*/controls-partial.json
            ${{ runner.temp }}/samsrf-controls/*/*.f64
          if-no-files-found: warn

  runtime-cli:
    if: github.event_name == 'workflow_dispatch' && (inputs.runtime_cli == 'source' || inputs.runtime_cli == 'build')
    name: SamSrfAnalysis CLI ${{ inputs.runtime_cli }} (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(inputs.runtime_cli == 'build' && '["ubuntu-22.04"]' || '["ubuntu-22.04","ubuntu-24.04"]') }}
    runs-on: ${{ matrix.host }}
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write
    env:
      MKL_CBWR: COMPATIBLE
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_DYNAMIC: 'FALSE'
      OMP_DYNAMIC: 'FALSE'
    steps:
      - name: Require a batch licensing token for MATLAB Compiler
        if: inputs.runtime_cli == 'build'
        env:
          TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo 'MATLAB Compiler is not covered by the public-project license. Add a MathWorks batch licensing token as the MLM_LICENSE_TOKEN secret.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out the web port's exact SamSrf version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: samsrf/samsrf
          ref: 41ed1e96cc4d9b8b750f5594a61845df21ab8984
          path: reference-source
          persist-credentials: false
      - name: Check out the pinned SPM GIfTI readers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: spm/spm12
          ref: 03ac9473cad402407b6472228377c0167fdc54b8
          path: reference-spm
          sparse-checkout: |
            @gifti
            @xmltree
            @file_array
          persist-credentials: false
      - name: Prepare verified inputs, declared source repairs and the case plan
        run: |
          python3 packages/samsrf/validation/container/download.py "$RUNNER_TEMP/samsrf-matrix-input" packages/samsrf/validation/matlab/inputs.json
          python3 packages/samsrf/validation/matlab/prepare.py --cli reference-source "$RUNNER_TEMP/samsrf-cli/provenance"
          python3 packages/samsrf/validation/matlab/cli_plan.py plan "$RUNNER_TEMP/samsrf-cli/plan.json"
          python3 -m venv "$RUNNER_TEMP/samsrf-cli-venv"
          "$RUNNER_TEMP/samsrf-cli-venv/bin/pip" install --only-binary=:all: -r packages/samsrf/validation/matlab/requirements-cli.txt
      - name: Set up real MATLAB and required toolboxes
        uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3
        with:
          release: R2023bU11
          products: ${{ inputs.runtime_cli == 'build' && 'MATLAB_Compiler ' || '' }}Statistics_and_Machine_Learning_Toolbox Image_Processing_Toolbox Parallel_Computing_Toolbox
      - name: Build the version-matched Runtime image with MATLAB Compiler
        if: inputs.runtime_cli == 'build'
        env:
          MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}
          SAMSRF_MATLAB_BATCH: matlab-batch
        run: python3 packages/samsrf/validation/matlab/build_container.py reference-source reference-spm "$RUNNER_TEMP/samsrf-cli/container-build"
      - name: Prepare the shared read-only input bundle in source MATLAB
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: addpath(fullfile(pwd,'packages','samsrf','validation','matlab')); prepare_cli_bundle(fullfile(pwd,'reference-source'),fullfile(pwd,'reference-spm'),fullfile(getenv('RUNNER_TEMP'),'samsrf-matrix-input'),fullfile(getenv('RUNNER_TEMP'),'samsrf-cli','bundle'),fullfile(getenv('RUNNER_TEMP'),'samsrf-cli','plan.json'))
      - name: Write models, hash and freeze the bundle at /input
        run: |
          cli="$RUNNER_TEMP/samsrf-cli"
          python3 packages/samsrf/validation/matlab/cli_plan.py models "$cli/plan.json" "$cli/bundle"
          python3 packages/samsrf/validation/matlab/cli_plan.py hash "$cli/bundle" "$cli/bundle-sha256.json"
          chmod -R a-w "$cli/bundle"
          sudo ln -s "$cli/bundle" /input
          for run in source-1 source-2; do
            python3 packages/samsrf/validation/matlab/cli_plan.py stage "$cli/plan.json" "$cli/bundle" "$cli/$run"
            python3 packages/samsrf/validation/matlab/capture_environment.py "$cli/$run"
          done
      - name: Run the matrix in source MATLAB
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: addpath(fullfile(pwd,'packages','samsrf','validation','matlab')); run_source_cli(fullfile(pwd,'reference-source'),fullfile(pwd,'reference-spm'),fullfile(getenv('RUNNER_TEMP'),'samsrf-cli','plan.json'),fullfile(getenv('RUNNER_TEMP'),'samsrf-cli','source-1'))
      - name: Check the custom-HRF runs against a direct call with the column HRF
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: addpath(fullfile(pwd,'packages','samsrf','validation','matlab')); verify_cli_hrf(fullfile(pwd,'reference-source'),fullfile(pwd,'reference-spm'),fullfile(getenv('RUNNER_TEMP'),'samsrf-cli','plan.json'),fullfile(getenv('RUNNER_TEMP'),'samsrf-cli','source-1'),fullfile(getenv('RUNNER_TEMP'),'samsrf-cli','source-1-direct'))
      - name: Repeat the matrix in a new MATLAB process
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: addpath(fullfile(pwd,'packages','samsrf','validation','matlab')); run_source_cli(fullfile(pwd,'reference-source'),fullfile(pwd,'reference-spm'),fullfile(getenv('RUNNER_TEMP'),'samsrf-cli','plan.json'),fullfile(getenv('RUNNER_TEMP'),'samsrf-cli','source-2'))
      - name: Require every case to succeed and repeat exactly
        run: |
          cli="$RUNNER_TEMP/samsrf-cli"
          python3 packages/samsrf/validation/matlab/cli_plan.py verify "$cli/bundle" "$cli/bundle-sha256.json"
          "$RUNNER_TEMP/samsrf-cli-venv/bin/python" packages/samsrf/validation/matlab/compare_cli.py "$cli/plan.json" "$cli/source-1" "$cli/source-2" "$cli/source-repeat.json"
      - name: Run, repeat, interrupt and fail the compiled image on this host
        if: inputs.runtime_cli == 'build'
        run: |
          cli="$RUNNER_TEMP/samsrf-cli"
          matlab="packages/samsrf/validation/matlab"
          image="$(docker image inspect samsrf-reference:41ed1e96-r2023b --format '{{.Id}}')"
          for run in compiled-1 compiled-2 interrupt; do
            python3 "$matlab/cli_plan.py" stage "$cli/plan.json" "$cli/bundle" "$cli/$run"
          done
          python3 "$matlab/run_runtime_cli.py" run "$image" "$cli/plan.json" "$cli/bundle" "$cli/compiled-1"
          python3 "$matlab/run_runtime_cli.py" run "$image" "$cli/plan.json" "$cli/bundle" "$cli/compiled-2"
          "$RUNNER_TEMP/samsrf-cli-venv/bin/python" "$matlab/compare_cli.py" "$cli/plan.json" "$cli/source-1" "$cli/compiled-1" "$cli/compiled-vs-source.json"
          "$RUNNER_TEMP/samsrf-cli-venv/bin/python" "$matlab/compare_cli.py" "$cli/plan.json" "$cli/compiled-1" "$cli/compiled-2" "$cli/compiled-repeat.json"
          longest="$(python3 -c 'import json,pathlib,sys; r=[json.loads(p.read_text()) for p in pathlib.Path(sys.argv[1]).glob("*.json") if p.name not in ("environment.json","inputs.json")]; m=max(r,key=lambda x:x["seconds"]); print(m["id"], max(10, m["seconds"]/2))' "$cli/compiled-1/receipts")"
          python3 "$matlab/run_runtime_cli.py" interrupt "$image" "$cli/plan.json" "$cli/bundle" "$cli/interrupt" $longest
          mkdir -p "$cli/failure/missing-model"
          cp "$cli/bundle/SamSrf_defaults.json" "$cli/failure/missing-model/"
          python3 "$matlab/run_runtime_cli.py" failure "$image" "$cli/bundle" "$cli/failure/missing-model"
      - name: Publish the validated image by digest
        if: inputs.runtime_cli == 'build'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          target="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/samsrf-reference:41ed1e96-r2023bu11-${GITHUB_RUN_ID}"
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          docker tag samsrf-reference:41ed1e96-r2023b "$target"
          docker push "$target"
          docker image inspect "$target" --format '{{json .RepoDigests}}' > "$RUNNER_TEMP/samsrf-cli/container-build/published.json"
          cat "$RUNNER_TEMP/samsrf-cli/container-build/published.json"
      - name: Retain plan, bundle, receipts, outputs and comparisons
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: samsrf-cli-${{ inputs.runtime_cli }}-${{ github.sha }}-${{ matrix.host }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/samsrf-cli/
            !${{ runner.temp }}/samsrf-cli/container-build/runtime/
            !${{ runner.temp }}/samsrf-cli/container-build/container/
          if-no-files-found: error

  # Runtime-only host: no MATLAB, no license and no network inside the container.
  runtime-image:
    if: github.event_name == 'workflow_dispatch' && inputs.runtime_image != ''
    name: Runtime-only validation of the published reference image
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      IMAGE: ${{ inputs.runtime_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Fetch the pinned bundle and source recording
        run: |
          python3 packages/samsrf/validation/container/download.py "$RUNNER_TEMP/samsrf-cli" packages/samsrf/validation/matlab/cli-reference.json
          python3 -m venv "$RUNNER_TEMP/samsrf-cli-venv"
          "$RUNNER_TEMP/samsrf-cli-venv/bin/pip" install --only-binary=:all: -r packages/samsrf/validation/matlab/requirements-cli.txt
      - name: Run, repeat, interrupt and fail the image without MATLAB
        run: |
          cli="$RUNNER_TEMP/samsrf-cli"
          matlab="packages/samsrf/validation/matlab"
          python3 "$matlab/cli_plan.py" verify "$cli/bundle" "$cli/bundle-sha256.json"
          chmod -R a-w "$cli/bundle"
          if command -v matlab; then echo 'MATLAB must not be installed on this host' >&2; exit 1; fi
          docker pull "$IMAGE"
          for run in runtime-1 runtime-2 interrupt; do
            python3 "$matlab/cli_plan.py" stage "$cli/plan.json" "$cli/bundle" "$cli/$run"
          done
          python3 "$matlab/run_runtime_cli.py" run "$IMAGE" "$cli/plan.json" "$cli/bundle" "$cli/runtime-1"
          python3 "$matlab/run_runtime_cli.py" run "$IMAGE" "$cli/plan.json" "$cli/bundle" "$cli/runtime-2"
          "$RUNNER_TEMP/samsrf-cli-venv/bin/python" "$matlab/compare_cli.py" "$cli/plan.json" "$cli/runtime-1" "$cli/runtime-2" "$cli/runtime-repeat.json"
          longest="$(python3 -c 'import json,pathlib,sys; r=[json.loads(p.read_text()) for p in pathlib.Path(sys.argv[1]).glob("*.json") if p.name not in ("environment.json","inputs.json")]; m=max(r,key=lambda x:x["seconds"]); print(m["id"], max(10, m["seconds"]/2))' "$cli/runtime-1/receipts")"
          python3 "$matlab/run_runtime_cli.py" interrupt "$IMAGE" "$cli/plan.json" "$cli/bundle" "$cli/interrupt" $longest
          mkdir -p "$cli/failure/missing-model"
          cp "$cli/bundle/SamSrf_defaults.json" "$cli/failure/missing-model/"
          python3 "$matlab/run_runtime_cli.py" failure "$IMAGE" "$cli/bundle" "$cli/failure/missing-model"
      - name: Report differences from the pinned source recording (other host, not gated)
        run: |
          cli="$RUNNER_TEMP/samsrf-cli"
          "$RUNNER_TEMP/samsrf-cli-venv/bin/python" packages/samsrf/validation/matlab/compare_cli.py "$cli/plan.json" "$cli/source-1" "$cli/runtime-1" "$cli/runtime-vs-pinned-source.json" || echo 'Cross-host differences recorded; the same-host gate is in the build job.'
      - name: Retain receipts, outputs and comparisons
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: samsrf-runtime-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/samsrf-cli/
          if-no-files-found: error
