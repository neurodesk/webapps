name: windows-signing-policy
on:
  pull_request:
    paths:
      - '.github/actions/windows-signing/**'
      - '.github/workflows/windows-signing-policy.yml'
      - 'scripts/lib/*windows_signing*'
      - 'scripts/windows-signing.ps1'
      - 'scripts/desktop/windows-signing.mjs'
      - 'test/windows-signing.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/actions/windows-signing/**'
      - '.github/workflows/windows-signing-policy.yml'
      - 'scripts/lib/*windows_signing*'
      - 'scripts/windows-signing.ps1'
      - 'scripts/desktop/windows-signing.mjs'
      - 'test/windows-signing.test.mjs'
permissions:
  contents: read
jobs:
  policy:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Test offline signing policy and packagers
        run: |
          python scripts/lib/test_windows_signing.py
          python exes/node-cli/scripts/test_portable_release.py
          python exes/synthsr/scripts/test_portable_release.py
      - name: Parse PowerShell integration without an account
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/windows-signing.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
