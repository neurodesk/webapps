name: node-cli

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - '.github/workflows/node-cli.yml'
      - '.github/workflows/node-cli-portable.yml'
      - 'exes/node-cli/**'

concurrency:
  group: node-cli-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  packager:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: ./.github/workflows/node-cli-portable.yml
    permissions:
      contents: write
      id-token: write
    with:
      package: packages/topofit
      targets: >-
        [{"os": "ubuntu-22.04", "platform": "linux-x64"},
         {"os": "windows-latest", "platform": "windows-x64"},
         {"os": "macos-15", "platform": "macos-arm64"}]
      all_platforms_on_pull_request: true
