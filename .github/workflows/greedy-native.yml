name: greedy-native

on:
  pull_request:
    paths:
      - '.github/actions/windows-signing/**'
      - 'scripts/windows-signing.ps1'
      - 'scripts/lib/windows_signing.py'
      - '.github/workflows/greedy-native.yml'
      - 'exes/greedy/**'
      - 'packages/greedy/**'
      - 'apps/greedy/package.json'
      - 'scripts/package-greedy*'
      - 'scripts/greedy-third-party-notices.py'
      - 'test/greedy-distribution.test.mjs'
      - 'apps/bison/examples.json'
      - 'models/bison.manifest.json'
  push:
    branches: [main]
    paths:
      - '.github/actions/windows-signing/**'
      - 'scripts/windows-signing.ps1'
      - 'scripts/lib/windows_signing.py'
      - '.github/workflows/greedy-native.yml'
      - 'exes/greedy/**'
      - 'packages/greedy/**'
      - 'apps/greedy/package.json'
      - 'scripts/package-greedy*'
      - 'scripts/greedy-third-party-notices.py'
      - 'test/greedy-distribution.test.mjs'
      - 'apps/bison/examples.json'
      - 'models/bison.manifest.json'
  workflow_dispatch:
    inputs:
      sign_release:
        description: Sign, notarize and attach verified packages to the selected tag's release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: greedy-native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WINDOWS_SIGNING_ENABLED: ${{ github.event_name != 'pull_request' && vars.WINDOWS_SIGNING_ENABLED || 'false' }}
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
  AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
  AZURE_ARTIFACT_SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
  # CI never uses the CUDA providers; parallel postinstalls of two versions race on one temp path.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  wasm-single:
    name: committed single-threaded WASM equals a rebuild from source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Install the pinned nightly toolchain and wasm-pack 0.13.1
        run: |
          rustup toolchain install nightly-2025-11-15 --profile minimal --target wasm32-unknown-unknown
          cargo install wasm-pack --version 0.13.1 --locked
      - name: Set up wasm-opt
        uses: ./.github/actions/setup-wasm-opt
      - name: Rebuild and compare
        env:
          GREEDY_WASM_SINGLE_REBUILD: ${{ runner.temp }}/wasm-single-rebuild
        run: node packages/greedy/scripts/build-wasm-single.mjs --check
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wasm-single-rebuild
          path: ${{ runner.temp }}/wasm-single-rebuild
          if-no-files-found: ignore

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/windows-signing
        if: runner.os == 'Windows'
        with:
          enabled: ${{ github.event_name != 'pull_request' && vars.WINDOWS_SIGNING_ENABLED || 'false' }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          account: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          profile: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - name: Check native workflows
        working-directory: exes/greedy
        run: |
          cargo test --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo fmt --all --check
      - name: Package and exercise extracted executable
        run: python scripts/package-greedy.py package ${{ matrix.platform }}
      - name: Test Apple ARM installer
        if: runner.os == 'macOS'
        run: make -C exes/greedy macos-pkg-adhoc
      - name: Check that each receipt records its archive's digest
        run: node scripts/check-native-receipts.mjs exes/greedy/dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: greedy-${{ matrix.platform }}
          path: exes/greedy/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: greedy-native-npm-${{ matrix.platform }}
          path: packages/greedy/native/
          if-no-files-found: error

  # The whole-head regression gates for issue #623 (cli/tests/workflows.rs, the
  # tests named *whole_head*) are #[ignore] so the matrix job's default run stays
  # data-free; this job fetches the pinned data and runs them by name, so a
  # missing download fails rather than skips.
  whole-head-reference:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      DATA: ${{ github.workspace }}/../greedy-t1-template
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Cache the reference downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/../greedy-t1-template/.download
          key: greedy-t1-template-${{ hashFiles('apps/bison/examples.json', 'models/bison.manifest.json', 'exes/greedy/scripts/fetch_t1_template.py') }}
      - name: Fetch the whole-head T1s and ICBM 2009c (sha256-checked)
        run: python3 exes/greedy/scripts/fetch_t1_template.py "$DATA"
      - name: Masked NMI affine on the whole-head T1s (identity and -ia starts)
        working-directory: exes/greedy
        run: GREEDY_T1_TEMPLATE_DIR="$DATA" cargo test --locked --release -p greedy-rs --test workflows whole_head -- --ignored --nocapture

  npm:
    needs: [native, macos-sign]
    if: ${{ always() && needs.native.result == 'success' && (needs.macos-sign.result == 'success' || needs.macos-sign.result == 'skipped') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: greedy-native-npm-*
          path: packages/greedy/native
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: needs.macos-sign.result == 'success'
        with:
          name: greedy-signed-npm-macos
          path: packages/greedy/native
      - name: Build complete npm package
        run: |
          chmod +x packages/greedy/native/linux-x64/greedy-rs packages/greedy/native/macos-arm64/greedy-rs
          pnpm --filter @neurodesk/greedy test
          node --test test/greedy-distribution.test.mjs
          mkdir -p exes/greedy/dist
          cd packages/greedy
          npm pack --pack-destination ../../exes/greedy/dist
          cd ../../exes/greedy/dist
          for archive in *.tgz; do sha256sum "$archive" > "$archive.sha256"; done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: greedy-npm-tarball
          path: exes/greedy/dist/*.tgz*
          if-no-files-found: error

  npm-test:
    needs: npm
    if: ${{ always() && needs.npm.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: greedy-npm-tarball
          path: release-bundle
      - name: Install offline and exercise npm command
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/greedy-install"
          npm install --offline --no-audit --no-fund --prefix "$RUNNER_TEMP/greedy-install" "$PWD"/release-bundle/*.tgz
          python scripts/package-greedy.py verify "$RUNNER_TEMP/greedy-install/node_modules/@neurodesk/greedy/bin/greedy.js" --node-cli > "$RUNNER_TEMP/greedy-npm-${{ runner.os }}.validation.txt"
          "$RUNNER_TEMP/greedy-install/node_modules/.bin/greedy-rs" --version
      - name: Verify installed Apple release signature
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.sign_release
        shell: bash
        run: |
          executable="$RUNNER_TEMP/greedy-install/node_modules/@neurodesk/greedy/native/macos-arm64/greedy-rs"
          codesign --verify --strict "$executable"
          codesign -dv --verbose=4 "$executable" 2>&1 | tee -a "$RUNNER_TEMP/greedy-npm-${{ runner.os }}.validation.txt" | grep '^Authority=Developer ID Application:'
      - name: Exercise installed command with networking disabled
        if: runner.os == 'Linux'
        shell: bash
        run: sudo unshare --net env PATH="$PATH" TMPDIR="$RUNNER_TEMP" "$(command -v python)" scripts/package-greedy.py verify "$RUNNER_TEMP/greedy-install/node_modules/@neurodesk/greedy/bin/greedy.js" --node-cli >> "$RUNNER_TEMP/greedy-npm-${{ runner.os }}.validation.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: greedy-npm-validation-${{ runner.os }}
          path: ${{ runner.temp }}/greedy-npm-*.validation.txt
          if-no-files-found: error

  macos-sign:
    if: github.event_name == 'workflow_dispatch' && inputs.sign_release
    needs: native
    permissions:
      contents: write
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Check release target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./apps/greedy/package.json').version")
          tag="greedy-v$version"
          gh release view "$tag" >/dev/null
          test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Sign and notarize Apple ARM installer
        env:
          APPLEID: ${{ secrets.APPLEID }}
          APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}
        run: exes/synthsr/scripts/ci_macos_release.sh exes/greedy
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: greedy-signed-macos
          path: exes/greedy/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: greedy-signed-npm-macos
          path: packages/greedy/native/
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.sign_release
    needs: [macos-sign, npm-test]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Check release target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./apps/greedy/package.json').version")
          tag="greedy-v$version"
          gh release view "$tag" >/dev/null
          test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=greedy@$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: greedy-*
          path: release-bundle
      - name: Attach verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          version=$(node -p "require('./apps/greedy/package.json').version")
          for target in linux-x64 windows-x64; do
            (cd "release-bundle/greedy-$target" && shasum -a 256 -c *.sha256)
          done
          (cd release-bundle/greedy-npm-tarball && shasum -a 256 -c *.sha256)
          (cd release-bundle/greedy-signed-macos && shasum -a 256 -c *.sha256)
          node scripts/check-native-receipts.mjs release-bundle/greedy-linux-x64 release-bundle/greedy-windows-x64 release-bundle/greedy-signed-macos
          gh release upload "$RELEASE_TAG" \
            release-bundle/greedy-linux-x64/* \
            release-bundle/greedy-windows-x64/* \
            release-bundle/greedy-npm-tarball/* \
            release-bundle/greedy-npm-validation-*/*.validation.txt \
            "release-bundle/greedy-signed-macos/greedy-$version-macos-arm64.pkg" \
            "release-bundle/greedy-signed-macos/greedy-$version-macos-arm64.pkg.sha256" \
            "release-bundle/greedy-signed-macos/greedy-$version-macos-arm64.pkg.validation.txt" --clobber
      - name: Publish to the Standalone catalog
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.target.outputs.release }}
        run: gh api "repos/$GITHUB_REPOSITORY/dispatches" -f event_type=standalone-catalog -f "client_payload[releases]=$RELEASE"
