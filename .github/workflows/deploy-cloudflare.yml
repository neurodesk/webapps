name: deploy-cloudflare-pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neurodesk-webapps-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-cloudflare-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-cloudflare-${{ runner.os }}-
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install pinned nightly toolchain
        run: rustup toolchain install nightly-2025-11-15 --component rust-src --target wasm32-unknown-unknown
      - name: Install wasm-pack 0.13.1
        run: cargo install wasm-pack --version 0.13.1 --locked
      - run: pnpm install --frozen-lockfile
      - name: Generate aggregate webapp analytics
        run: node scripts/write-analytics.mjs --allow-missing-credentials
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
      - run: pnpm build
      - run: pnpm audit:artifacts
      - name: Deploy composite site
        run: pnpm exec wrangler pages deploy dist --project-name=neurodesk-webapps --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
