name: ci-usage

# Reports what the last day of workflow runs cost and fails when a budget in
# scripts/lib/ci-usage.mjs is exceeded; nightly-failures.yml then opens an issue.
on:
  schedule:
    - cron: '41 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-usage
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
      - run: node scripts/ci-usage-report.mjs
        env:
          GH_TOKEN: ${{ github.token }}
