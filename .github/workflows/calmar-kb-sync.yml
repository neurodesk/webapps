name: CALMaR knowledge-base sync

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calmar-kb-sync
  cancel-in-progress: false

env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  sync:
    # This automation belongs to the fork that owns the KB.
    if: github.repository == 'micmas/webapps'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check the latest KB revision
        id: source
        run: |
          sha=$(git ls-remote https://github.com/micmas/stroke-aphasia-kb.git refs/heads/main | cut -f1)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          SOURCE_SHA="$sha" node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('apps/calmar/web/models/manifest.json', 'utf8'));
          const changed = ['aphasia-kb', 'aphasia-kb-drafts'].some(id =>
            manifest.annotationAssets.find(asset => asset.id === id)?.kbSourceCommit !== process.env.SOURCE_SHA);
          appendFileSync(process.env.GITHUB_OUTPUT, `changed=${changed}\n`);
          JS
      - uses: pnpm/action-setup@v6
        if: steps.source.outputs.changed == 'true'
      - uses: actions/setup-python@v7
        if: steps.source.outputs.changed == 'true'
        with:
          python-version: '3.12'
      - name: Import both evidence levels from the recorded revision
        if: steps.source.outputs.changed == 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          python -m pip install pandas==3.0.6 PyYAML==6.0.3
          git clone https://github.com/micmas/stroke-aphasia-kb.git "$RUNNER_TEMP/stroke-aphasia-kb"
          git -C "$RUNNER_TEMP/stroke-aphasia-kb" checkout --detach "$SOURCE_SHA"
          python apps/calmar/scripts/sync_kb.py --kb "$RUNNER_TEMP/stroke-aphasia-kb" --both
      - name: Validate the exported evidence and Python/JavaScript parity
        if: steps.source.outputs.changed == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter calmar vendor
          pnpm --filter calmar runtime-support
          pnpm --filter calmar test:manifest-checksums
          pnpm --filter calmar test:kb-report
          node --test packages/calmar/test/kb-evidence.test.js
      - name: Version only this KB update
        if: steps.source.outputs.changed == 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          # Preserve unrelated pending changesets for their normal release.
          archive="$RUNNER_TEMP/calmar-pending-changesets"
          mkdir -p "$archive"
          shopt -s nullglob
          for file in .changeset/*.md; do
            [[ "$(basename "$file")" == README.md ]] || mv "$file" "$archive/"
          done
          trap 'for file in "$archive"/*.md; do mv "$file" .changeset/; done' EXIT
          printf -- '---\n"calmar": patch\n---\n\nRefresh approved and draft KB snapshots from micmas/stroke-aphasia-kb@%s.\n' "$SOURCE_SHA" > .changeset/calmar-kb-refresh.md
          pnpm release --same-day
          node --test test/app-versions.test.mjs
      - name: Commit the tested snapshot to main
        if: steps.source.outputs.changed == 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/calmar/web/models/annotations/aphasia-kb.json apps/calmar/web/models/annotations/aphasia-kb-drafts.json
          git add apps/calmar/tests/fixtures/kb-parity apps/calmar/web/models/manifest.json packages/calmar/model.manifest.json
          git add apps/calmar/package.json apps/calmar/CHANGELOG.md apps/calmar/web/js/app/config.js packages/calmar/package.json packages/calmar/CHANGELOG.md pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(calmar): refresh KB from ${SOURCE_SHA:0:7}"
          git push origin HEAD:main
