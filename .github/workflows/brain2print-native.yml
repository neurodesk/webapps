name: brain2print-native

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'packages/components/package.json'
      - '.github/workflows/brain2print-native.yml'
      - 'packages/brain2print/**'
      - 'apps/brain2print/**'
      - 'packages/node-drivers/package.json'
      - 'packages/node-drivers/src/mindgrab-worker.js'
      - 'packages/node-drivers/src/mindgrab.js'
      - 'packages/node-drivers/src/niimath.js'
      - 'packages/runtime-support/src/mindgrab/**'
      - 'packages/components/src/file-io/**'
      - 'exes/synthseg/test/fixtures/small.nii.gz'
      - 'apps/calmar/tests/fixtures/synthstrip-mini/T1.nii.gz'
      - 'packages/components/src/automation/parameters.js'
  push:
    branches: [main]
    paths:
      - 'packages/components/package.json'
      - '.github/workflows/brain2print-native.yml'
      - '.github/workflows/node-cli-portable.yml'
      - 'exes/node-cli/**'
      - 'packages/brain2print/**'
      - 'apps/brain2print/**'
      - 'packages/node-drivers/package.json'
      - 'packages/node-drivers/src/mindgrab-worker.js'
      - 'packages/node-drivers/src/mindgrab.js'
      - 'packages/node-drivers/src/niimath.js'
      - 'packages/runtime-support/src/mindgrab/**'
      - 'packages/components/src/file-io/**'
      - 'exes/synthseg/test/fixtures/small.nii.gz'
      - 'apps/calmar/tests/fixtures/synthstrip-mini/T1.nii.gz'
      - 'packages/components/src/automation/parameters.js'
  workflow_dispatch:
    inputs:
      sign_release:
        description: Sign and notarize the macOS installer, then attach every verified package to the existing Brain2Print release
        type: boolean
        default: false

concurrency:
  group: brain2print-native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  browser-reference:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: browser reference still holds
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - name: Install browser
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Rerun the web pipeline on MindGrab's browser CPU backend
        run: node packages/brain2print/validation/browser-reference.mjs --check

  portable:
    needs: browser-reference
    uses: ./.github/workflows/node-cli-portable.yml
    permissions:
      contents: write
      id-token: write
    with:
      package: packages/brain2print
      targets: >-
        [{"os": "ubuntu-22.04", "platform": "linux-x64"},
         {"os": "windows-latest", "platform": "windows-x64"},
         {"os": "macos-15", "platform": "macos-arm64"}]
      publish_release: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release }}
      sign_release: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release }}
    secrets:
      APPLEID: ${{ secrets.APPLEID }}
      APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
      CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}
