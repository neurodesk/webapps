name: native

# Written by scripts/native-workflow.mjs from every workflow whose gate job
# lists shared_paths. Edit those workflows, then run `node scripts/native-workflow.mjs`.
#
# A pull request that changes a shared path starts this one workflow, not
# every workflow that builds on the path. Its gate decides for all of them
# (pr-gate.yml with `workflow: native`, scripts/lib/workflow-gate.mjs) and
# it calls the ones the change reaches, on the pull request's own event and
# commit. A workflow GitHub certainly started itself for its own paths is
# left out here. A call runs unless the gate proves it need not (callCondition
# in scripts/lib/native-workflow.mjs). The nightly schedule is the sweep of
# every called workflow that a push to main also starts.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - '.github/workflows/native.yml'
      - '.github/workflows/pr-gate.yml'
      - 'scripts/workflow-gate.mjs'
      - 'scripts/lib/workflow-gate.mjs'
      - 'package.json'
      - 'packages/components/**'
      - 'packages/components/package.json'
      - 'packages/components/src/automation/**'
      - 'packages/components/src/file-io/**'
      - 'packages/components/src/volume/**'
      - 'packages/components/src/worker/**'
      - 'packages/runtime-support/**'
      - 'packages/runtime-support/package.json'
      - 'packages/runtime-support/src/mindgrab/**'
      - 'packages/runtime-support/src/niimath/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  schedule:
    - cron: '5 13 * * *'

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which workflows run (scripts/lib/native-decision.mjs). Whatever
  # goes wrong in it runs them: each call skips only on its proof.
  gate:
    uses: ./.github/workflows/pr-gate.yml
    permissions:
      contents: read
      actions: read
      pull-requests: read
    with:
      workflow: native

  # Fails where ci withholds the full plan too: every call was skipped.
  full-plan-withheld:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.withheld == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail the withheld run
        run: |
          echo "::error title=Full plan withheld::This ready pull request already used its full-plan ci runs, so native.yml ran none of the workflows it calls. Add the full-ci label, then re-run all jobs of ci and of native."
          exit 1

  ants-native:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.withheld != 'true' && !(needs.gate.result == 'success' && startsWith(needs.gate.outputs.workflows, '[') && endsWith(needs.gate.outputs.workflows, ']') && !contains(needs.gate.outputs.workflows, '"ants-native"')) }}
    uses: ./.github/workflows/ants-native.yml
    permissions:
      actions: read
      contents: write
      id-token: write
      pull-requests: read
    secrets: inherit

  bison-native:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.withheld != 'true' && !(needs.gate.result == 'success' && startsWith(needs.gate.outputs.workflows, '[') && endsWith(needs.gate.outputs.workflows, ']') && !contains(needs.gate.outputs.workflows, '"bison-native"')) }}
