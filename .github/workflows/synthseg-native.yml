name: synthseg-native

on:
  pull_request:
    paths:
      - '.github/workflows/synthseg-native.yml'
      - 'exes/synthseg/**'
      - 'exes/nifti/**'
      - 'test-utils/native-nifti/**'
      - 'packages/synthseg/**'
      - 'exes/synthsr/scripts/ci_macos_release.sh'
  workflow_dispatch:
    inputs:
      sign_release:
        description: Sign and notarize the macOS installer for an existing prerelease
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: synthseg-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      SYNTHSEG_REAL_DEVICES: cpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - name: Check formatting, lint and small CPU/Metal fixture parity
        run: |
          rm -f exes/synthseg/validation/report.json
          make -C exes/synthseg fmt lint test
      - name: Check full-volume CPU parity on the 7 GB hosted runner
        run: make -C exes/synthseg test-real
      - name: Verify the local installer
        run: make -C exes/synthseg macos-pkg-adhoc
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: synthseg-native-validation
          path: |
            exes/synthseg/validation/report.json
            exes/synthseg/dist/*-adhoc.pkg
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.sign_release
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      SYNTHSEG_REAL_DEVICES: cpu
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Check release target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' exes/synthseg/Cargo.toml)
          tag="synthseg-v$version"
          test "$(gh release view "$tag" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = true
          test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Sign and notarize installer
        env:
          APPLEID: ${{ secrets.APPLEID }}
          APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}
        run: exes/synthsr/scripts/ci_macos_release.sh exes/synthseg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: synthseg-native-release
          path: |
            exes/synthseg/dist/*.pkg
            exes/synthseg/dist/*.sha256
            exes/synthseg/dist/*.validation.txt
      - name: Attach verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" exes/synthseg/dist/*.pkg exes/synthseg/dist/*.sha256 exes/synthseg/dist/*.validation.txt --clobber
