name: dwidenoise-native

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - '.github/workflows/dwidenoise-native.yml'
      - 'packages/dwidenoise/**'
      - 'packages/components/package.json'
      - 'packages/components/src/file-io/**'
      - 'apps/dwidenoise/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/dwidenoise-native.yml'
      - '.github/workflows/node-cli-portable.yml'
      - 'exes/node-cli/**'
      - 'packages/dwidenoise/**'
      - 'apps/dwidenoise/**'
  # Shared trees start this workflow nightly, not on every push: the sweep in pr-gate.yml
  # runs it when one changed on main during the last day.
  schedule:
    - cron: '49 13 * * *'
  workflow_dispatch:
    inputs:
      sign_release:
        description: Sign and notarize the macOS installer, then attach every verified package to the existing dwidenoise release
        type: boolean
        default: false

concurrency:
  group: dwidenoise-native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Defers drafts, and skips a ready pull request whose changes match only shared path filters
  # and do not reach this workflow (scripts/lib/workflow-gate.mjs).
  gate:
    uses: ./.github/workflows/pr-gate.yml
    with:
      workflow: dwidenoise-native

  # Runs the web app's pinned example through the built web app and compares each download with
  # packages/dwidenoise/validation/browser-reference.json, the reference the archives are held to.
  web-app-reference:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: pnpm
      - name: Install frozen dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: pnpm install --frozen-lockfile
      - name: Install browser
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Command-line tests
        run: pnpm --filter @neurodesk/dwidenoise test
      - name: Run the web app on the pinned example
        env:
          DWIDENOISE_BROWSER_REFERENCE: check
        run: pnpm --filter dwidenoise exec playwright test e2e/reference.spec.js --reporter=line

  # Archives are built, and published, only once the web app still matches the reference they
  # are held to.
  portable:
    needs: [web-app-reference]
    uses: ./.github/workflows/node-cli-portable.yml
    permissions:
      contents: write
      id-token: write
    with:
      package: packages/dwidenoise
      targets: >-
        [{"os": "ubuntu-22.04", "platform": "linux-x64"},
         {"os": "windows-latest", "platform": "windows-x64"},
         {"os": "macos-15", "platform": "macos-arm64"}]
      publish_release: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release }}
      sign_release: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release }}
    secrets:
      APPLEID: ${{ secrets.APPLEID }}
      APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
      CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}
