name: synthseg-portable

# The portable Node command line for Linux and Windows. macOS ships the native Metal installer from
# synthseg-native.yml; scripts/lib/native-releases.mjs gives each workflow its own platforms.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - '.github/workflows/synthseg-portable.yml'
      - 'packages/synthseg/**'
      - 'apps/synthseg/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/synthseg-portable.yml'
      - '.github/workflows/node-cli-portable.yml'
      - 'exes/node-cli/**'
      - 'packages/synthseg/**'
      - 'apps/synthseg/**'
  # A pull request that changes only paths in the gate's shared_paths starts native.yml instead,
  # which calls this workflow when the change reaches it; its nightly run is this workflow's sweep.
  workflow_call:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Attach every verified archive to the existing SynthSeg release
        type: boolean
        default: false

concurrency:
  group: synthseg-portable-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Defers drafts, and decides a ready pull request or a push from this workflow's own paths and
  # its shared_paths (scripts/lib/workflow-gate.mjs). Called from native.yml, which decided first,
  # it answers true.
  gate:
    if: (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft'))
    uses: ./.github/workflows/pr-gate.yml
    permissions:
      contents: read
      actions: read
      pull-requests: read
    with:
      workflow: synthseg-portable
      shared_paths: |
        packages/components/package.json
        packages/components/src/automation/**
        packages/components/src/file-io/**

  portable:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/node-cli-portable.yml
    permissions:
      contents: write
      id-token: write
    with:
      package: packages/synthseg
      targets: >-
        [{"os": "ubuntu-22.04", "platform": "linux-x64"},
         {"os": "windows-latest", "platform": "windows-x64"}]
      publish_release: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
