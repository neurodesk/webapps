name: synthseg-portable

# The portable Node command line for Linux and Windows. macOS ships the native Metal installer from
# synthseg-native.yml; scripts/lib/native-releases.mjs gives each workflow its own platforms.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'packages/components/package.json'
      - '.github/workflows/synthseg-portable.yml'
      - 'packages/synthseg/**'
      - 'apps/synthseg/**'
      - 'packages/components/src/automation/**'
      - 'packages/components/src/file-io/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/synthseg-portable.yml'
      - '.github/workflows/node-cli-portable.yml'
      - 'exes/node-cli/**'
      - 'packages/synthseg/**'
      - 'apps/synthseg/**'
  # Shared trees start this workflow nightly, not on every push: the sweep in pr-gate.yml
  # runs it when one changed on main during the last day.
  schedule:
    - cron: '49 14 * * *'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Attach every verified archive to the existing SynthSeg release
        type: boolean
        default: false

concurrency:
  group: synthseg-portable-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Defers drafts, and skips a ready pull request whose changes match only shared path filters
  # and do not reach this workflow (scripts/lib/workflow-gate.mjs).
  gate:
    uses: ./.github/workflows/pr-gate.yml
    with:
      workflow: synthseg-portable

  portable:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/node-cli-portable.yml
    permissions:
      contents: write
      id-token: write
    with:
      package: packages/synthseg
      targets: >-
        [{"os": "ubuntu-22.04", "platform": "linux-x64"},
         {"os": "windows-latest", "platform": "windows-x64"}]
      publish_release: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
