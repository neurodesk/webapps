name: nesvor-real-validation

on:
  workflow_dispatch:
    inputs:
      thicknesses_mm:
        description: Confirmed physical slice thickness in mm (one value or six comma-separated values)
        required: true
        type: string

permissions:
  contents: read

env:
  # CI never uses the CUDA providers; parallel postinstalls of two versions race on one temp path.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  scientific-example:
    # This explicit runner label is a requirement, not a simulator fallback.
    runs-on: [self-hosted, linux, x64, nvidia]
    environment: nesvor-validation
    timeout-minutes: 250
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reconstruct pinned six-stack example with real NeSVoR
        env:
          NESVOR_BACKEND_URL: ${{ secrets.NESVOR_BACKEND_URL }}
          NESVOR_PAIRING_CODE: ${{ secrets.NESVOR_PAIRING_CODE }}
          NESVOR_EXAMPLE_THICKNESSES_MM: ${{ inputs.thicknesses_mm }}
          NESVOR_REPORT_DIR: ${{ runner.temp }}/nesvor-scientific-${{ github.run_id }}-${{ github.run_attempt }}
          TMPDIR: ${{ runner.temp }}
        run: node scripts/verify-nesvor-real.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: nesvor-scientific-validation
          path: ${{ runner.temp }}/nesvor-scientific-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
