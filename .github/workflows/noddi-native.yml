name: noddi-native
on:
  workflow_dispatch:
    inputs:
      sign_release:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  inputs:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compare exact input bytes
        run: |
          node --input-type=module <<'JS'
          import {caseInputs, inputChecksums, compareInputChecksums, readReference} from './packages/noddi/validation/reference.mjs';
          import {mkdir, copyFile, writeFile} from 'node:fs/promises';
          import {join} from 'node:path';
          const inputs = await caseInputs();
          const actual = inputChecksums(inputs);
          const expected = (await readReference()).inputs;
          const checks = compareInputChecksums(actual, expected);
          for (const [passed, line] of checks) console.log(`${passed ? 'PASS' : 'FAIL'} ${line}`);
          const directory = join(process.env.RUNNER_TEMP, 'noddi-input-diagnostic');
          await mkdir(directory, {recursive:true});
          await writeFile(join(directory, 'checks.json'), JSON.stringify({actual,expected,checks},null,2));
          for (const file of Object.values(inputs.phantom.files)) await copyFile(file.path, join(directory,file.name));
          process.exitCode = checks.every(([passed])=>passed) ? 0 : 1;
          JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: noddi-input-diagnostic
          path: ${{ runner.temp }}/noddi-input-diagnostic
