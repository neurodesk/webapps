name: seedseg-native

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'packages/components/package.json'
      - '.github/workflows/seedseg-native.yml'
      - 'packages/seedseg/**'
      - 'packages/components/src/file-io/**'
      - 'packages/components/src/volume/**'
      - 'apps/seedseg/**'
      - 'models/seedseg.manifest.json'
      - 'runtime-assets/manifest.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/seedseg-native.yml'
      - '.github/workflows/node-cli-portable.yml'
      - 'exes/node-cli/**'
      - 'packages/seedseg/**'
      - 'apps/seedseg/**'
      - 'models/seedseg.manifest.json'
      - 'runtime-assets/manifest.json'
  # Shared trees start this workflow nightly, not on every push: the sweep in pr-gate.yml
  # runs it when one changed on main since this workflow last finished green there.
  schedule:
    - cron: '41 14 * * *'
  workflow_dispatch:
    inputs:
      sign_release:
        description: Sign and notarize the macOS installer, then attach every verified package to the existing SeedSeg release
        type: boolean
        default: false

concurrency:
  group: seedseg-native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Defers drafts, and skips a ready pull request whose changes match only shared path filters
  # and do not reach this workflow (scripts/lib/workflow-gate.mjs).
  gate:
    uses: ./.github/workflows/pr-gate.yml
    permissions:
      contents: read
      actions: read
    with:
      workflow: seedseg-native

  portable:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/node-cli-portable.yml
    permissions:
      contents: write
      id-token: write
    with:
      package: packages/seedseg
      validation_app: seedseg
      targets: >-
        [{"os": "ubuntu-22.04", "platform": "linux-x64"},
         {"os": "windows-latest", "platform": "windows-x64"},
         {"os": "macos-15", "platform": "macos-arm64"}]
      publish_release: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release }}
      sign_release: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release }}
    secrets:
      APPLEID: ${{ secrets.APPLEID }}
      APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
      CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}
