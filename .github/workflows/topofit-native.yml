name: topofit-native

on:
  pull_request:
    paths:
      - '.github/workflows/topofit-native.yml'
      - '.github/workflows/node-cli-portable.yml'
      - 'exes/node-cli/**'
      - 'packages/topofit/**'
      - 'apps/topofit/**'
      - 'test/independent-workflows.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/topofit-native.yml'
      - '.github/workflows/node-cli-portable.yml'
      - 'exes/node-cli/**'
      - 'packages/topofit/**'
      - 'apps/topofit/**'
      - 'test/independent-workflows.test.mjs'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Attach every verified portable package to the existing TopoFit release
        type: boolean
        default: false

concurrency:
  group: topofit-native-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  portable:
    uses: ./.github/workflows/node-cli-portable.yml
    permissions:
      contents: write
    with:
      package: packages/topofit
      targets: >-
        [{"os": "ubuntu-22.04", "platform": "linux-x64"},
         {"os": "windows-latest", "platform": "windows-x64"},
         {"os": "macos-14", "platform": "macos-arm64"}]
      publish_release: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
