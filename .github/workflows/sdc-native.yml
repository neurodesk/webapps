name: sdc-native

on:
  pull_request:
    paths:
      - '.github/workflows/sdc-native.yml'
      - '.github/actions/setup-wasm-opt/**'
      - 'exes/sdc/**'
      - 'exes/nifti/**'
      - 'packages/sdc/**'
      - 'packages/ants-denoise/package.json'
      - 'packages/ants-denoise/src/**'
      - 'packages/ants-denoise/wasm/**'
      - 'packages/components/package.json'
      - 'packages/components/src/file-io/**'
      - 'packages/components/src/volume/**'
      - 'packages/dwi2trx/package.json'
      - 'packages/dwi2trx/src/gradients.js'
      - 'packages/hmc-registration/package.json'
      - 'packages/hmc-registration/src/**'
      - 'packages/hmc-registration/wasm/**'
      - 'packages/hmc/package.json'
      - 'packages/hmc/src/**'
      - 'packages/n4/package.json'
      - 'packages/n4/src/**'
      - 'packages/n4/wasm/**'
      - 'packages/node-drivers/package.json'
      - 'packages/node-drivers/src/**'
      - 'packages/runtime-support/package.json'
      - 'packages/runtime-support/src/mindgrab/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sdc-native.yml'
      - '.github/workflows/node-cli-portable.yml'
      - 'exes/node-cli/**'
      - '.github/actions/setup-wasm-opt/**'
      - 'exes/sdc/**'
      - 'exes/nifti/**'
      - 'packages/sdc/**'
      - 'packages/ants-denoise/package.json'
      - 'packages/ants-denoise/src/**'
      - 'packages/ants-denoise/wasm/**'
      - 'packages/components/package.json'
      - 'packages/components/src/file-io/**'
      - 'packages/components/src/volume/**'
      - 'packages/dwi2trx/package.json'
      - 'packages/dwi2trx/src/gradients.js'
      - 'packages/hmc-registration/package.json'
      - 'packages/hmc-registration/src/**'
      - 'packages/hmc-registration/wasm/**'
      - 'packages/hmc/package.json'
      - 'packages/hmc/src/**'
      - 'packages/n4/package.json'
      - 'packages/n4/src/**'
      - 'packages/n4/wasm/**'
      - 'packages/node-drivers/package.json'
      - 'packages/node-drivers/src/**'
      - 'packages/runtime-support/package.json'
      - 'packages/runtime-support/src/mindgrab/**'
  workflow_dispatch:
    inputs:
      sign_release:
        description: Sign and notarize the macOS installer, then attach every verified package to the existing sdc release
        type: boolean
        default: false

concurrency:
  group: sdc-native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    name: exes/sdc tests, clippy and format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
      - name: Test
        working-directory: exes/sdc
        run: cargo +1.98.0 test --workspace --locked --release
      - name: Clippy
        working-directory: exes/sdc
        run: cargo +1.98.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Format
        working-directory: exes/sdc
        run: cargo +1.98.0 fmt --all --check

  wasm-source:
    name: committed WASM module equals a rebuild from source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --target wasm32-unknown-unknown
      - name: Set up wasm-opt
        uses: ./.github/actions/setup-wasm-opt
      - name: Rebuild and compare sdc
        run: bash packages/sdc/scripts/build-wasm.sh --check
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      # src/webgpu.js imports @neurodesk/runtime-support, a workspace dependency.
      - name: Install frozen dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: pnpm install --frozen-lockfile
      - name: sdc package tests on the committed module
        working-directory: packages/sdc
        run: node --test test/*.test.js

  # Runs the SyN-SDC pipeline on the web app's browser runtimes in Chromium and compares every output
  # with packages/sdc/validation/browser-reference.json, the reference the archives are held to.
  browser-reference:
    name: browser reference still holds
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: pnpm
      - name: Install frozen dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: pnpm install --frozen-lockfile
      - name: Install browser
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Rerun the SyN-SDC pipeline on the browser runtimes
        run: node packages/sdc/validation/browser-reference.mjs --check

  # Archives are built, and published, only once the browser still matches the reference they are
  # held to.
  portable:
    needs: browser-reference
    uses: ./.github/workflows/node-cli-portable.yml
    permissions:
      contents: write
      id-token: write
    with:
      package: packages/sdc
      targets: >-
        [{"os": "ubuntu-22.04", "platform": "linux-x64"},
         {"os": "windows-latest", "platform": "windows-x64"},
         {"os": "macos-15", "platform": "macos-arm64"}]
      publish_release: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release }}
      sign_release: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release }}
    secrets:
      APPLEID: ${{ secrets.APPLEID }}
      APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
      CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}
