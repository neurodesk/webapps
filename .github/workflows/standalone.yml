name: standalone

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: standalone-publish-pr44
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Require successful validation at the exact source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/neurodesk/webapps/actions/runs/35179487015 --jq '.head_sha + " " + .conclusion')" = "0ad936c0f7967260198339b56790ba139a004f46 success"

  macos:
    needs: validate
    runs-on: macos-15
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        models: [included, without]
    env:
      NEURODESK_MODELS: ${{ matrix.models }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0ad936c0f7967260198339b56790ba139a004f46
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node packages/desktop/node_modules/electron/install.js
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: 35179487015
          name: offline-resources
      - run: tar -xzf offline-resources.tar.gz -C packages/desktop
      - name: Prepare the package without models
        if: matrix.models == 'without'
        shell: bash
        run: |
          node scripts/desktop/without-models.mjs
          echo "NEURODESK_BUNDLE=$GITHUB_WORKSPACE/packages/desktop/resources-light" >> "$GITHUB_ENV"
      - name: Sign, notarize and test every installed application
        run: node scripts/desktop/pack.mjs
        env:
          NEURODESK_TEST_REPORT: packaged-desktop-reports
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLEID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLEIDPASS }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: desktop-macos-15-${{ matrix.models }}
          path: |
            packaged-desktop-reports/
            packages/desktop/release/github/
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: [validate, macos]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFIED_SHA: 0ad936c0f7967260198339b56790ba139a004f46
    steps:
      - name: Free runner storage for both verified suite editions
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0ad936c0f7967260198339b56790ba139a004f46
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: 35179487015
          pattern: desktop-ubuntu-*
          path: release-artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: 35179487015
          pattern: desktop-windows-*
          path: release-artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: desktop-macos-*
          path: release-artifacts
      - name: Validate every report and checksum, then publish the verified suite
        run: GITHUB_SHA="$VERIFIED_SHA" node scripts/desktop/publish.mjs release-artifacts
