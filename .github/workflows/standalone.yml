name: standalone
on:
  schedule:
    - cron: 23 3 * * *
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the desktop release when every job passes
        type: boolean
        default: false
      source_approval_only:
        description: Run only the native Windows source approval tests
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: standalone-driver-validation-${{ github.ref }}
  cancel-in-progress: false
env:
  WINDOWS_SIGNING_ENABLED: ${{ github.event_name != 'pull_request' && vars.WINDOWS_SIGNING_ENABLED || 'false' }}
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
  AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
  AZURE_ARTIFACT_SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
  ONNXRUNTIME_NODE_INSTALL: skip
jobs:
  source-approval:
    if: github.event_name == 'workflow_dispatch' && inputs.source_approval_only
    uses: ./.github/workflows/desktop-source-approval.yml
  bundle:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      release_date: ${{ steps.source.outputs.release_date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Verify unchanged application source and completed bundle
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          test "$(git rev-parse HEAD^)" = 'e0655cdabaa88886bb9fcea9909b5e8c41979432'
          git fetch --no-tags --depth=1 origin '4a0f7a5e369a726bba711b15b9a1b3095d8d0858'
          python3 - <<'PY'
          import subprocess
          allowed = set([".changeset/me-ica-offline-workflow.md",".gitattributes",".github/workflows/ci.yml","packages/noddi/test/reference.test.js","packages/noddi/validation/phantom.bvec","packages/noddi/validation/reference.mjs","scripts/audit-interfaces.mjs","scripts/desktop/page-diagnostics.mjs","scripts/desktop/smoke.mjs","scripts/desktop/workflows.mjs","scripts/lib/example-asset-cache.mjs","test-utils/serve-site.mjs","test/agentic-interactions-workflow.test.mjs","test/desktop-page-diagnostics.test.mjs","test/example-asset-cache.test.mjs",".github/workflows/standalone.yml"])
          changed = set(subprocess.check_output(['git','diff','--name-only','4a0f7a5e369a726bba711b15b9a1b3095d8d0858','HEAD'], text=True).splitlines())
          assert changed <= allowed, f'Unexpected bundle-source changes: {sorted(changed - allowed)}'
          print('Verified validation-only source delta:', ', '.join(sorted(changed)))
          PY
          test "$(gh api repos/neurodesk/webapps/actions/runs/40171653097 --jq .head_sha)" = '4a0f7a5e369a726bba711b15b9a1b3095d8d0858'
          test "$(gh api repos/neurodesk/webapps/actions/runs/40171653097/jobs --jq '[.jobs[] | select(.name == "bundle")][0].conclusion')" = success
          echo "release_date=20261025" >> "$GITHUB_OUTPUT"
          echo 'Reusing verified offline resources and model pack from run 40171653097, source 4a0f7a5e369a726bba711b15b9a1b3095d8d0858.'
  desktop:
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macos-15
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - name: Free Linux runner storage for the suite archives
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/windows-signing
        if: runner.os == 'Windows'
        with:
          enabled: ${{ github.event_name != 'pull_request' && vars.WINDOWS_SIGNING_ENABLED || 'false' }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          account: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          profile: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set the daily desktop version
        run: node scripts/desktop/daily-version.mjs
        env:
          DESKTOP_RELEASE_DATE: ${{ needs.bundle.outputs.release_date }}
      - run: node packages/desktop/node_modules/electron/install.js
      - name: Test native source approval paths
        run: node --test packages/desktop/test/source-approval.test.js
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: offline-resources
          run-id: 40171653097
          github-token: ${{ github.token }}
      - run: tar -xzf offline-resources.tar.gz -C packages/desktop
      - name: Prepare the package without models
        shell: bash
        run: |
          node scripts/desktop/without-models.mjs
          echo "NEURODESK_BUNDLE=$GITHUB_WORKSPACE/packages/desktop/resources-light" >> "$GITHUB_ENV"
      - name: Exercise every app with fresh profiles and network denied
        if: runner.os != 'Linux'
        run: node scripts/desktop/smoke.mjs
        env:
          NEURODESK_TEST_REPORT: desktop-reports
      - name: Exercise Linux desktop under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/desktop/smoke.mjs
        env:
          NEURODESK_TEST_REPORT: desktop-reports
          NEURODESK_SOFTWARE_RENDERING: "1"
      - name: Select workflow coverage from the complete app registry
        shell: bash
        run: echo "NEURODESK_TEST_APP=$(node scripts/desktop/ci-apps.mjs)" >> "$GITHUB_ENV"
      - name: Test offline computations and exports
        if: runner.os != 'Linux'
        run: node scripts/desktop/smoke.mjs
        env:
          NEURODESK_TEST_REPORT: desktop-workflow-reports
          NEURODESK_WORKFLOWS: "1"
      - name: Test Linux offline computations and exports
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/desktop/smoke.mjs
        env:
          NEURODESK_TEST_REPORT: desktop-workflow-reports
          NEURODESK_WORKFLOWS: "1"
          NEURODESK_SOFTWARE_RENDERING: "1"
      - name: Restore full catalog coverage for installed-package tests
        shell: bash
        run: echo "NEURODESK_TEST_APP=" >> "$GITHUB_ENV"
      - name: Package and test the installed suite
        if: runner.os != 'Linux'
        run: node scripts/desktop/pack.mjs
        env:
          NEURODESK_TEST_REPORT: packaged-desktop-reports
          CSC_LINK: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && secrets.APPLEID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && secrets.APPLEIDPASS || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && secrets.APPLE_TEAM_ID || '' }}
      - name: Package and test the Linux suite
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/desktop/pack.mjs
        env:
          NEURODESK_TEST_REPORT: packaged-desktop-reports
          NEURODESK_SOFTWARE_RENDERING: "1"
      - name: Install pinned Apptainer
        if: runner.os == 'Linux'
        run: |
          curl -fL https://github.com/apptainer/apptainer/releases/download/v1.5.3/apptainer_1.5.3_amd64.deb -o "$RUNNER_TEMP/apptainer.deb"
          echo "82b0bdddf459087d202383360b8318d526ad6826c748a2f669913cc6aef9ee40  $RUNNER_TEMP/apptainer.deb" | sha256sum -c -
          sudo apt-get install -y "$RUNNER_TEMP/apptainer.deb"
      - name: Build and test offline Docker and Apptainer distributions
        if: runner.os == 'Linux'
        run: node scripts/desktop/container.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop-reports/
            desktop-workflow-reports/
            packaged-desktop-reports/
            container-reports/
            packages/desktop/release/github/
          compression-level: 0
          if-no-files-found: error
  models-offline:
    needs: bundle
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - name: Free Linux runner storage for the suite archives
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set the daily desktop version
        run: node scripts/desktop/daily-version.mjs
        env:
          DESKTOP_RELEASE_DATE: ${{ needs.bundle.outputs.release_date }}
      - run: node packages/desktop/node_modules/electron/install.js
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: offline-resources
          run-id: 40171653097
          github-token: ${{ github.token }}
      - run: tar -xzf offline-resources.tar.gz -C packages/desktop
      - run: node scripts/desktop/without-models.mjs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: desktop-models-pack
          path: models-release
          run-id: 40171653097
          github-token: ${{ github.token }}
      - name: Install the model pack the way the release notes describe
        run: |
          mkdir models-pack
          cat $(ls models-release | grep -E 'models\.tar\.gz(\.part[0-9]+)?$' | sort | sed 's|^|models-release/|') > models.tar.gz
          tar -xzf models.tar.gz -C models-pack
          rm models.tar.gz
      - name: Select workflow coverage from the complete app registry
        run: echo "NEURODESK_TEST_APP=$(node scripts/desktop/ci-apps.mjs)" >> "$GITHUB_ENV"
      - name: Test offline computations and exports against the extracted model pack
        run: xvfb-run -a node scripts/desktop/smoke.mjs
        env:
          NEURODESK_BUNDLE: ${{ github.workspace }}/packages/desktop/resources-light
          NEURODESK_MODELS_DIR: ${{ github.workspace }}/models-pack
          NEURODESK_TEST_REPORT: reports/desktop-workflow-reports
          NEURODESK_WORKFLOWS: "1"
          NEURODESK_SOFTWARE_RENDERING: "1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: desktop-models-offline
          path: reports/
          compression-level: 0
          if-no-files-found: error
