name: scheduled workflow failure reports

on:
  workflow_run:
    workflows:
      - ants-native
      - bison-native
      - brain2print-native
      - browserqc-native
      - CALMaR knowledge-base sync
      - calmar-native
      - carotid-flow-native
      - ci
      - ci-usage
      - CI approval report
      - compute-server-native
      - deface-native
      - degibbs-native
      - deploy-github-pages
      - dwi-native
      - dwi2trx-native
      - dwidenoise-native
      - easy-mp2rage-native
      - edgereg-native
      - elastix-native
      - hmc-native
      - hmc-registration
      - lcmodel-native
      - musclemap-native
      - musclemap-parity
      - mutation-quality
      - n4-native
      - n4-wasm-source
      - neuroflow
      - noddi-native
      - node-drivers
      - sct-full-tests
      - sdc-native
      - sdc-registration-gate
      - seedseg-native
      - spinalcordtoolbox-native
      - standalone
      - standalone-catalog
      - standalone-links
      - synthseg-portable
      - upstream sync
      - vesselboost-native
      - white-matter-lesions-native
    # Pull request runs never need a report, and without this each one starts a run here.
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

# Serialize scheduled reports; skipped events must not replace a pending report.
concurrency:
  group: nightly-failure-report-${{ github.event.workflow_run.workflow_id }}-${{ github.event.workflow_run.event == 'schedule' && 'schedule' || github.run_id }}
  cancel-in-progress: false

jobs:
  report:
    if: github.event.workflow_run.event == 'schedule' && github.event.workflow_run.head_branch == github.event.repository.default_branch && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # workflow_run is privileged: never check out the triggering run's branch or artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
      - name: Report scheduled failures
        run: node scripts/report-nightly-failure.mjs
        env:
          GH_TOKEN: ${{ github.token }}

