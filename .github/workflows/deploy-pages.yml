name: deploy-github-pages

on:
  push:
    branches: [main]
  # Refreshes each catalogue's usage report once a day; the
  # time is ANALYTICS_REFRESH_UTC in scripts/lib/site-deploy.mjs.
  schedule:
    - cron: '17 4 * * *'
  # A dispatched run (by hand or by standalone-catalog.yml) publishes every site.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # The deploy plan reads this workflow's earlier runs on main.
  actions: read

concurrency:
  # Let a running deploy finish; GitHub keeps only the newest pending run, so
  # a burst of pushes ships its last commit instead of cancelling every deploy.
  group: neurodesk-webapps-pages
  cancel-in-progress: false

env:
  # CI never uses the CUDA providers; parallel postinstalls of two versions race on one temp path.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.plan.outputs.pages }}
      workers: ${{ steps.plan.outputs.workers }}
      verify: ${{ steps.plan.outputs.verify }}
      verify_hub: ${{ steps.plan.outputs.verify_hub }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-pages-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-pages-${{ runner.os }}-
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install pinned nightly toolchain
        run: rustup toolchain install nightly-2025-11-15 --component rust-src --target wasm32-unknown-unknown
      - name: Install wasm-pack 0.13.1
        uses: ./.github/actions/setup-wasm-pack
      - name: Set up wasm-opt
        uses: ./.github/actions/setup-wasm-opt
      - run: pnpm install --frozen-lockfile
      - name: Generate aggregate webapp analytics
        run: node scripts/write-analytics.mjs --allow-missing-credentials
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
      - run: pnpm build
      - run: pnpm audit:artifacts
      - name: Verify each catalogue site holds its apps and everything they load
        run: node --test test/catalog-sites.test.mjs
      # Publishes a site only when its content differs from the digest record its
      # host serves, or its usage report predates the daily refresh. A site whose
      # record cannot be read is published. Every site is published when the
      # previous deploy run on main that did any work was not green, so a failed
      # deploy or check is retried. The daily run checks every live site.
      - name: Decide which sites to publish
        id: plan
        run: node scripts/plan-site-deploy.mjs ${{ github.event_name == 'workflow_dispatch' && '--deploy-all' || github.event_name == 'schedule' && '--verify-all' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Content the hosts already serve passed these checks when it was published.
      - name: Install runtime startup test browser
        if: steps.plan.outputs.verify_build == 'true'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Verify threaded model loading before deployment
        if: steps.plan.outputs.verify_build == 'true'
        run: |
          node --test test/runtime-assets.test.mjs
          pnpm test:runtime-startup
      - uses: actions/configure-pages@v6
        if: steps.plan.outputs.pages == 'true'
      # webapps.neurodesk.org serves the neuro catalogue; the Worker sites deploy below.
      - uses: actions/upload-pages-artifact@v5
        if: steps.plan.outputs.pages == 'true'
        with:
          path: dist-sites/neuro
      - uses: actions/upload-artifact@v7
        if: steps.plan.outputs.workers != '[]'
        with:
          name: worker-sites
          path: |
            dist-sites/msk
            dist-sites/msk.wrangler.json
            dist-sites/microscopy
            dist-sites/microscopy.wrangler.json
            dist-sites/preclinical
            dist-sites/preclinical.wrangler.json
            dist-sites/hub
            dist-sites/hub.wrangler.json
          if-no-files-found: error
          retention-days: 1

  # Every build saves 1.2 GB under its own commit and restores only the newest.
  # The repository's caches share 10 GB, and GitHub evicts the least recently used
  # above it, so the superseded copies would push out Rust and reference-data caches.
  turbo-cache-retention:
    needs: build
    runs-on: ubuntu-latest
    # A cache left in place costs space, never a wrong result.
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Delete every turbo-pages- cache but the newest
        run: |
          gh cache list --ref "$CACHE_REF" --key turbo-pages- --sort created_at --order desc --limit 100 --json id --jq '.[1:][].id' |
            xargs --no-run-if-empty --max-args 1 gh cache delete
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CACHE_REF: ${{ github.ref }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # The neuro site's 404 page redirects moved apps to the Worker hosts, so
    # Pages deploys only once those hosts are live: after the Worker sites this
    # run publishes, or with none to publish, never after a failed one.
    needs: [build, deploy-workers]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.pages == 'true' && (needs.deploy-workers.result == 'success' || needs.deploy-workers.result == 'skipped') }}
    steps:
      - name: Deploy composite site
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Pages sometimes needs more than the default ten minutes to sync the site.
          timeout: 1200000
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browser
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Verify deployed cross-origin isolation
        run: pnpm test:deployed
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
          SITE_CATALOG: neuro
      - name: Verify standalone downloads in every deployed application
        run: node test/standalone-downloads.smoke.mjs
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
          SITE_CATALOG: neuro
      - name: Verify deployed NIfTI and DICOM scan pickers
        run: pnpm test:image-uploads
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
          SITE_CATALOG: neuro

  # mskapps.sciget.org, microscopyapps.sciget.org, preclinicalapps.sciget.org and the webapps.sciget.org hub are assets-only Cloudflare
  # Workers on custom domains (dist-sites/<site>.wrangler.json, written by the build).
  # The matrices list the sites the build's plan publishes, from the registry
  # (deploySites in scripts/lib/site-deploy.mjs).
  deploy-workers:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.workers != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.workers) }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/download-artifact@v8
        with:
          name: worker-sites
          path: dist-sites
      - name: Deploy the ${{ matrix.site }} site
        run: pnpm dlx wrangler@3.114.17 deploy --config dist-sites/${{ matrix.site }}.wrangler.json
      - name: Check the ${{ matrix.site }} site answers on its custom domain
        run: curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 15 --output /dev/null ${{ matrix.url }}

  # The checks below read the public hosts, not the build: they run for each
  # site this run publishes and, on the daily run, for every live site.
  verify-hub:
    runs-on: ubuntu-latest
    needs: [build, deploy-workers]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.verify_hub == 'true' && (needs.deploy-workers.result == 'success' || needs.deploy-workers.result == 'skipped') }}
    steps:
      - name: Check the hub lists every catalogue
        run: |
          page="$(curl --fail --silent --show-error --retry 5 --retry-all-errors https://webapps.sciget.org/)"
          for host in webapps.neurodesk.org mskapps.sciget.org microscopyapps.sciget.org preclinicalapps.sciget.org; do
            grep -q "href=\"https://$host/\"" <<< "$page" || { echo "hub does not link $host"; exit 1; }
          done

  # Browser checks run apart from the deploy so a flaky check cannot hold back
  # the Pages deploy. The Pages deploy job checks the neuro site it publishes.
  verify-sites:
    runs-on: ubuntu-latest
    needs: [build, deploy-workers]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.verify != '[]' && (needs.deploy-workers.result == 'success' || needs.deploy-workers.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.verify) }}
    env:
      BASE_URL: ${{ matrix.url }}
      SITE_CATALOG: ${{ matrix.site }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browser
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Verify deployed cross-origin isolation
        run: pnpm test:deployed
      - name: Verify standalone downloads in every deployed application
        run: node test/standalone-downloads.smoke.mjs
      - name: Verify deployed NIfTI and DICOM scan pickers
        run: pnpm test:image-uploads
