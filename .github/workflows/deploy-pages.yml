name: deploy-github-pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Let a running deploy finish; GitHub keeps only the newest pending run, so
  # a burst of pushes ships its last commit instead of cancelling every deploy.
  group: neurodesk-webapps-pages
  cancel-in-progress: false

env:
  # CI never uses the CUDA providers; parallel postinstalls of two versions race on one temp path.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-pages-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-pages-${{ runner.os }}-
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install pinned nightly toolchain
        run: rustup toolchain install nightly-2025-11-15 --component rust-src --target wasm32-unknown-unknown
      - name: Install wasm-pack 0.13.1
        uses: ./.github/actions/setup-wasm-pack
      - name: Set up wasm-opt
        uses: ./.github/actions/setup-wasm-opt
      - run: pnpm install --frozen-lockfile
      - name: Generate aggregate webapp analytics
        run: node scripts/write-analytics.mjs --allow-missing-credentials
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
      - run: pnpm build
      - run: pnpm audit:artifacts
      - name: Install runtime startup test browser
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Verify threaded model loading before deployment
        run: |
          node --test test/runtime-assets.test.mjs
          pnpm test:runtime-startup
      - name: Verify each catalogue site holds its apps and everything they load
        run: node --test test/catalog-sites.test.mjs
      - uses: actions/configure-pages@v6
      # webapps.neurodesk.org serves the neuro catalogue; the Worker sites deploy below.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-sites/neuro
      - uses: actions/upload-artifact@v7
        with:
          name: worker-sites
          path: |
            dist-sites/msk
            dist-sites/msk.wrangler.json
            dist-sites/microscopy
            dist-sites/microscopy.wrangler.json
            dist-sites/preclinical
            dist-sites/preclinical.wrangler.json
            dist-sites/hub
            dist-sites/hub.wrangler.json
          if-no-files-found: error

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # The neuro site's 404 page redirects moved apps to the Worker hosts, so
    # Pages deploys only once those hosts are live.
    needs: [build, deploy-workers]
    steps:
      - name: Deploy composite site
        id: deployment
        uses: actions/deploy-pages@v5
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browser
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Verify deployed cross-origin isolation
        run: pnpm test:deployed
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
          SITE_CATALOG: neuro
      - name: Verify standalone downloads in every deployed application
        run: node test/standalone-downloads.smoke.mjs
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
          SITE_CATALOG: neuro
      - name: Verify deployed NIfTI and DICOM scan pickers
        run: pnpm test:image-uploads
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
          SITE_CATALOG: neuro

  # mskapps.sciget.org, microscopyapps.sciget.org, preclinicalapps.sciget.org and the webapps.sciget.org hub are assets-only Cloudflare
  # Workers on custom domains (dist-sites/<site>.wrangler.json, written by the build).
  deploy-workers:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: msk
            url: https://mskapps.sciget.org/
          - site: microscopy
            url: https://microscopyapps.sciget.org/
          - site: preclinical
            url: https://preclinicalapps.sciget.org/
          - site: hub
            url: https://webapps.sciget.org/
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/download-artifact@v8
        with:
          name: worker-sites
          path: dist-sites
      - name: Deploy the ${{ matrix.site }} site
        run: pnpm dlx wrangler@3.114.17 deploy --config dist-sites/${{ matrix.site }}.wrangler.json
      - name: Check the ${{ matrix.site }} site answers on its custom domain
        run: curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 15 --output /dev/null ${{ matrix.url }}
      - name: Check the hub lists every catalogue
        if: matrix.site == 'hub'
        run: |
          page="$(curl --fail --silent --show-error --retry 5 --retry-all-errors ${{ matrix.url }})"
          for host in webapps.neurodesk.org mskapps.sciget.org microscopyapps.sciget.org preclinicalapps.sciget.org; do
            grep -q "href=\"https://$host/\"" <<< "$page" || { echo "hub does not link $host"; exit 1; }
          done

  # Browser checks run apart from the deploy so a flaky check cannot hold back
  # the Pages deploy.
  verify-workers:
    runs-on: ubuntu-latest
    needs: deploy-workers
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: msk
            url: https://mskapps.sciget.org/
          - site: microscopy
            url: https://microscopyapps.sciget.org/
          - site: preclinical
            url: https://preclinicalapps.sciget.org/
    env:
      BASE_URL: ${{ matrix.url }}
      SITE_CATALOG: ${{ matrix.site }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browser
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Verify deployed cross-origin isolation
        run: pnpm test:deployed
      - name: Verify standalone downloads in every deployed application
        run: node test/standalone-downloads.smoke.mjs
      - name: Verify deployed NIfTI and DICOM scan pickers
        run: pnpm test:image-uploads
