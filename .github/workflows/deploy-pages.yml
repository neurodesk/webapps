name: deploy-github-pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: neurodesk-webapps-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-pages-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-pages-${{ runner.os }}-
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: dtolnay/rust-toolchain@nightly-2025-11-15
        with:
          components: rust-src
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack 0.13.1
        run: cargo install wasm-pack --version 0.13.1 --locked
      - run: pnpm install --frozen-lockfile
      - name: Generate aggregate webapp analytics
        run: node scripts/write-analytics.mjs --allow-missing-credentials
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
      - run: pnpm build
      - run: pnpm audit:artifacts
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy composite site
        id: deployment
        uses: actions/deploy-pages@v5
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browser
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          pnpm exec playwright install --with-deps chromium
      - name: Verify deployed cross-origin isolation
        run: pnpm test:deployed
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
      - name: Verify deployed NIfTI and DICOM scan pickers
        run: pnpm test:image-uploads
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
