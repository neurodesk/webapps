name: carotid-flow-native

on:
  pull_request:
    paths:
      - '.github/workflows/carotid-flow-native.yml'
      - '.github/workflows/node-cli-portable.yml'
      - 'exes/node-cli/**'
      - 'exes/synthsr/scripts/ci_macos_release.sh'
      - 'exes/synthsr/scripts/notarize_macos.sh'
      - 'packages/carotid-flow/**'
      - 'packages/components/src/file-io/**'
      - 'packages/components/src/volume/**'
      - 'packages/components/src/automation/parameters.js'
      - 'apps/carotid-flow/**'
      - 'test/independent-workflows.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/carotid-flow-native.yml'
      - '.github/workflows/node-cli-portable.yml'
      - 'exes/node-cli/**'
      - 'exes/synthsr/scripts/ci_macos_release.sh'
      - 'exes/synthsr/scripts/notarize_macos.sh'
      - 'packages/carotid-flow/**'
      - 'packages/components/src/file-io/**'
      - 'packages/components/src/volume/**'
      - 'packages/components/src/automation/parameters.js'
      - 'apps/carotid-flow/**'
      - 'test/independent-workflows.test.mjs'
  workflow_dispatch:
    inputs:
      sign_release:
        description: Sign and notarize the macOS installer, then attach every verified package to the existing Carotid Flow release
        type: boolean
        default: false

concurrency:
  group: carotid-flow-native-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  portable:
    uses: ./.github/workflows/node-cli-portable.yml
    permissions:
      contents: write
    with:
      package: packages/carotid-flow
      targets: >-
        [{"os": "ubuntu-22.04", "platform": "linux-x64"},
         {"os": "windows-latest", "platform": "windows-x64"},
         {"os": "macos-15", "platform": "macos-arm64"}]
      publish_release: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release }}
      sign_release: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release }}
    secrets:
      APPLEID: ${{ secrets.APPLEID }}
      APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
      CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}
