name: syncro-native

on:
  pull_request:
    paths:
      - '.github/workflows/syncro-native.yml'
      - 'packages/syncro/**'
      - 'apps/syncro/**'
      - 'models/syncro-tutorials.manifest.json'
      - 'models/syncro.manifest.json'
      - 'packages/registration/**'
      - 'packages/greedy/src/index.js'
      - 'packages/greedy/src/single.js'
      - 'packages/greedy/wasm-single/**'
      - 'packages/synthsr/**'
      - 'packages/synthstrip/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/syncro-native.yml'
      - '.github/workflows/node-cli-portable.yml'
      - 'exes/node-cli/**'
      - 'packages/syncro/**'
      - 'apps/syncro/**'
      - 'models/syncro-tutorials.manifest.json'
      - 'models/syncro.manifest.json'
      - 'packages/registration/**'
      - 'packages/greedy/src/index.js'
      - 'packages/greedy/src/single.js'
      - 'packages/greedy/wasm-single/**'
      - 'packages/synthsr/**'
      - 'packages/synthstrip/**'
  workflow_dispatch:
    inputs:
      sign_release:
        description: Sign and notarize the macOS installer, then attach every verified package to the existing SYNcro release
        type: boolean
        default: false

concurrency:
  group: syncro-native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  portable:
    uses: ./.github/workflows/node-cli-portable.yml
    permissions:
      contents: write
      id-token: write
    with:
      package: packages/syncro
      targets: >-
        [{"os": "ubuntu-22.04", "platform": "linux-x64"},
         {"os": "windows-latest", "platform": "windows-x64"},
         {"os": "macos-15", "platform": "macos-arm64"}]
      publish_release: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release }}
      sign_release: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release }}
    secrets:
      APPLEID: ${{ secrets.APPLEID }}
      APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
      CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}
