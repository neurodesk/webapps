name: hmc-registration

# @neurodesk/hmc-registration's module worker must register the committed test pair in Chromium as
# it does in Node (pnpm test:packages runs the Node suite in ci.yml): recover the known rigid shift
# and write native antsRegistration's .mat, byte for byte.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - '.github/workflows/hmc-registration.yml'
      - 'packages/hmc-registration/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/hmc-registration.yml'
      - 'packages/hmc-registration/**'
  # A pull request that changes only paths in the gate's shared_paths starts native.yml instead,
  # which calls this workflow when the change reaches it; its nightly run is this workflow's sweep.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: hmc-registration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Defers drafts, and decides a ready pull request or a push from this workflow's own paths and
  # its shared_paths (scripts/lib/workflow-gate.mjs). Called from native.yml, which decided first,
  # it answers true.
  gate:
    if: (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft'))
    uses: ./.github/workflows/pr-gate.yml
    permissions:
      contents: read
      actions: read
      pull-requests: read
    with:
      workflow: hmc-registration
      shared_paths: |
        pnpm-lock.yaml

  browser-worker:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    name: Browser worker registers the test pair
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install frozen dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: pnpm install --frozen-lockfile
      - name: Install browser
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Run the module worker in Chromium
        run: pnpm --filter @neurodesk/hmc-registration test:browser
