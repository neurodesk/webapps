name: white-matter-lesions-native

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - '.github/workflows/white-matter-lesions-native.yml'
      - 'packages/white-matter-lesions/**'
      - 'apps/white-matter-lesions/**'
      - 'packages/synthsr/**'
      - 'packages/synthstrip/**'
      - 'packages/components/src/net/fetchWithRetry.js'
      - 'packages/components/src/net/stallGuard.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/white-matter-lesions-native.yml'
      - '.github/workflows/node-cli-portable.yml'
      - 'exes/node-cli/**'
      - 'packages/white-matter-lesions/**'
      - 'apps/white-matter-lesions/**'
      - 'packages/synthsr/**'
      - 'packages/synthstrip/**'
      - 'packages/components/src/net/fetchWithRetry.js'
      - 'packages/components/src/net/stallGuard.js'
  # A pull request that changes only paths in the gate's shared_paths starts native.yml instead,
  # which calls this workflow when the change reaches it; its nightly run is this workflow's sweep.
  workflow_call:
  workflow_dispatch:
    inputs:
      sign_release:
        description: Sign and notarize the macOS installer, then attach every verified package to the existing white matter lesions release
        type: boolean
        default: false

concurrency:
  group: white-matter-lesions-native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Defers drafts, and decides a ready pull request or a push from this workflow's own paths and
  # its shared_paths (scripts/lib/workflow-gate.mjs). Called from native.yml, which decided first,
  # it answers true.
  gate:
    if: (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft'))
    uses: ./.github/workflows/pr-gate.yml
    permissions:
      contents: read
      actions: read
      pull-requests: read
    with:
      workflow: white-matter-lesions-native
      shared_paths: |
        packages/components/package.json

  portable:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/node-cli-portable.yml
    permissions:
      contents: write
      id-token: write
    with:
      package: packages/white-matter-lesions
      targets: >-
        [{"os": "ubuntu-22.04", "platform": "linux-x64"},
         {"os": "windows-latest", "platform": "windows-x64"},
         {"os": "macos-15", "platform": "macos-arm64"}]
      publish_release: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release }}
      sign_release: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release }}
    secrets:
      APPLEID: ${{ secrets.APPLEID }}
      APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
      CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}

  browser-memory:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    name: Five-fold memory (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chrome
          - os: macos-15
            browser: safari
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: pnpm --filter white-matter-lesions build
      - if: matrix.browser == 'chrome'
        uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium
      - if: matrix.browser == 'safari'
        run: sudo safaridriver --enable
      - name: Cache FLAMeS models and example input
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/neurodesk-flames-validation
          key: flames-validation-${{ hashFiles('packages/white-matter-lesions/src/node.js', 'apps/white-matter-lesions/examples.json') }}
          restore-keys: flames-validation-
      - name: Measure completed ensemble and check unchanged browser reference
        run: node apps/white-matter-lesions/validation/browser-memory.mjs --browser '${{ matrix.browser }}' --model-dir "$HOME/.cache/neurodesk-flames-validation/models" --output '${{ runner.temp }}/flames-memory/receipt.json'
        env:
          TMPDIR: ${{ runner.temp }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: flames-memory-${{ matrix.browser }}
          path: ${{ runner.temp }}/flames-memory/
          if-no-files-found: error
          retention-days: 7
