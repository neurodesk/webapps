name: white-matter-lesions-native

on:
  pull_request:
    paths:
      - '.github/workflows/white-matter-lesions-native.yml'
      - '.github/workflows/node-cli-portable.yml'
      - 'exes/node-cli/**'
      - 'exes/synthsr/scripts/ci_macos_release.sh'
      - 'exes/synthsr/scripts/notarize_macos.sh'
      - 'packages/white-matter-lesions/**'
      - 'apps/white-matter-lesions/**'
      - 'packages/synthsr/**'
      - 'packages/synthstrip/**'
      - 'test/independent-workflows.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/white-matter-lesions-native.yml'
      - '.github/workflows/node-cli-portable.yml'
      - 'exes/node-cli/**'
      - 'exes/synthsr/scripts/ci_macos_release.sh'
      - 'exes/synthsr/scripts/notarize_macos.sh'
      - 'packages/white-matter-lesions/**'
      - 'apps/white-matter-lesions/**'
      - 'packages/synthsr/**'
      - 'packages/synthstrip/**'
      - 'test/independent-workflows.test.mjs'
  workflow_dispatch:
    inputs:
      sign_release:
        description: Sign and notarize the macOS installer, then attach every verified package to the existing white matter lesions release
        type: boolean
        default: false

concurrency:
  group: white-matter-lesions-native-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  portable:
    uses: ./.github/workflows/node-cli-portable.yml
    permissions:
      contents: write
    with:
      package: packages/white-matter-lesions
      targets: >-
        [{"os": "ubuntu-22.04", "platform": "linux-x64"},
         {"os": "windows-latest", "platform": "windows-x64"},
         {"os": "macos-15", "platform": "macos-arm64"}]
      publish_release: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release }}
      sign_release: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release }}
    secrets:
      APPLEID: ${{ secrets.APPLEID }}
      APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
      CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}

  browser-memory:
    name: Five-fold memory (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chrome
          - os: macos-15
            browser: safari
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: pnpm --filter white-matter-lesions build
      - if: matrix.browser == 'chrome'
        run: pnpm exec playwright install --with-deps chromium
      - if: matrix.browser == 'safari'
        run: sudo safaridriver --enable
      - name: Measure completed ensemble and check unchanged browser reference
        run: node apps/white-matter-lesions/validation/browser-memory.mjs --browser '${{ matrix.browser }}' --output '${{ runner.temp }}/flames-memory/receipt.json'
        env:
          TMPDIR: ${{ runner.temp }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: flames-memory-${{ matrix.browser }}
          path: ${{ runner.temp }}/flames-memory/
          if-no-files-found: error
