name: dwi2trx-native

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - '.github/workflows/dwi2trx-native.yml'
      - 'packages/dwi2trx/**'
      - 'packages/node-drivers/package.json'
      - 'packages/node-drivers/src/mindgrab-worker.js'
      - 'packages/node-drivers/src/mindgrab.js'
      - 'packages/node-drivers/src/niimath.js'
      - 'packages/components/**'
      - 'apps/dwi2trx/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/dwi2trx-native.yml'
      - '.github/workflows/node-cli-portable.yml'
      - 'exes/node-cli/**'
      - 'packages/dwi2trx/**'
      - 'packages/node-drivers/package.json'
      - 'packages/node-drivers/src/mindgrab-worker.js'
      - 'packages/node-drivers/src/mindgrab.js'
      - 'packages/node-drivers/src/niimath.js'
      - 'packages/components/**'
      - 'apps/dwi2trx/**'
  workflow_dispatch:
    inputs:
      sign_release:
        description: Sign and notarize the macOS installer, then attach every verified package to the existing DWI2TRX release
        type: boolean
        default: false
      tracking_only:
        description: Run only the real-data Metal tractography diagnostic
        type: boolean
        default: false

concurrency:
  group: dwi2trx-native-${{ github.ref }}${{ inputs.tracking_only && '-tracking' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Fits the pinned example through the built web app, given the command line's MindGrab mask, and
  # compares its maps with packages/dwi2trx/validation/dwi-gradients-reference.json, the reference
  # the archives are held to.
  web-app-reference:
    if: github.event_name != 'workflow_dispatch' || !inputs.tracking_only
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: pnpm
      - name: Install frozen dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: pnpm install --frozen-lockfile
      - name: Install browser
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Fit the pinned example in the web app
        env:
          DWI2TRX_BROWSER_REFERENCE: check
        run: pnpm --filter dwi2trx exec playwright test e2e/reference.spec.js --reporter=line

  # Archives are built, and published, only once the web app still matches the reference they are
  # held to.
  portable:
    if: github.event_name != 'workflow_dispatch' || !inputs.tracking_only
    needs: web-app-reference
    uses: ./.github/workflows/node-cli-portable.yml
    permissions:
      contents: write
      id-token: write
    with:
      package: packages/dwi2trx
      targets: >-
        [{"os": "ubuntu-22.04", "platform": "linux-x64"},
         {"os": "windows-latest", "platform": "windows-x64"},
         {"os": "macos-15", "platform": "macos-arm64"}]
      publish_release: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release }}
      sign_release: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release }}
    secrets:
      APPLEID: ${{ secrets.APPLEID }}
      APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
      CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}

  tracking:
    if: github.event_name == 'workflow_dispatch' && inputs.tracking_only
    runs-on: macos-15
    timeout-minutes: 40
    env:
      NEURODESK_HARDWARE_GPU: '1'
      NEURODESK_HARDWARE_GPU_VENDOR: apple
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install full Chromium
        run: node node_modules/@playwright/test/cli.js install chromium
      - name: Check that Chromium reaches Metal
        run: node scripts/probe-hardware-gpu.mjs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/neurodesk-e2e-test-data
          key: dwi2trx-tracking-${{ runner.os }}-${{ hashFiles('scripts/lib/e2e-test-data.mjs', 'validation/dwi-vendors/sources.json') }}
      - name: Provision pinned tracking inputs
        shell: bash
        run: node scripts/e2e-test-data.mjs dwi2trx ~/.cache/neurodesk-e2e-test-data | tee -a "$GITHUB_ENV"
      - run: pnpm --filter dwi2trx build
      - name: Track the real-data crop on Metal
        env:
          NEURODESK_E2E_PREBUILT: '1'
        run: pnpm --filter dwi2trx exec playwright test e2e/dispatch.spec.js e2e/real-data.spec.js --workers=1 --trace=on --reporter=line
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: dwi2trx-tracking-diagnostic
          path: apps/dwi2trx/test-results/
          if-no-files-found: error
          retention-days: 7
