name: standalone-links

# Checks that every download, Apptainer image, Docker Hub tag and OpenRecon recipe the Standalone
# dialogs offer still resolves. The links can break with no change here (Neurocontainers removes a
# superseded .simg when it rebuilds a version), so this runs nightly and after catalog changes reach
# main, never as a pull request gate: a network failure says nothing about the change under review.
on:
  schedule:
    - cron: '47 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - registry/standalone.json
      - registry/neurocontainers.json
      - scripts/check-standalone-links.mjs
      - scripts/repin-neurocontainers.mjs
      - .github/workflows/standalone-links.yml

permissions:
  contents: read

concurrency:
  group: standalone-links-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
      # The script uses only Node built-ins, so no install step is needed.
      - name: Check Standalone links
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-standalone-links.mjs 2>&1 | tee "$RUNNER_TEMP/links.log"
      - name: Summarize broken links
        if: failure()
        run: |
          {
            echo '## Broken Standalone links'
            echo '```'
            grep -v '^ok ' "$RUNNER_TEMP/links.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Neurocontainers deletes a .simg when it rebuilds a version. When that broke
  # the check, pin the build each version's release metadata now names and open
  # (or refresh) one pull request for a person to review.
  repin:
    needs: links
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: standalone-links-repin
    env:
      BASE: main
      BRANCH: bot/repin-neurocontainers
    steps:
      # An App token, unlike GITHUB_TOKEN, starts CI on the pull request it opens.
      # Setup: docs/architecture/upstream-sync.md.
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.UPSTREAM_SYNC_CLIENT_ID }}
          private-key: ${{ secrets.UPSTREAM_SYNC_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
      - name: Commit as the App
        id: bot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          name="$SLUG[bot]"
          git config user.name "$name"
          git config user.email "$(gh api "/users/$name" --jq .id)+$name@users.noreply.github.com"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Re-pin rebuilt containers
        id: repin
        env:
          BOT: ${{ steps.bot.outputs.name }}
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          if git rev-parse -q --verify "origin/$BRANCH" >/dev/null \
            && git log --format='%an%n%cn' "origin/$BASE..origin/$BRANCH" | grep -qvxF "$BOT"; then
            echo "::notice::$BRANCH has commits from a person; merge or delete it to resume re-pinning."
            exit 0
          fi
          summary=$(node scripts/repin-neurocontainers.mjs --write --body "$RUNNER_TEMP/body.md")
          echo "$summary"
          jq -r '.unresolved[] | "::warning::\(.key) (\(.apptainerName)) not re-pinned: \(.reason)"' <<<"$summary"
          echo "count=$(jq '.repinned | length' <<<"$summary")" >> "$GITHUB_OUTPUT"
          echo "names=$(jq -r '.repinned | join(", ")' <<<"$summary")" >> "$GITHUB_OUTPUT"
      - name: Open or refresh the pull request
        if: steps.repin.outputs.count > 0
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          NAMES: ${{ steps.repin.outputs.names }}
        run: |
          title="fix(registry): re-pin rebuilt Neurocontainers images ($NAMES)"
          git checkout -B "$BRANCH"
          git commit -qam "$title"
          if git rev-parse -q --verify "origin/$BRANCH" >/dev/null && git diff --quiet "origin/$BRANCH" HEAD; then
            echo "$BRANCH already has these pins."
          else
            expected=$(git rev-parse -q --verify "origin/$BRANCH" || true)
            remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push --force-with-lease="refs/heads/$BRANCH:$expected" "$remote" "$BRANCH"
          fi
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            gh pr create --base "$BASE" --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr edit "$pr" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi

