name: vesselboost-native

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - '.github/workflows/vesselboost-native.yml'
      - 'packages/vesselboost/**'
      - 'apps/vesselboost/**'
      - 'packages/components/src/inference/workerProtocol.js'
      - 'packages/components/src/net/fetchWithRetry.js'
      - 'packages/components/src/net/stallGuard.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/vesselboost-native.yml'
      - '.github/workflows/node-cli-portable.yml'
      - 'exes/node-cli/**'
      - 'packages/vesselboost/**'
      - 'apps/vesselboost/**'
      - 'packages/components/src/inference/workerProtocol.js'
      - 'packages/components/src/net/fetchWithRetry.js'
      - 'packages/components/src/net/stallGuard.js'
  # A pull request that changes only paths in the gate's shared_paths starts native.yml instead,
  # which calls this workflow when the change reaches it; its nightly run is this workflow's sweep.
  workflow_call:
  workflow_dispatch:
    inputs:
      sign_release:
        description: Sign and notarize the macOS installer, then attach every verified package to the existing VesselBoost release
        type: boolean
        default: false

concurrency:
  group: vesselboost-native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Defers drafts, and decides a ready pull request or a push from this workflow's own paths and
  # its shared_paths (scripts/lib/workflow-gate.mjs). Called from native.yml, which decided first,
  # it answers true.
  gate:
    if: (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft'))
    uses: ./.github/workflows/pr-gate.yml
    permissions:
      contents: read
      actions: read
      pull-requests: read
    with:
      workflow: vesselboost-native
      shared_paths: |
        packages/components/package.json
        packages/components/src/worker/**
        packages/components/src/volume/**
        packages/components/src/file-io/**

  portable:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/node-cli-portable.yml
    permissions:
      contents: write
      id-token: write
    with:
      package: packages/vesselboost
      validation_app: vesselboost
      targets: >-
        [{"os": "ubuntu-22.04", "platform": "linux-x64"},
         {"os": "windows-latest", "platform": "windows-x64"},
         {"os": "macos-15", "platform": "macos-arm64"}]
      publish_release: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release }}
      sign_release: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release }}
    secrets:
      APPLEID: ${{ secrets.APPLEID }}
      APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
      CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}

  preprocessing-source:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    name: Reproduce required Rust preprocessing
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Install exact Rust toolchain and wasm-bindgen
        run: |
          rustup toolchain install 1.98.0 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.98.0
          task_bindgen_dir="$(mktemp -d "$RUNNER_TEMP/vesselboost-bindgen.XXXXXX")"
          curl --fail --location --retry 3 \
            https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.114/wasm-bindgen-0.2.114-x86_64-unknown-linux-musl.tar.gz \
            --output "$task_bindgen_dir/bindgen.tar.gz"
          echo "ce21be002bdbc22ede2a5cf250cb801d2106956fc3c529c75d9452729db3490c  $task_bindgen_dir/bindgen.tar.gz" | sha256sum --check
          tar -xzf "$task_bindgen_dir/bindgen.tar.gz" -C "$task_bindgen_dir"
          echo "$task_bindgen_dir/wasm-bindgen-0.2.114-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
        env:
          CARGO_BUILD_JOBS: 2
      - name: Set up wasm-pack
        uses: ./.github/actions/setup-wasm-pack
      - name: Build locked source and compare every committed artifact byte
        run: |
          bash packages/vesselboost/scripts/build-preprocessing.sh
          git diff --exit-code -- packages/vesselboost/preprocessing/
        env:
          CARGO_BUILD_JOBS: 2
