name: release-apps

on:
  workflow_dispatch:
    inputs:
      apps:
        description: Comma-separated app ids, or "affected"
        required: true
        default: affected
      base_sha:
        description: Base commit used when apps=affected
        required: false
        default: HEAD~1

permissions:
  contents: write

concurrency:
  group: neurodesk-webapps-release
  cancel-in-progress: false

jobs:
  app-plan:
    runs-on: ubuntu-latest
    outputs:
      release_apps: ${{ steps.plan.outputs.release_apps }}
      has_release_apps: ${{ steps.plan.outputs.has_release_apps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate release plan from the app catalog
        id: plan
        env:
          APPS: ${{ inputs.apps }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          if [[ "$APPS" == "affected" ]]; then
            node scripts/app-plan.mjs --base "${BASE_SHA:-HEAD~1}" --head HEAD
          else
            node scripts/app-plan.mjs --only "$APPS"
          fi

  verify:
    needs: app-plan
    if: needs.app-plan.outputs.has_release_apps == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.app-plan.outputs.release_apps) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.rust_wasm
        with:
          targets: wasm32-unknown-unknown
      - name: Install pinned nightly toolchain
        if: matrix.rust_wasm
        run: rustup toolchain install nightly-2025-11-15 --component rust-src --target wasm32-unknown-unknown
      - name: Install wasm-pack 0.13.1
        if: matrix.rust_wasm
        run: cargo install wasm-pack --version 0.13.1 --locked
      - uses: actions/setup-python@v7
        if: matrix.python_reference
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - name: Install Python reference dependencies
        if: matrix.python_reference
        run: pip install -r apps/${{ matrix.app }}/requirements.txt nibabel
      - name: Test app-scoped runtime worker scope
        if: matrix.app_scoped_runtime
        run: node --test test/runtime-worker-scope.test.mjs test/runtime-assets-rewrite.test.mjs
      - name: Test app
        env:
          APP: ${{ matrix.app }}
          RELEASE_TEST: ${{ matrix.release_test }}
        run: pnpm --filter "$APP" run "$RELEASE_TEST"
      - name: Build standalone app bundle
        run: pnpm --filter ${{ matrix.app }} build
      - name: Install browser
        if: matrix.browser_test
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          pnpm exec playwright install --with-deps chromium
      - name: Test app in a browser
        if: matrix.browser_test
        run: pnpm --filter ${{ matrix.app }} test:e2e
      - name: Apply Neurodesk app theme
        run: node scripts/theme-app-dist.mjs --app ${{ matrix.app }}
      - name: Enforce standalone artifact budgets
        run: node scripts/audit-artifacts.mjs --app ${{ matrix.app }}
      - name: Package standalone app bundle
        env:
          APP: ${{ matrix.app }}
        run: |
          VERSION="$(node -p "require('./apps/${APP}/package.json').version")"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version for ${APP}: ${VERSION}"
            exit 1
          fi
          (cd "apps/${APP}/dist" && zip -qr "${GITHUB_WORKSPACE}/${APP}-${VERSION}-web.zip" .)
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.app }}
          path: ${{ matrix.app }}-*-web.zip
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [app-plan, verify]
    if: needs.app-plan.outputs.has_release_apps == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.app-plan.outputs.release_apps) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ matrix.app }}
          path: release-bundle
      - name: Create app release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP: ${{ matrix.app }}
        run: |
          VERSION="$(node -p "require('./apps/${APP}/package.json').version")"
          TAG="${APP}-v${VERSION}"
          ARCHIVE="release-bundle/${APP}-${VERSION}-web.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "${APP} v${VERSION}" \
              --generate-notes \
              "$ARCHIVE"
          fi
