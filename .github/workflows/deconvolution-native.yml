name: deconvolution-native

# The Rust core behind packages/deconvolution and its portable CLI. The core must pass
# its unit tests natively and build for wasm32, the committed WebAssembly module in
# packages/deconvolution/wasm must equal a rebuild from source with the pinned toolchain, and
# the package tests hold the committed module to the scikit-image, psfmodels and quadrature
# references in packages/deconvolution/validation.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - '.github/workflows/deconvolution-native.yml'
      - '.github/actions/setup-wasm-opt/**'
      - 'exes/deconvolution/**'
      - 'packages/deconvolution/**'
      - 'apps/deconvolution/**'
      - 'packages/components/src/automation/abort.js'
      - 'scripts/deconvolution-third-party-notices.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deconvolution-native.yml'
      - '.github/workflows/node-cli-portable.yml'
      - '.github/actions/setup-wasm-opt/**'
      - 'exes/node-cli/**'
      - 'exes/deconvolution/**'
      - 'packages/deconvolution/**'
      - 'apps/deconvolution/**'
      - 'packages/components/src/automation/abort.js'
      - 'scripts/deconvolution-third-party-notices.py'
  # A pull request that changes only paths in the gate's shared_paths starts native.yml instead,
  # which calls this workflow when the change reaches it; its nightly run is this workflow's sweep.
  workflow_call:
  workflow_dispatch:
    inputs:
      sign_release:
        description: Sign and notarize the macOS installer, then attach every verified package to the existing Deconvolution release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deconvolution-native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Release bookkeeping (changelogs, version bumps) runs this workflow neither
  # for a pull request nor for a push to main (scripts/lib/workflow-gate.mjs).
  gate:
    if: (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft'))
    uses: ./.github/workflows/pr-gate.yml
    permissions:
      contents: read
      actions: read
      pull-requests: read
    with:
      workflow: deconvolution-native
      shared_paths: |
        packages/components/package.json
        packages/components/src/file-io/**

  test:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    name: core tests and package tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: pnpm
      - name: Install frozen dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: pnpm install --frozen-lockfile
      - name: Core unit tests
        run: cargo test --release --manifest-path exes/deconvolution/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path exes/deconvolution/Cargo.toml --all-targets -- -D warnings
      - name: WebAssembly build
        run: cargo build --release --target wasm32-unknown-unknown -p deconvolution-wasm --manifest-path exes/deconvolution/Cargo.toml
      - name: Third-party notices match the locked Cargo graph
        run: python3 scripts/deconvolution-third-party-notices.py --check
      - name: Package tests on the committed module
        run: pnpm --filter @neurodesk/deconvolution test

  wasm-source:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    name: committed WASM equals a rebuild from source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
      - name: Set up wasm-pack
        uses: ./.github/actions/setup-wasm-pack
      - name: Set up wasm-opt
        uses: ./.github/actions/setup-wasm-opt
      - name: Rebuild and compare
        run: bash packages/deconvolution/scripts/build-wasm.sh --check

  portable:
    needs: [test, wasm-source]
    uses: ./.github/workflows/node-cli-portable.yml
    permissions:
      contents: write
      id-token: write
    with:
      package: packages/deconvolution
      targets: >-
        [{"os": "ubuntu-22.04", "platform": "linux-x64"},
         {"os": "windows-latest", "platform": "windows-x64"},
         {"os": "macos-15", "platform": "macos-arm64"}]
      publish_release: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release }}
      sign_release: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release }}
    secrets:
      APPLEID: ${{ secrets.APPLEID }}
      APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
      CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}
