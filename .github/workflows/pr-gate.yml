name: pr-gate

# Decides whether a path-filtered workflow has to run for a ready pull request,
# a push to main or its nightly sweep. GitHub matches `paths` against the whole
# pull request on every push, so a filter on a shared tree starts suites the
# change never reaches. Callers keep those filters for pull requests and make
# their entry jobs wait for this decision (scripts/lib/workflow-gate.mjs). A
# ready pull request over its full-plan budget fails the gate where its ci run
# withholds the full plan too. A push to main starts a caller only for its own
# paths, and runs it unless they are only release bookkeeping; its schedule is
# the sweep, which runs it when a shared path changed on main since the caller
# last finished green there. A push and the sweep each also ask the other's
# question, since either can skip and still finish green. The job finishes
# unless the budget withholds the suite, so the jobs after a caller's entry
# jobs keep their default conditions: a draft answers false and a dispatch
# true, both without a checkout. A withheld suite fails its gate instead of
# reading as green.

on:
  workflow_call:
    inputs:
      workflow:
        description: The calling workflow's file name without .yml
        type: string
        required: true
    outputs:
      run:
        description: "'true' when the pull request, or main since the last sweep, reaches what the workflow tests"
        value: ${{ jobs.decide.outputs.run }}

# The sweep and a push ask the Actions API where the calling workflow last
# finished green, and a pull request reads its ci runs and labels for the
# budget. A caller's gate job grants the same three permissions.
permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.event.outputs.run || steps.decide.outputs.run }}
    steps:
      - name: Answer for drafts and dispatches
        id: event
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            if [ "$DRAFT" = true ]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$EVENT_NAME" != schedule ] && [ "$EVENT_NAME" != push ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.event.outputs.run == ''
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: steps.event.outputs.run == ''
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.event.outputs.run == ''
        with:
          node-version: 22
          cache: pnpm
      - name: Install frozen dependencies
        if: steps.event.outputs.run == ''
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: pnpm install --frozen-lockfile
      - name: Decide whether the change reaches this workflow
        if: steps.event.outputs.run == ''
        id: decide
        env:
          WORKFLOW: ${{ inputs.workflow }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT_NAME" = schedule ]; then
            node scripts/workflow-gate.mjs --workflow "$WORKFLOW" --sweep --head "$HEAD_SHA"
          elif [ "$EVENT_NAME" = push ]; then
            node scripts/workflow-gate.mjs --workflow "$WORKFLOW" --push --head "$HEAD_SHA"
          else
            node scripts/workflow-gate.mjs --workflow "$WORKFLOW" --base "$BASE_SHA" --head "$HEAD_SHA"
          fi
