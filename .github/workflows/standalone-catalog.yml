name: standalone-catalog

# A native release job announces its verified archives here; this run writes them into
# registry/standalone.json on main and redeploys the site so each app's Standalone dialog lists them.
on:
  repository_dispatch:
    types: [standalone-catalog]
  workflow_dispatch:
    inputs:
      releases:
        description: Comma-separated app@VERSION releases whose archives are already attached
        type: string
        required: true

concurrency:
  group: standalone-catalog
  cancel-in-progress: false

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    env:
      RELEASES: ${{ github.event.client_payload.releases || inputs.releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Import the releases into the catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IFS=',' read -ra releases <<< "$RELEASES"
          node scripts/desktop/import-native-releases.mjs "${releases[@]}"
          node --test test/standalone.test.mjs
      - name: Commit the catalog to main
        id: commit
        run: |
          if git diff --quiet registry/standalone.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(standalone): publish ${RELEASES//,/, } downloads" registry/standalone.json
          for attempt in 1 2 3; do
            git push origin HEAD:main && break
            git pull --rebase origin main
          done
          git diff --quiet origin/main HEAD
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Redeploy the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
