name: sct-full-tests

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: sct-full-tests-${{ github.ref }}
  cancel-in-progress: false

env:
  # CI never uses the CUDA providers; parallel postinstalls of two versions race on one temp path.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SCT_WORKER_TIMEOUT_MINUTES: '30'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run full SCT suite
        id: tests
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter spinalcordtoolbox test 2>&1 | tee "$RUNNER_TEMP/sct-full-tests.log"
      - name: Summarize failures
        if: failure() && steps.tests.outcome == 'failure'
        run: node apps/spinalcordtoolbox/scripts/summarize_test_failures.cjs "$RUNNER_TEMP/sct-full-tests.log" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: sct-full-test-log
          path: ${{ runner.temp }}/sct-full-tests.log
