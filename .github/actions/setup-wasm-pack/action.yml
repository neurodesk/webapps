name: Set up wasm-pack
description: Cache the pinned wasm-pack executable independently of app build caches.
runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      id: cache
      with:
        path: |
          ~/.cargo/bin/wasm-pack
          ~/.cargo/bin/wasm-pack.exe
        key: wasm-pack-${{ runner.os }}-${{ runner.arch }}-0.13.1
    - name: Install wasm-pack
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install wasm-pack --version 0.13.1 --locked --force
